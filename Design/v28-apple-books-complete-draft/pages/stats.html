<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>

    <style id="theme-vars">

  --ty-radius-sm: 4px;
  --ty-radius-md: 8px;

  --ty-radius-full: 9999px;

  --ty-font-serif: "Songti SC", "Noto Serif SC", serif;
  --ty-font-mono: "SF Mono", ui-monospace, Menlo, monospace;
  --ty-shadow-hairline: 0 1px 2px rgba(0, 0, 0, 0.04);
  --ty-shadow-float: 0 12px 32px rgba(0, 0, 0, 0.14);
}

.dark {
  --ty-background: var(--ty-neutral-950);
  --ty-foreground: #F5F5F5;
  --ty-card: #1B1B1B;
  --ty-card-foreground: #F5F5F5;
  --ty-popover: #1B1B1B;
  --ty-popover-foreground: #F5F5F5;
  --ty-primary: #F5F5F5;
  --ty-primary-foreground: #121212;
  --ty-muted: #242424;
  --ty-muted-foreground: #A3A3A3;
  --ty-border: #2C2C2C;
  --ty-input: #2C2C2C;
  --ty-ring: #F5F5F5;
  --ty-surface-sunken: #181818;
  --ty-hairline: #2C2C2C;
  --ty-shadow-hairline: 0 1px 2px rgba(0, 0, 0, 0.30);
  --ty-shadow-float: 0 12px 32px rgba(0, 0, 0, 0.45);
}

.ty-display,
.ty-h1,
.ty-h2,
.ty-h3,
.ty-body,
.ty-caption,
.ty-label {
  font-family: var(--ty-font-sans);
}

.ty-display { font-weight: 700; line-height: 1.18; letter-spacing: -0.025em; }
.ty-h1 { font-weight: 700; line-height: 1.22; letter-spacing: -0.02em; }
.ty-h2 { font-weight: 600; line-height: 1.28; letter-spacing: -0.01em; }
.ty-h3 { font-weight: 600; line-height: 1.35; }
.ty-body { font-weight: 400; line-height: 1.6; }
.ty-caption { font-weight: 400; font-size: 13px; line-height: 1.5; }
.ty-label { font-weight: 500; font-size: 13px; line-height: 1.4; }
.ty-reading { font-family: var(--ty-font-serif); font-weight: 400; line-height: 1.95; }
.ty-numeric { font-family: var(--ty-font-sans); font-variant-numeric: tabular-nums; }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">

  }

</head>
<body class="min-h-screen font-sans antialiased">
<main class="stats-page">
<style id="critical-layout">
.stats-page{min-height:100vh;width:100%;margin:0;background:var(--ty-surface-sunken);color:var(--ty-foreground);font-family:var(--ty-font-sans)}
.stats-page,.stats-page *,.stats-page *::before,.stats-page *::after{box-sizing:border-box}
.stats-shell{width:100%;max-width:430px;min-height:100vh;margin:0 auto;background:var(--ty-background)}
.topbar{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px;min-height:52px;padding:env(safe-area-inset-top,0px) 8px 0;border-bottom:1px solid var(--ty-hairline)}
.topbar h1{margin:0;font-size:17px;font-weight:600;line-height:1.3;text-align:center;letter-spacing:-.01em}
.icon-button{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;min-width:44px;padding:0;border:0;border-radius:var(--ty-radius-md);background:transparent;color:var(--ty-foreground);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background-color 140ms ease,opacity 140ms ease}
.icon-button svg{width:22px;height:22px;stroke-width:1.5}
.icon-button:active{opacity:.6}
.icon-button:focus-visible,.range-tab:focus-visible,.text-action:focus-visible{outline:2px solid var(--ty-ring);outline-offset:-2px}
.stats-content{padding:20px 20px 32px}
.range-switch{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;width:100%;padding:2px;border-radius:var(--ty-radius-md);background:var(--ty-muted)}
.range-tab{min-width:0;min-height:44px;padding:0 4px;border:0;border-radius:6px;background:transparent;color:var(--ty-muted-foreground);font-family:var(--ty-font-sans);font-size:14px;cursor:pointer;transition:background-color 140ms ease,color 140ms ease,opacity 140ms ease}
.range-tab[aria-pressed="true"]{background:var(--ty-background);color:var(--ty-foreground);box-shadow:var(--ty-shadow-hairline)}
.range-tab:active{opacity:.65}
.summary{padding:28px 0 24px}
.range-label{margin:0 0 8px;color:var(--ty-muted-foreground);font-size:13px;line-height:1.5}
.reading-total{margin:0;font-size:38px;font-weight:600;line-height:1.2;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.summary-note{margin:8px 0 0;color:var(--ty-muted-foreground);font-size:14px;line-height:1.55}
.chart-section,.goal-section,.rhythm-section{padding:24px 0;border-top:1px solid var(--ty-hairline)}
.section-heading{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 20px}
.section-heading h2{margin:0;font-size:20px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
.section-heading span{color:var(--ty-muted-foreground);font-size:12px;line-height:1.4;white-space:nowrap}
.chart-figure{margin:0}
.bar-chart{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;height:176px}
.y-axis{display:flex;flex-direction:column;justify-content:space-between;padding:0 0 1px;color:var(--ty-muted-foreground);font-size:11px;line-height:1;text-align:right;font-variant-numeric:tabular-nums}
.bar-area{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;gap:12px;min-width:0;border-left:1px solid var(--ty-hairline);border-bottom:1px solid var(--ty-hairline);padding:0 8px}
.bar-column{display:flex;height:100%;min-width:0;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px}
.bar-value{flex-shrink:0;color:var(--ty-muted-foreground);font-size:11px;line-height:1;font-variant-numeric:tabular-nums}
.bar{display:block;flex-shrink:0;width:100%;max-width:26px;height:var(--bar);min-height:2px;border-radius:var(--ty-radius-sm) var(--ty-radius-sm) 0 0;background:var(--ty-foreground)}
.x-axis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:10px 0 0 42px;padding:0 8px}
.x-label{display:flex;min-width:0;flex-direction:column;align-items:center;gap:2px;color:var(--ty-muted-foreground);font-size:11px;line-height:1.35;text-align:center;white-space:nowrap}
.chart-note{margin:14px 0 0;color:var(--ty-muted-foreground);font-size:12px;line-height:1.5}
.goal-current{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:baseline}
.goal-current h3,.goal-empty h3{margin:0;font-size:16px;font-weight:500;line-height:1.4}
.goal-value{font-size:14px;line-height:1.4;font-variant-numeric:tabular-nums;white-space:nowrap}
.goal-current p{grid-column:1/-1;margin:0;color:var(--ty-muted-foreground);font-size:13px;line-height:1.5}
.goal-progress{grid-column:1/-1;width:100%;height:4px;border:0;border-radius:var(--ty-radius-sm);background:var(--ty-muted);appearance:none}
.goal-progress::-webkit-progress-bar{border-radius:var(--ty-radius-sm);background:var(--ty-muted)}
.goal-progress::-webkit-progress-value{border-radius:var(--ty-radius-sm);background:var(--ty-primary)}
.goal-progress::-moz-progress-bar{border-radius:var(--ty-radius-sm);background:var(--ty-primary)}
.goal-empty{margin-top:20px;padding-top:20px;border-top:1px solid var(--ty-hairline)}
.goal-empty p{margin:6px 0 8px;color:var(--ty-muted-foreground);font-size:14px;line-height:1.5}
.text-action{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;margin-left:-10px;padding:0 10px;border:0;border-radius:var(--ty-radius-md);background:transparent;color:var(--ty-foreground);font-family:var(--ty-font-sans);font-size:15px;cursor:pointer;transition:background-color 140ms ease,opacity 140ms ease}
.text-action svg{width:18px;height:18px;stroke-width:1.5}
.text-action:active{opacity:.6}
.rhythm-list{margin:0}
.rhythm-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start;padding:12px 0;border-top:1px solid var(--ty-hairline)}
.rhythm-row:first-child{padding-top:0;border-top:0}
.rhythm-row:last-child{padding-bottom:0}
.rhythm-row dt{color:var(--ty-muted-foreground);font-size:14px;line-height:1.55}
.rhythm-row dd{margin:0;font-size:14px;line-height:1.55;text-align:right;font-variant-numeric:tabular-nums}
.page-footer{padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ty-hairline);background:var(--ty-surface-sunken);color:var(--ty-muted-foreground);font-size:12px;line-height:1.6;text-align:center}
.page-footer p{margin:0}.page-footer p+p{margin-top:4px}
@media(hover:hover){.icon-button:hover,.text-action:hover{background:var(--ty-muted)}.range-tab:hover{color:var(--ty-foreground)}}
@media(max-width:350px){.stats-content{padding-right:16px;padding-left:16px}.bar-area,.x-axis{gap:8px}.reading-total{font-size:34px}}
@media(prefers-reduced-motion:reduce){.icon-button,.range-tab,.text-action{transition-duration:.01ms}}
</style>
<div class="stats-shell">
<header class="topbar">
<button type="button" class="icon-button" data-dom-id="stats-back-profile" aria-label="返回我的"><i data-lucide="chevron-left" aria-hidden="true"></i></button>
<h1>阅读统计</h1>
<button type="button" class="icon-button" data-dom-id="open-calendar" aria-label="打开阅读日历"><i data-lucide="calendar-days" aria-hidden="true"></i></button>
</header>
<div class="stats-content">
<nav class="range-switch" aria-label="统计时间范围">
<button type="button" class="range-tab" aria-pressed="false">日</button>
<button type="button" class="range-tab" aria-pressed="true">周</button>
<button type="button" class="range-tab" aria-pressed="false">月</button>
<button type="button" class="range-tab" aria-pressed="false">年</button>
<button type="button" class="range-tab" aria-pressed="false">全部</button>
</nav>
<section class="summary" aria-labelledby="week-range">
<p class="range-label" id="week-range">10月26日—10月30日 · 本周</p>
<p class="reading-total"><data value="PT3H42M">3小时42分</data></p>
<p class="summary-note">5 个阅读日 · 日均 44 分钟</p>
</section>
<section class="chart-section" aria-labelledby="daily-chart-title">
<div class="section-heading"><h2 id="daily-chart-title">每日阅读</h2><span>单位：分钟</span></div>
<figure class="chart-figure">
<div class="bar-chart" role="img" aria-label="10月26日至30日阅读时长依次为26、38、52、60、46分钟，纵轴刻度0至90分钟">
<div class="y-axis" aria-hidden="true"><span>90</span><span>60</span><span>30</span><span>0</span></div>
<div class="bar-area" aria-hidden="true">
<div class="bar-column"><span class="bar-value">26</span><span class="bar" style="--bar:29%"></span></div>
<div class="bar-column"><span class="bar-value">38</span><span class="bar" style="--bar:42%"></span></div>
<div class="bar-column"><span class="bar-value">52</span><span class="bar" style="--bar:58%"></span></div>
<div class="bar-column"><span class="bar-value">60</span><span class="bar" style="--bar:67%"></span></div>
<div class="bar-column"><span class="bar-value">46</span><span class="bar" style="--bar:51%"></span></div>
</div>
</div>
<div class="x-axis" aria-hidden="true">
<span class="x-label"><span>26</span><span>周一</span></span><span class="x-label"><span>27</span><span>周二</span></span><span class="x-label"><span>28</span><span>周三</span></span><span class="x-label"><span>29</span><span>周四</span></span><span class="x-label"><span>30</span><span>周五</span></span>
</div>
<figcaption class="chart-note">横轴：2026年10月日期；纵轴：每日阅读分钟数。</figcaption>
</figure>
</section>
<section class="goal-section" aria-labelledby="goal-title">
<div class="section-heading"><h2 id="goal-title">阅读目标</h2><span>今天</span></div>
<div class="goal-current">
<h3>每日 30 分钟</h3><span class="goal-value">46 / 30 分钟</span>
<progress class="goal-progress" value="30" max="30" aria-label="每日阅读目标已完成"></progress>
<p>已达成，超出目标 16 分钟。</p>
</div>
<div class="goal-empty">
<h3>年度目标未设置</h3>
<p>设定今年想读完的本数，再跟踪进度。</p>
<button type="button" class="text-action"><i data-lucide="plus" aria-hidden="true"></i>设置年度目标</button>
</div>
</section>
<section class="rhythm-section" aria-labelledby="rhythm-title">
<div class="section-heading"><h2 id="rhythm-title">阅读节奏</h2><span>本周</span></div>
<dl class="rhythm-list">
<div class="rhythm-row"><dt>最集中时段</dt><dd>21:00—23:00 · 86分钟</dd></div>
<div class="rhythm-row"><dt>最长连续阅读</dt><dd>5天 · 10月26日起</dd></div>
<div class="rhythm-row"><dt>单次平均时长</dt><dd>25分钟 · 共9次</dd></div>
</dl>
</section>
</div>
<footer class="page-footer"><p>听页 · 阅读数据仅用于生成个人统计</p><p>统计截至 2026年10月30日 21:40</p></footer>
</div>
</main>
<script>lucide.createIcons();</script>
</body>
</html>
