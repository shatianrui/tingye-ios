<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语音与角色</title>
    <style id="theme-vars">
:root {
  --ty-primary-50: #F5F5F5;
  --ty-primary-100: #E8E8E8;
  --ty-primary-200: #D1D1D1;
  --ty-primary-300: #A3A3A3;
  --ty-primary-400: #6E6E6E;
  --ty-primary-500: #1F1F1F;
  --ty-primary-600: #121212;
  --ty-neutral-0: #FFFFFF;
  --ty-neutral-50: #FAFAFA;
  --ty-neutral-100: #F5F5F5;
  --ty-neutral-200: #EFEFEF;
  --ty-neutral-300: #D8D8D8;
  --ty-neutral-400: #A3A3A3;
  --ty-neutral-500: #6E6E6E;
  --ty-neutral-600: #595959;
  --ty-neutral-900: #1F1F1F;
  --ty-neutral-950: #121212;
  --state-success: #2E6B4F;
  --state-error: #B43832;
  --ty-background: var(--ty-neutral-0);
  --ty-foreground: var(--ty-neutral-900);
  --ty-card: var(--ty-neutral-0);
  --ty-card-foreground: var(--ty-neutral-900);
  --ty-popover: var(--ty-neutral-0);
  --ty-popover-foreground: var(--ty-neutral-900);
  --ty-primary: var(--ty-primary-500);
  --ty-primary-foreground: var(--ty-neutral-0);
  --ty-muted: var(--ty-neutral-100);
  --ty-muted-foreground: var(--ty-neutral-600);
  --ty-border: var(--ty-neutral-200);
  --ty-input: var(--ty-neutral-200);
  --ty-ring: var(--ty-primary-500);
  --ty-surface-sunken: var(--ty-neutral-50);
  --ty-hairline: var(--ty-neutral-200);
  --ty-radius-sm: 4px;
  --ty-radius-md: 8px;
  --ty-radius-lg: 16px;
  --ty-radius-full: 9999px;
  --ty-radius-small: var(--ty-radius-sm);
  --ty-radius-medium: var(--ty-radius-md);
  --ty-radius-large: var(--ty-radius-lg);
  --ty-font-sans: "PingFang SC", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  --ty-font-serif: "Songti SC", "Noto Serif SC", serif;
  --ty-font-mono: "SF Mono", ui-monospace, Menlo, monospace;
  --ty-shadow-hairline: 0 1px 2px rgba(0, 0, 0, 0.04);
  --ty-shadow-float: 0 12px 32px rgba(0, 0, 0, 0.14);
}

.dark {
  --ty-background: var(--ty-neutral-950);
  --ty-foreground: #F5F5F5;
  --ty-card: #1B1B1B;
  --ty-card-foreground: #F5F5F5;
  --ty-popover: #1B1B1B;
  --ty-popover-foreground: #F5F5F5;
  --ty-primary: #F5F5F5;
  --ty-primary-foreground: #121212;
  --ty-muted: #242424;
  --ty-muted-foreground: #A3A3A3;
  --ty-border: #2C2C2C;
  --ty-input: #2C2C2C;
  --ty-ring: #F5F5F5;
  --ty-surface-sunken: #181818;
  --ty-hairline: #2C2C2C;
  --ty-shadow-hairline: 0 1px 2px rgba(0, 0, 0, 0.30);
  --ty-shadow-float: 0 12px 32px rgba(0, 0, 0, 0.45);
}

.ty-display,
.ty-h1,
.ty-h2,
.ty-h3,
.ty-body,
.ty-caption,
.ty-label {
  font-family: var(--ty-font-sans);
}

.ty-display { font-weight: 700; line-height: 1.18; letter-spacing: -0.025em; }
.ty-h1 { font-weight: 700; line-height: 1.22; letter-spacing: -0.02em; }
.ty-h2 { font-weight: 600; line-height: 1.28; letter-spacing: -0.01em; }
.ty-h3 { font-weight: 600; line-height: 1.35; }
.ty-body { font-weight: 400; line-height: 1.6; }
.ty-caption { font-weight: 400; font-size: 13px; line-height: 1.5; }
.ty-label { font-weight: 500; font-size: 13px; line-height: 1.4; }
.ty-reading { font-family: var(--ty-font-serif); font-weight: 400; line-height: 1.95; }
.ty-numeric { font-family: var(--ty-font-sans); font-variant-numeric: tabular-nums; }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--ty-background);
    --color-foreground: var(--ty-foreground);
    --color-card: var(--ty-card);
    --color-card-foreground: var(--ty-card-foreground);
    --color-popover: var(--ty-popover);
    --color-popover-foreground: var(--ty-popover-foreground);
    --color-primary: var(--ty-primary);
    --color-primary-foreground: var(--ty-primary-foreground);
    --color-muted: var(--ty-muted);
    --color-muted-foreground: var(--ty-muted-foreground);
    --color-border: var(--ty-border);
    --color-input: var(--ty-input);
    --color-ring: var(--ty-ring);
    --radius-sm: var(--ty-radius-sm);
    --radius-md: var(--ty-radius-md);
    --radius-lg: var(--ty-radius-lg);
  }
  @layer base {
    body { background: var(--ty-background); color: var(--ty-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--ty-background); }
      .text-background { color: var(--ty-background); }
      .border-background { border-color: var(--ty-background); }
      .ring-background { --tw-ring-color: var(--ty-background); }
      .bg-foreground { background-color: var(--ty-foreground); }
      .text-foreground { color: var(--ty-foreground); }
      .border-foreground { border-color: var(--ty-foreground); }
      .ring-foreground { --tw-ring-color: var(--ty-foreground); }
      .bg-card { background-color: var(--ty-card); }
      .text-card { color: var(--ty-card); }
      .border-card { border-color: var(--ty-card); }
      .ring-card { --tw-ring-color: var(--ty-card); }
      .bg-card-foreground { background-color: var(--ty-card-foreground); }
      .text-card-foreground { color: var(--ty-card-foreground); }
      .border-card-foreground { border-color: var(--ty-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--ty-card-foreground); }
      .bg-popover { background-color: var(--ty-popover); }
      .text-popover { color: var(--ty-popover); }
      .border-popover { border-color: var(--ty-popover); }
      .ring-popover { --tw-ring-color: var(--ty-popover); }
      .bg-popover-foreground { background-color: var(--ty-popover-foreground); }
      .text-popover-foreground { color: var(--ty-popover-foreground); }
      .border-popover-foreground { border-color: var(--ty-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--ty-popover-foreground); }
      .bg-primary { background-color: var(--ty-primary); }
      .text-primary { color: var(--ty-primary); }
      .border-primary { border-color: var(--ty-primary); }
      .ring-primary { --tw-ring-color: var(--ty-primary); }
      .bg-primary-foreground { background-color: var(--ty-primary-foreground); }
      .text-primary-foreground { color: var(--ty-primary-foreground); }
      .border-primary-foreground { border-color: var(--ty-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--ty-primary-foreground); }
      .bg-muted { background-color: var(--ty-muted); }
      .text-muted { color: var(--ty-muted); }
      .border-muted { border-color: var(--ty-muted); }
      .ring-muted { --tw-ring-color: var(--ty-muted); }
      .bg-muted-foreground { background-color: var(--ty-muted-foreground); }
      .text-muted-foreground { color: var(--ty-muted-foreground); }
      .border-muted-foreground { border-color: var(--ty-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--ty-muted-foreground); }
      .bg-border { background-color: var(--ty-border); }
      .text-border { color: var(--ty-border); }
      .border-border { border-color: var(--ty-border); }
      .ring-border { --tw-ring-color: var(--ty-border); }
      .bg-input { background-color: var(--ty-input); }
      .text-input { color: var(--ty-input); }
      .border-input { border-color: var(--ty-input); }
      .ring-input { --tw-ring-color: var(--ty-input); }
      .bg-ring { background-color: var(--ty-ring); }
      .text-ring { color: var(--ty-ring); }
      .border-ring { border-color: var(--ty-ring); }
      .ring-ring { --tw-ring-color: var(--ty-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
  <main class="voice-page">
    <style id="critical-layout">
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--ty-surface-sunken);
        color: var(--ty-foreground);
        font-family: var(--ty-font-sans);
      }
      button, input, select { font: inherit; }
      button, a { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
      button { cursor: pointer; }
      .voice-shell {
        width: 100%;
        max-width: 560px;
        min-height: 100vh;
        margin: 0 auto;
        background: var(--ty-background);
      }
      .voice-shell svg { width: 20px; height: 20px; flex: none; stroke-width: 1.5; }
      .topbar {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) 44px;
        align-items: center;
        gap: 8px;
        min-height: 60px;
        padding: max(8px, env(safe-area-inset-top)) 12px 8px;
        border-bottom: 1px solid var(--ty-hairline);
      }
      .topbar-title { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.35; text-align: center; }
      .icon-button, .voice-option, .preview-button {
        border: 0;
        background: transparent;
        color: var(--ty-foreground);
        transition: background-color 140ms cubic-bezier(.2,.8,.2,1), color 140ms cubic-bezier(.2,.8,.2,1), transform 140ms cubic-bezier(.2,.8,.2,1), opacity 140ms cubic-bezier(.2,.8,.2,1);
      }
      .icon-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        min-width: 44px;
        min-height: 44px;
        padding: 0;
        border-radius: var(--ty-radius-md);
        text-decoration: none;
      }
      .topbar-spacer { width: 44px; min-height: 44px; }
      button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
        outline: 2px solid var(--ty-ring);
        outline-offset: 3px;
      }
      button:active, a:active { transform: translateY(1px); }
      button:disabled { cursor: default; opacity: .38; }
      .voice-content { padding: 28px 20px 0; }
      .service-header h1 {
        margin: 0;
        font-size: 27px;
        font-weight: 600;
        line-height: 1.25;
        letter-spacing: -.02em;
        overflow-wrap: anywhere;
      }
      .service-status { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--state-success); font-size: 13px; line-height: 1.5; }
      .service-status svg { width: 18px; height: 18px; }
      .service-description { margin: 12px 0 0; color: var(--ty-muted-foreground); font-size: 14px; line-height: 1.7; overflow-wrap: anywhere; }
      .preview-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-width: 44px;
        min-height: 48px;
        margin-top: 20px;
        padding: 10px 18px;
        border-radius: var(--ty-radius-md);
        background: var(--ty-primary);
        color: var(--ty-primary-foreground);
        font-size: 15px;
        font-weight: 600;
        line-height: 1.4;
        white-space: nowrap;
      }
      .voice-section { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--ty-hairline); }
      .section-title { margin: 0; font-size: 20px; font-weight: 600; line-height: 1.3; }
      .section-note { margin: 8px 0 0; color: var(--ty-muted-foreground); font-size: 13px; line-height: 1.6; }
      .voice-list { margin: 16px 0 0; padding: 0; border-top: 1px solid var(--ty-hairline); list-style: none; }
      .voice-list li { border-bottom: 1px solid var(--ty-hairline); }
      .voice-option {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 24px;
        align-items: center;
        gap: 16px;
        width: 100%;
        min-height: 68px;
        padding: 12px 8px;
        text-align: left;
      }
      .voice-option[aria-pressed="true"] { background: var(--ty-muted); }
      .voice-name { min-width: 0; font-size: 15px; line-height: 1.5; overflow-wrap: anywhere; }
      .voice-name small { display: block; margin-top: 3px; color: var(--ty-muted-foreground); font-size: 12px; line-height: 1.5; }
      .voice-option svg { width: 18px; height: 18px; justify-self: end; }
      .role-list { margin-top: 16px; border-top: 1px solid var(--ty-hairline); }
      .role-row { padding: 16px 0; border-bottom: 1px solid var(--ty-hairline); }
      .role-row label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; line-height: 1.5; }
      .role-context { margin: 0 0 10px; color: var(--ty-muted-foreground); font-size: 12px; line-height: 1.5; }
      .role-select {
        display: block;
        width: 100%;
        min-height: 48px;
        padding: 10px 36px 10px 12px;
        border: 1px solid var(--ty-input);
        border-radius: var(--ty-radius-md);
        background: var(--ty-background);
        color: var(--ty-foreground);
        font-size: 14px;
        line-height: 1.4;
        cursor: pointer;
      }
      .output-group { padding: 20px 0; border-bottom: 1px solid var(--ty-hairline); }
      .output-group:first-of-type { margin-top: 8px; }
      .output-label { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .output-label label { font-size: 14px; font-weight: 600; line-height: 1.5; }
      .output-label output { color: var(--ty-muted-foreground); font-size: 14px; font-variant-numeric: tabular-nums; line-height: 1.5; }
      .output-slider { display: block; width: 100%; min-height: 44px; margin: 4px 0 0; accent-color: var(--ty-primary); cursor: pointer; }
      .switch-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 32px;
        align-items: center;
        gap: 16px;
        min-height: 68px;
        margin-top: 12px;
        padding: 12px 0;
        cursor: pointer;
      }
      .switch-copy strong { display: block; font-size: 14px; font-weight: 600; line-height: 1.5; }
      .switch-copy small { display: block; margin-top: 4px; color: var(--ty-muted-foreground); font-size: 12px; line-height: 1.6; }
      .switch-input { width: 28px; height: 28px; margin: 0; accent-color: var(--ty-primary); cursor: pointer; }
      .page-footer {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px 16px;
        margin-top: 28px;
        padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
        border-top: 1px solid var(--ty-hairline);
        color: var(--ty-muted-foreground);
        font-size: 12px;
        line-height: 1.6;
      }
      @media (hover: hover) {
        .icon-button:hover, .voice-option:hover { background: var(--ty-muted); }
        .preview-button:hover { background: var(--ty-primary-600); }
      }
      @media (max-width: 350px) {
        .voice-content { padding-right: 16px; padding-left: 16px; }
        .page-footer { padding-right: 16px; padding-left: 16px; }
        .service-header h1 { font-size: 24px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .icon-button, .voice-option, .preview-button, button, a { transition-duration: .01ms; }
      }
    </style>

    <div class="voice-shell">
      <header class="topbar" aria-label="语音设置导航">
        <a href="player.html" class="icon-button" data-dom-id="voice-back-player" aria-label="返回听书播放">
          <i data-lucide="chevron-left" aria-hidden="true"></i>
        </a>
        <p class="topbar-title">语音与角色</p>
        <span class="topbar-spacer" aria-hidden="true"></span>
      </header>

      <div class="voice-content">
        <header class="service-header">
          <h1>系统云语音</h1>
          <div class="service-status"><i data-lucide="cloud-check" aria-hidden="true"></i><span>服务已连接 · 中文普通话</span></div>
          <p class="service-description">使用系统语音引擎生成自然朗读。角色分配与输出设置仅作用于听书，不改变原书图文。</p>
          <button type="button" class="preview-button"><i data-lucide="play" aria-hidden="true"></i>试听当前声音</button>
        </header>

        <section class="voice-section" aria-labelledby="voice-library-title">
          <h2 class="section-title" id="voice-library-title">声音</h2>
          <p class="section-note">选择一个默认声音，也可在下方按角色覆盖。</p>
          <ul class="voice-list">
            <li>
              <button type="button" class="voice-option" aria-pressed="true">
                <span class="voice-name">林默 · 沉稳男声<small>系统增强 · 适合旁白与长篇小说</small></span>
                <i data-lucide="check" aria-hidden="true"></i>
              </button>
            </li>
            <li>
              <button type="button" class="voice-option" aria-pressed="false">
                <span class="voice-name">清和 · 温和女声<small>系统增强 · 适合对白与抒情段落</small></span>
                <i data-lucide="circle" aria-hidden="true"></i>
              </button>
            </li>
            <li>
              <button type="button" class="voice-option" aria-pressed="false">
                <span class="voice-name">晓川 · 清亮男声<small>系统标准 · 适合少年角色</small></span>
                <i data-lucide="circle" aria-hidden="true"></i>
              </button>
            </li>
          </ul>
        </section>

        <section class="voice-section" aria-labelledby="roles-title">
          <h2 class="section-title" id="roles-title">分角色朗读</h2>
          <p class="section-note">未识别的人物使用默认声音，角色名不会朗读。</p>
          <div class="role-list">
            <div class="role-row">
              <label for="role-narrator">旁白</label>
              <p class="role-context">叙述与环境描写 · 全文约 72%</p>
              <select class="role-select" id="role-narrator">
                <option selected>林默 · 沉稳男声</option>
                <option>清和 · 温和女声</option>
                <option>晓川 · 清亮男声</option>
              </select>
            </div>
            <div class="role-row">
              <label for="role-youth">少年</label>
              <p class="role-context">少年角色对白 · 自动识别</p>
              <select class="role-select" id="role-youth">
                <option>林默 · 沉稳男声</option>
                <option>清和 · 温和女声</option>
                <option selected>晓川 · 清亮男声</option>
              </select>
            </div>
            <div class="role-row">
              <label for="role-mother">母亲</label>
              <p class="role-context">女性角色对白 · 自动识别</p>
              <select class="role-select" id="role-mother">
                <option>林默 · 沉稳男声</option>
                <option selected>清和 · 温和女声</option>
                <option>晓川 · 清亮男声</option>
              </select>
            </div>
          </div>
        </section>

        <section class="voice-section" aria-labelledby="output-title">
          <h2 class="section-title" id="output-title">朗读输出</h2>
          <p class="section-note">调整后立即应用于下一句，当前播放位置不变。</p>

          <div class="output-group">
            <div class="output-label"><label for="voice-rate">语速</label><output for="voice-rate">1.0×</output></div>
            <input class="output-slider" id="voice-rate" type="range" min="50" max="200" value="100" aria-label="朗读语速">
          </div>
          <div class="output-group">
            <div class="output-label"><label for="voice-pitch">音调</label><output for="voice-pitch">标准</output></div>
            <input class="output-slider" id="voice-pitch" type="range" min="-10" max="10" value="0" aria-label="朗读音调">
          </div>
          <div class="output-group">
            <div class="output-label"><label for="voice-volume">音量</label><output for="voice-volume">80%</output></div>
            <input class="output-slider" id="voice-volume" type="range" min="0" max="100" value="80" aria-label="朗读音量">
          </div>

          <label class="switch-row" for="background-playback">
            <span class="switch-copy"><strong>后台播放</strong><small>锁定屏幕或切换应用后继续朗读</small></span>
            <input class="switch-input" id="background-playback" type="checkbox" role="switch" checked>
          </label>
        </section>
      </div>

      <footer class="page-footer">
        <span>系统云语音 · 3 个可用声音</span>
        <span>角色与输出设置已同步到听书播放</span>
      </footer>
    </div>
  </main>
  <script>lucide.createIcons();</script>
</body>
</html>
