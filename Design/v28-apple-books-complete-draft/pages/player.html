<body class="min-h-screen font-sans antialiased">
  <main class="player-page">
    <style id="critical-layout">
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--ty-surface-sunken);
        color: var(--ty-foreground);
        font-family: var(--ty-font-sans);
      }
      button, input { font: inherit; }
      button, a { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
      button { cursor: pointer; }
      .player-shell {
        width: 100%;
        max-width: 560px;
        min-height: 100vh;
        margin: 0 auto;
        background: var(--ty-background);
      }
      .player-shell svg { width: 20px; height: 20px; flex: none; stroke-width: 1.5; }
      .topbar {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) 44px;
        align-items: center;
        gap: 8px;
        min-height: 60px;
        padding: max(8px, env(safe-area-inset-top)) 12px 8px;
        border-bottom: 1px solid var(--ty-hairline);
      }
      .topbar-title { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.35; text-align: center; }
      .icon-button, .skip-button, .speed-button, .timer-button, .choice-button, .chapter-row, .mini-toggle {
        border: 0;
        background: transparent;
        color: var(--ty-foreground);
        transition: background-color 140ms cubic-bezier(.2,.8,.2,1), color 140ms cubic-bezier(.2,.8,.2,1), border-color 140ms cubic-bezier(.2,.8,.2,1), transform 140ms cubic-bezier(.2,.8,.2,1), opacity 140ms cubic-bezier(.2,.8,.2,1);
      }
      .icon-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        min-width: 44px;
        min-height: 44px;
        padding: 0;
        border-radius: var(--ty-radius-md);
        text-decoration: none;
      }
      .icon-button.end { justify-self: end; }
      button:focus-visible, a:focus-visible, input:focus-visible {
        outline: 2px solid var(--ty-ring);
        outline-offset: 3px;
      }
      button:active, a:active { transform: translateY(1px); }
      button:disabled { cursor: default; opacity: .38; }
      .player-content { padding: 28px 20px 0; }
      .player-hero { text-align: center; }
      .player-cover {
        display: block;
        width: 168px;
        height: auto;
        margin: 0 auto;
        border: 1px solid var(--ty-hairline);
        border-radius: var(--ty-radius-sm);
        background: var(--ty-surface-sunken);
        box-shadow: var(--ty-shadow-hairline);
      }
      .player-hero h1 {
        margin: 24px 0 0;
        font-size: 27px;
        font-weight: 600;
        line-height: 1.25;
        letter-spacing: -.02em;
        overflow-wrap: anywhere;
      }
      .now-chapter { margin: 8px 0 0; color: var(--ty-muted-foreground); font-size: 14px; line-height: 1.6; }
      .narrator-line { margin: 4px 0 0; color: var(--ty-muted-foreground); font-size: 13px; line-height: 1.5; }
      .playback-progress { margin-top: 24px; }
      .progress-slider { display: block; width: 100%; min-height: 44px; margin: 0; accent-color: var(--ty-primary); cursor: pointer; }
      .time-row { display: flex; justify-content: space-between; gap: 16px; color: var(--ty-muted-foreground); font-size: 12px; font-variant-numeric: tabular-nums; line-height: 1.5; }
      .main-controls {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        align-items: center;
        gap: 12px;
        margin-top: 16px;
      }
      .skip-button {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
        min-height: 68px;
        padding: 8px 4px;
        border-radius: var(--ty-radius-md);
        font-size: 11px;
        line-height: 1.4;
        white-space: nowrap;
      }
      .skip-button svg { width: 25px; height: 25px; }
      .play-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
        min-height: 72px;
        padding: 10px 8px;
        border: 0;
        border-radius: var(--ty-radius-lg);
        background: var(--ty-primary);
        color: var(--ty-primary-foreground);
        font-family: var(--ty-font-sans);
        font-size: 13px;
        font-weight: 600;
        line-height: 1.4;
        white-space: nowrap;
        cursor: pointer;
        transition: background-color 140ms cubic-bezier(.2,.8,.2,1), transform 140ms cubic-bezier(.2,.8,.2,1), opacity 140ms cubic-bezier(.2,.8,.2,1);
      }
      .play-toggle svg { width: 28px; height: 28px; }
      .secondary-controls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
      .speed-button, .timer-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-width: 0;
        min-height: 48px;
        padding: 10px 12px;
        border: 1px solid var(--ty-hairline);
        border-radius: var(--ty-radius-md);
        font-size: 14px;
        line-height: 1.4;
        white-space: nowrap;
      }
      .player-section { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--ty-hairline); }
      .section-title { margin: 0; font-size: 20px; font-weight: 600; line-height: 1.3; }
      .section-note { margin: 8px 0 0; color: var(--ty-muted-foreground); font-size: 13px; line-height: 1.6; }
      .mini-player {
        display: grid;
        grid-template-columns: 48px minmax(0, 1fr) 44px;
        align-items: center;
        gap: 12px;
        margin-top: 16px;
        padding: 12px;
        border: 1px solid var(--ty-hairline);
        border-radius: var(--ty-radius-md);
        background: var(--ty-surface-sunken);
      }
      .mini-cover { display: block; width: 48px; height: auto; border: 1px solid var(--ty-hairline); border-radius: var(--ty-radius-sm); }
      .mini-copy { min-width: 0; }
      .mini-copy strong { display: block; font-size: 14px; font-weight: 600; line-height: 1.5; overflow-wrap: anywhere; }
      .mini-copy span { display: block; margin-top: 2px; color: var(--ty-muted-foreground); font-size: 12px; line-height: 1.5; font-variant-numeric: tabular-nums; }
      .mini-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        min-height: 44px;
        padding: 0;
        border-radius: var(--ty-radius-md);
      }
      .chapter-list { margin: 16px 0 0; padding: 0; border-top: 1px solid var(--ty-hairline); list-style: none; }
      .chapter-list li { border-bottom: 1px solid var(--ty-hairline); }
      .chapter-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 16px;
        width: 100%;
        min-height: 60px;
        padding: 12px 0;
        text-align: left;
      }
      .chapter-name { min-width: 0; font-size: 15px; line-height: 1.5; overflow-wrap: anywhere; }
      .chapter-name small { display: block; margin-top: 2px; color: var(--ty-muted-foreground); font-size: 12px; line-height: 1.5; }
      .chapter-time { display: inline-flex; align-items: center; gap: 8px; color: var(--ty-muted-foreground); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .chapter-row[aria-current="true"] .chapter-time { color: var(--ty-foreground); }
      .timer-choices { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
      .choice-button {
        min-width: 0;
        min-height: 44px;
        padding: 8px 6px;
        border: 1px solid var(--ty-hairline);
        border-radius: var(--ty-radius-md);
        color: var(--ty-muted-foreground);
        font-size: 13px;
        line-height: 1.4;
        white-space: nowrap;
      }
      .choice-button[aria-pressed="true"] { border-color: var(--ty-foreground); color: var(--ty-foreground); }
      .confirmation-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
      .action-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-width: 0;
        min-height: 48px;
        padding: 10px 14px;
        border: 1px solid var(--ty-hairline);
        border-radius: var(--ty-radius-md);
        background: transparent;
        color: var(--ty-foreground);
        font-family: var(--ty-font-sans);
        font-size: 14px;
        font-weight: 600;
        line-height: 1.4;
        white-space: nowrap;
        cursor: pointer;
        transition: background-color 140ms cubic-bezier(.2,.8,.2,1), color 140ms cubic-bezier(.2,.8,.2,1), transform 140ms cubic-bezier(.2,.8,.2,1);
      }
      .action-button.primary { border-color: var(--ty-primary); background: var(--ty-primary); color: var(--ty-primary-foreground); }
      .error-heading { display: flex; align-items: center; gap: 10px; }
      .error-heading svg { color: var(--state-error); }
      .error-heading h2 { margin: 0; font-size: 20px; font-weight: 600; line-height: 1.3; }
      .retry-audio { margin-top: 16px; }
      .page-footer {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px 16px;
        margin-top: 28px;
        padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
        border-top: 1px solid var(--ty-hairline);
        color: var(--ty-muted-foreground);
        font-size: 12px;
        line-height: 1.6;
      }
      @media (hover: hover) {
        .icon-button:hover, .skip-button:hover, .speed-button:hover, .timer-button:hover, .choice-button:hover, .chapter-row:hover, .mini-toggle:hover, .action-button:hover { background: var(--ty-muted); }
        .play-toggle:hover, .action-button.primary:hover { background: var(--ty-primary-600); }
      }
      @media (max-width: 350px) {
        .player-content { padding-right: 16px; padding-left: 16px; }
        .page-footer { padding-right: 16px; padding-left: 16px; }
        .player-hero h1 { font-size: 24px; }
        .player-cover { width: 148px; }
        .timer-choices { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .confirmation-actions { grid-template-columns: minmax(0, 1fr); }
      }
      @media (prefers-reduced-motion: reduce) {
        .icon-button, .skip-button, .speed-button, .timer-button, .choice-button, .chapter-row, .mini-toggle, .play-toggle, .action-button, button, a { transition-duration: .01ms; }
      }
    </style>

        <section class="player-section" aria-labelledby="mini-title">
          <h2 class="section-title" id="mini-title">迷你播放</h2>
          <p class="section-note">离开独立播放页后，保留本章进度与核心控制。</p>
          <div class="mini-player" aria-label="迷你播放器预览">

            <div class="mini-copy"><strong>第三章 · 船舱里的冬天</strong><span>18:24 / 42:16 · 1.0×</span></div>
            <button type="button" class="mini-toggle" aria-label="暂停迷你播放"><i data-lucide="pause" aria-hidden="true"></i></button>

        </section>

        <section class="player-section" aria-labelledby="audio-chapters-title">
          <h2 class="section-title" id="audio-chapters-title">音频章节</h2>
          <p class="section-note">播放进度独立于文字阅读位置。</p>
          <ul class="chapter-list">
            <li>
              <button type="button" class="chapter-row">
                <span class="chapter-name">第二章 · 离乡之前<small>已听完</small></span>
                <span class="chapter-time">38:06</span>
              </button>
            </li>
            <li>
              <button type="button" class="chapter-row" aria-current="true">
                <span class="chapter-name">第三章 · 船舱里的冬天<small>已播放 18:24</small></span>
                <span class="chapter-time"><i data-lucide="volume-2" aria-hidden="true"></i>42:16</span>
              </button>
            </li>
            <li>
              <button type="button" class="chapter-row">
                <span class="chapter-name">第四章 · 故乡<small>未播放</small></span>
                <span class="chapter-time">46:32</span>
              </button>
            </li>
          </ul>
        </section>

        <section class="player-section" id="sleep-timer" aria-labelledby="timer-title">
          <h2 class="section-title" id="timer-title">定时关闭</h2>
          <p class="section-note">到达设定时间后暂停，并保留当前播放位置。</p>
          <div class="timer-choices" role="group" aria-label="定时关闭时长">
            <button type="button" class="choice-button" aria-pressed="false">15 分钟</button>
            <button type="button" class="choice-button" aria-pressed="false">30 分钟</button>
            <button type="button" class="choice-button" aria-pressed="false">60 分钟</button>
            <button type="button" class="choice-button" aria-pressed="true">本章结束</button>

        </section>

        <section class="player-section" aria-labelledby="end-title">
          <h2 class="section-title" id="end-title">结束听书</h2>
          <p class="section-note">当前进度已保存。结束后返回书籍详情，迷你播放器将关闭。</p>
          <div class="confirmation-actions">
            <button type="button" class="action-button" data-dom-id="cancel-end"><i data-lucide="play" aria-hidden="true"></i>继续收听</button>
            <button type="button" class="action-button primary" data-dom-id="confirm-end"><i data-lucide="square" aria-hidden="true"></i>结束并返回</button>

        <section class="player-section" role="alert" aria-labelledby="audio-error-title">

      <footer class="page-footer">

        <span>本章已下载 · 播放位置已同步</span>

    </div>
