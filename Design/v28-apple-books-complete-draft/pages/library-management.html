  --ty-foreground: #F5F5F5;
  --ty-card: #1B1B1B;
  --ty-card-foreground: #F5F5F5;
  --ty-popover: #1B1B1B;
  --ty-popover-foreground: #F5F5F5;
  --ty-primary: #F5F5F5;
  --ty-primary-foreground: #121212;
  --ty-muted: #242424;
  --ty-muted-foreground: #A3A3A3;
  --ty-border: #2C2C2C;
  --ty-input: #2C2C2C;
  --ty-ring: #F5F5F5;
  --ty-surface-sunken: #181818;
  --ty-hairline: #2C2C2C;
  --ty-shadow-hairline: 0 1px 2px rgba(0, 0, 0, 0.30);
  --ty-shadow-float: 0 12px 32px rgba(0, 0, 0, 0.45);
}

.ty-display,
.ty-h1,
.ty-h2,
.ty-h3,
.ty-body,
.ty-caption,
.ty-label {
  font-family: var(--ty-font-sans);
}

.ty-display { font-weight: 700; line-height: 1.18; letter-spacing: -0.025em; }
.ty-h1 { font-weight: 700; line-height: 1.22; letter-spacing: -0.02em; }
.ty-h2 { font-weight: 600; line-height: 1.28; letter-spacing: -0.01em; }
.ty-h3 { font-weight: 600; line-height: 1.35; }
.ty-body { font-weight: 400; line-height: 1.6; }
.ty-caption { font-weight: 400; font-size: 13px; line-height: 1.5; }
.ty-label { font-weight: 500; font-size: 13px; line-height: 1.4; }
.ty-reading { font-family: var(--ty-font-serif); font-weight: 400; line-height: 1.95; }
.ty-numeric { font-family: var(--ty-font-sans); font-variant-numeric: tabular-nums; }

    </style>

<body>
<style id="critical-layout">
  *,*::before,*::after{box-sizing:border-box}
  html{background:var(--ty-surface-sunken)}
  body{margin:0;min-width:0;min-height:100vh;background:var(--ty-surface-sunken);color:var(--ty-foreground);font-family:var(--ty-font-sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  button,input,select{font:inherit}button,a,input,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer}a{color:inherit}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ty-ring);outline-offset:3px}
  button:disabled{cursor:not-allowed;opacity:.45}svg{width:20px;height:20px;flex:0 0 auto;stroke-width:1.5}
  .visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;clip-path:inset(50%);white-space:nowrap;border:0}
  .board{width:100%;max-width:1040px;min-height:100vh;margin:0 auto;padding:32px 20px 0}
  .board-heading{max-width:720px;margin:0 0 28px}.board-heading h1{margin:0;font-size:30px;font-weight:700;line-height:1.22;letter-spacing:-.02em}.board-heading p{margin:8px 0 0;color:var(--ty-muted-foreground);font-size:15px}
  .screen-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:start}
  .screen-wrap{min-width:0;margin:0}.screen-label{margin:0 0 10px;color:var(--ty-muted-foreground);font-size:13px;font-weight:500;line-height:1.5}
  .phone-screen{width:100%;max-width:430px;margin:0 auto;border:1px solid var(--ty-hairline);border-radius:var(--ty-radius-lg);background:var(--ty-background)}
  .screen-content{padding:20px}.app-header{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px;margin-bottom:20px}
  .app-header h2{margin:0;text-align:center;font-size:17px;font-weight:600;line-height:1.35}.header-action{justify-self:end;width:auto;padding:0 4px;font-size:15px}
  .icon-button,.text-button,.primary-button,.secondary-button,.danger-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:44px;min-height:44px;border-radius:var(--ty-radius-md);text-decoration:none;white-space:nowrap;transition:background-color 140ms cubic-bezier(.2,.8,.2,1),color 140ms cubic-bezier(.2,.8,.2,1),border-color 140ms cubic-bezier(.2,.8,.2,1),opacity 140ms cubic-bezier(.2,.8,.2,1),transform 140ms cubic-bezier(.2,.8,.2,1)}
  .icon-button{padding:0;border:1px solid transparent;background:transparent;color:var(--ty-foreground)}.icon-button:hover,.text-button:hover{background:var(--ty-muted)}
  .text-button{padding:0 12px;border:1px solid transparent;background:transparent;color:var(--ty-foreground)}
  .primary-button{padding:0 16px;border:1px solid var(--ty-primary);background:var(--ty-primary);color:var(--ty-primary-foreground)}.primary-button:hover{background:var(--ty-neutral-600);border-color:var(--ty-neutral-600)}
  .secondary-button{padding:0 16px;border:1px solid var(--ty-border);background:var(--ty-background);color:var(--ty-foreground)}.secondary-button:hover{background:var(--ty-muted)}
  .danger-button{padding:0 16px;border:1px solid var(--state-error);background:var(--state-error);color:var(--ty-neutral-0)}.danger-button:hover{opacity:.86}
  .icon-button:active,.text-button:active,.primary-button:active,.secondary-button:active,.danger-button:active{transform:translateY(1px)}
  .search-box{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 12px;border:1px solid var(--ty-input);border-radius:var(--ty-radius-md);background:var(--ty-surface-sunken)}.search-box:focus-within{outline:2px solid var(--ty-ring);outline-offset:2px}
  .search-box input{width:100%;min-width:0;min-height:44px;padding:0;border:0;outline:0;background:transparent;color:var(--ty-foreground)}.search-box input::placeholder{color:var(--ty-muted-foreground)}
  .management-controls{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;margin:12px 0 20px}.group-select{width:100%;min-width:0;min-height:44px;padding:0 34px 0 12px;border:1px solid var(--ty-input);border-radius:var(--ty-radius-md);background:var(--ty-background);color:var(--ty-foreground)}
  .view-switch{display:flex;gap:4px;padding:2px;border:1px solid var(--ty-border);border-radius:var(--ty-radius-md)}.view-switch .icon-button{min-height:40px;height:40px}.view-switch .icon-button[aria-pressed="true"]{background:var(--ty-primary);color:var(--ty-primary-foreground)}
  .selection-summary{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px;color:var(--ty-muted-foreground);font-size:13px}.selection-summary strong{color:var(--ty-foreground);font-weight:600}
  .book-group{margin:0 0 24px}.book-group h3{margin:0 0 4px;font-size:13px;font-weight:500;color:var(--ty-muted-foreground)}.book-list{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
  .book-item{position:relative;display:grid;grid-template-columns:44px 64px minmax(0,1fr);gap:12px;align-items:center;padding:16px 0;border-bottom:1px solid var(--ty-hairline)}.book-item[hidden]{display:none}.book-check{display:flex;align-items:center;justify-content:center;width:44px;min-height:44px;cursor:pointer}.book-check input{width:22px;height:22px;margin:0;accent-color:var(--ty-primary);cursor:pointer}
  .book-cover{display:block;width:64px;height:96px;margin:0;border:1px solid var(--ty-hairline);border-radius:var(--ty-radius-sm);background:var(--ty-muted);object-fit:cover}.book-copy{min-width:0}.book-copy h4{margin:0;font-size:17px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}.book-copy p{margin:4px 0 0;color:var(--ty-muted-foreground);font-size:13px;line-height:1.5;overflow-wrap:anywhere}.book-copy .book-meta{color:var(--ty-neutral-500);font-variant-numeric:tabular-nums}
  .book-list.is-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 16px}.book-list.is-grid .book-item{grid-template-columns:44px minmax(0,1fr);align-items:start;padding:0 0 16px}.book-list.is-grid .book-cover{grid-column:1/-1;width:100%;height:auto;aspect-ratio:2/3;grid-row:1}.book-list.is-grid .book-check{grid-column:1;grid-row:2}.book-list.is-grid .book-copy{grid-column:2;grid-row:2}.book-list.is-grid .book-copy h4{font-size:15px}
  .empty-search{margin:16px 0 0;padding:20px 0;border-top:1px solid var(--ty-hairline);color:var(--ty-muted-foreground);text-align:center}.empty-search[hidden]{display:none}
  .selection-actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding-top:16px;border-top:1px solid var(--ty-hairline)}.selection-actions[hidden]{display:none}.selection-actions .danger-button{background:var(--ty-background);color:var(--state-error)}
  .move-control{display:flex;flex-direction:column;gap:8px;margin:16px 0}.move-control label{font-size:13px;font-weight:500}.move-control select{min-height:44px;padding:0 12px;border:1px solid var(--ty-input);border-radius:var(--ty-radius-md);background:var(--ty-background);color:var(--ty-foreground)}
  .action-status{margin:12px 0 0;color:var(--state-success);font-size:13px;line-height:1.5}.screen-stage{position:relative}.dialog-layer{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:24px 16px;border-radius:var(--ty-radius-lg);background:color-mix(in srgb,var(--ty-neutral-950) 42%,transparent)}.dialog-layer[hidden]{display:none}
  .alert-dialog{width:100%;max-width:320px;padding:20px;border:1px solid var(--ty-border);border-radius:var(--ty-radius-lg);background:var(--ty-popover);color:var(--ty-popover-foreground);box-shadow:var(--ty-shadow-float)}.dialog-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.dialog-top h3{margin:0;font-size:20px;font-weight:600;line-height:1.3}.alert-dialog p{margin:12px 0 0;color:var(--ty-muted-foreground);font-size:15px;line-height:1.6}.delete-names{margin:12px 0 0;padding:12px 0;border-top:1px solid var(--ty-hairline);border-bottom:1px solid var(--ty-hairline);font-size:14px;line-height:1.7}.dialog-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}
  .context-note{margin:16px 0 0;color:var(--ty-muted-foreground);font-size:13px}.app-footer{width:100%;max-width:1040px;margin:32px auto 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ty-hairline);color:var(--ty-muted-foreground);font-size:13px}.footer-inner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px}.app-footer p{margin:0}.footer-links{display:flex;flex-wrap:wrap;gap:8px 16px}.footer-links a{display:inline-flex;align-items:center;min-height:44px;text-decoration:none}.footer-links a:hover{color:var(--ty-foreground)}
  @media (min-width:800px){.board{padding:48px 32px 0}.screen-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.phone-screen{max-width:none}.app-footer{padding-right:32px;padding-left:32px}}
  @media (max-width:359px){.board{padding-right:12px;padding-left:12px}.screen-content{padding:16px}.book-item{grid-template-columns:40px 56px minmax(0,1fr);gap:8px}.book-cover{width:56px;height:84px}.management-controls{grid-template-columns:minmax(0,1fr);gap:8px}.view-switch{justify-self:start}.dialog-actions{grid-template-columns:minmax(0,1fr)}}
  @media (hover:none){.icon-button:hover,.text-button:hover{background:transparent}.primary-button:hover{background:var(--ty-primary);border-color:var(--ty-primary)}}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
<main class="board">
  <header class="board-heading">
    <h1>书库管理</h1>
    <p>搜索、分组与批量整理共享同一份书库上下文；删除前始终显示明确确认。</p>
  </header>
  <div class="screen-grid">
    <figure class="screen-wrap">
      <figcaption class="screen-label">列表、网格与多选</figcaption>
      <section class="phone-screen" aria-label="书库管理交互画板">
        <div class="screen-content">
          <header class="app-header">
            <a class="icon-button" href="shelf.html" data-dom-id="management-back-shelf" aria-label="返回书库"><i data-lucide="chevron-left" aria-hidden="true"></i></a>
            <h2>管理书库</h2>
            <button class="text-button header-action" id="selection-toggle" type="button" aria-pressed="true">完成</button>
          </header>
          <label class="search-box">
            <span class="visually-hidden">搜索书名或作者</span><i data-lucide="search" aria-hidden="true"></i>
            <input id="book-search" type="search" placeholder="搜索书名或作者" autocomplete="off">
          </label>
          <div class="management-controls">
            <label><span class="visually-hidden">按分组筛选</span>
              <select class="group-select" id="group-filter"><option value="all">全部分组</option><option value="reading">阅读中</option><option value="later">稍后阅读</option></select>
            </label>
            <div class="view-switch" role="group" aria-label="书籍布局">
              <button class="icon-button" id="list-view" type="button" aria-label="列表视图" aria-pressed="true"><i data-lucide="list" aria-hidden="true"></i></button>
              <button class="icon-button" id="grid-view" type="button" aria-label="网格视图" aria-pressed="false"><i data-lucide="grid-2x2" aria-hidden="true"></i></button>
            </div>
          </div>
          <p class="selection-summary" aria-live="polite"><span><strong id="selected-count">已选 2 本</strong> · 共 3 本</span><span id="visible-count">显示 3 本</span></p>
          <section class="book-group" data-group-section="reading" aria-labelledby="reading-group">
            <h3 id="reading-group">阅读中</h3>
            <ul class="book-list" id="book-list">
              <li class="book-item" data-group="reading" data-search="故乡 鲁迅">
                <label class="book-check"><span class="visually-hidden">选择《故乡》</span><input type="checkbox" checked></label>
                <img class="book-cover" src="../assets/cover-hometown.png" alt="《故乡》封面" width="64" height="96" decoding="async">
                <div class="book-copy"><h4>故乡</h4><p>鲁迅</p><p class="book-meta">第四章 · 42%</p></div>
              </li>
              <li class="book-item" data-group="reading" data-search="飞鸟集 泰戈尔">
                <label class="book-check"><span class="visually-hidden">选择《飞鸟集》</span><input type="checkbox" checked></label>
                <img class="book-cover" src="../assets/cover-birds.png" alt="《飞鸟集》封面" width="64" height="96" decoding="async">

          </section>
          <section class="book-group" data-group-section="later" aria-labelledby="later-group">

            <ul class="book-list">
              <li class="book-item" data-group="later" data-search="春 朱自清">
                <label class="book-check"><span class="visually-hidden">选择《春》</span><input type="checkbox"></label>
                <img class="book-cover" src="../assets/cover-spring.png" alt="《春》封面" width="64" height="96" decoding="async">

          <p class="empty-search" id="empty-search" hidden>没有匹配的书籍。可更换关键词或选择“全部分组”。</p>
          <div class="move-control" id="move-control">
            <label for="move-group">将所选书籍移动到</label>

            <button class="secondary-button" id="move-books" type="button"><i data-lucide="folder-input" aria-hidden="true"></i>移动</button>

    <figure class="screen-wrap" id="delete-preview">
      <figcaption class="screen-label">删除确认 · 保留底层书库</figcaption>
      <section class="phone-screen screen-stage" aria-label="删除书籍确认画板">
        <div class="screen-content" id="delete-context">
          <header class="app-header">
            <a class="icon-button" href="shelf.html" aria-label="返回书库"><i data-lucide="chevron-left" aria-hidden="true"></i></a><h2>管理书库</h2><button class="text-button header-action" type="button">完成</button>
          </header>
          <p class="selection-summary"><span><strong>已选 2 本</strong> · 共 3 本</span><span>阅读中</span></p>

            <li class="book-item"><span class="book-check" aria-hidden="true"><i data-lucide="circle"></i></span><img class="book-cover" src="../assets/cover-spring.png" alt="《春》封面" width="64" height="96"><div class="book-copy"><h4>春</h4><p>朱自清</p><p class="book-meta">已下载 · 2.8 MB</p></div></li>
          </ul>
          <p class="context-note">取消或关闭确认层后，所选书籍和当前分组保持不变。</p>
          <p class="action-status" id="delete-status" role="status" aria-live="polite"></p>

        <div class="dialog-layer" id="delete-layer">

            <div class="delete-names">《故乡》<br>《飞鸟集》</div>
            <div class="dialog-actions"><button class="secondary-button" id="cancel-delete" data-dom-id="cancel-delete" type="button">取消</button><button class="danger-button" id="confirm-delete" data-dom-id="confirm-delete" type="button">删除</button></div>

</footer>
<script>
  (() => {
    const search = document.getElementById('book-search');
    const group = document.getElementById('group-filter');
    const items = Array.from(document.querySelectorAll('.book-item[data-search]'));
    const empty = document.getElementById('empty-search');
    const visibleCount = document.getElementById('visible-count');
    const selectedCount = document.getElementById('selected-count');
    const list = document.getElementById('book-list');
    const listView = document.getElementById('list-view');
    const gridView = document.getElementById('grid-view');
    const toggle = document.getElementById('selection-toggle');
    const selectionControls = [document.getElementById('move-control'), document.getElementById('selection-actions')];
    function filterBooks() {
      const query = search.value.trim().toLowerCase();
      let count = 0;
      items.forEach(item => {
        const matchesText = item.dataset.search.toLowerCase().includes(query);
        const matchesGroup = group.value === 'all' || item.dataset.group === group.value;
        item.hidden = !(matchesText && matchesGroup);
        if (!item.hidden) count += 1;
      });
      document.querySelectorAll('[data-group-section]').forEach(section => {
        section.hidden = !Array.from(section.querySelectorAll('.book-item')).some(item => !item.hidden);
      });
      visibleCount.textContent = `显示 ${count} 本`;
      empty.hidden = count !== 0;
    }
    function updateSelection() {
      const count = items.filter(item => item.querySelector('input').checked).length;
      selectedCount.textContent = `已选 ${count} 本`;
      document.getElementById('move-books').disabled = count === 0;
    }
    function setView(mode) {
      document.querySelectorAll('.book-list').forEach(bookList => {
        if (bookList.id !== 'delete-book-list') bookList.classList.toggle('is-grid', mode === 'grid');
      });
      const isList = mode === 'list';
      listView.setAttribute('aria-pressed', String(isList));gridView.setAttribute('aria-pressed', String(!isList));
    }
    search.addEventListener('input', filterBooks);group.addEventListener('change', filterBooks);
    items.forEach(item => item.querySelector('input').addEventListener('change', updateSelection));
    listView.addEventListener('click', () => setView('list'));gridView.addEventListener('click', () => setView('grid'));
    toggle.addEventListener('click', () => {
      const selecting = toggle.getAttribute('aria-pressed') !== 'true';
      toggle.setAttribute('aria-pressed', String(selecting));toggle.textContent = selecting ? '完成' : '选择';
      document.querySelectorAll('.book-check').forEach(control => { if (control.tagName === 'LABEL') control.hidden = !selecting; });
      selectionControls.forEach(control => { control.hidden = !selecting; });
      if (!selecting) { items.forEach(item => { item.querySelector('input').checked = false; }); updateSelection(); }
    });
    document.getElementById('move-books').addEventListener('click', () => {
      const destination = document.getElementById('move-group').value;
      document.getElementById('management-status').textContent = `已将所选书籍移动到“${destination}”，原有阅读进度不变。`;
    });
    const layer = document.getElementById('delete-layer');
    const cancel = document.getElementById('cancel-delete');
    function closeDelete() { layer.hidden = true; document.getElementById('delete-status').textContent = '已取消删除，2 本书仍在原分组中。'; }
    cancel.addEventListener('click', closeDelete);document.getElementById('close-delete').addEventListener('click', closeDelete);
    document.getElementById('confirm-delete').addEventListener('click', () => {
      layer.hidden = true;document.querySelectorAll('.delete-target').forEach(item => item.remove());
      document.getElementById('delete-status').textContent = '已删除 2 本书。《春》和书库分组保持不变。';
    });
    document.addEventListener('keydown', event => { if (event.key === 'Escape' && !layer.hidden) { closeDelete(); cancel.focus(); } });
  })();
</script>
<script>lucide.createIcons();</script>
</body>
