<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>

    <title>阅读排版</title>
    <style id="theme-vars">

  --ty-neutral-300: #D8D8D8;
  --ty-neutral-400: #A3A3A3;
  --ty-neutral-500: #6E6E6E;
  --ty-neutral-600: #595959;
  --ty-neutral-900: #1F1F1F;
  --ty-neutral-950: #121212;

  --state-error: #B43832;

  --ty-foreground: var(--ty-neutral-900);

  --ty-primary: var(--ty-primary-500);
  --ty-primary-foreground: var(--ty-neutral-0);
  --ty-muted: var(--ty-neutral-100);
  --ty-muted-foreground: var(--ty-neutral-600);
  --ty-border: var(--ty-neutral-200);
  --ty-input: var(--ty-neutral-200);
  --ty-ring: var(--ty-primary-500);
  --ty-surface-sunken: var(--ty-neutral-50);
  --ty-hairline: var(--ty-neutral-200);
  --ty-radius-sm: 4px;
  --ty-radius-md: 8px;
  --ty-radius-lg: 16px;
  --ty-radius-full: 9999px;
  --ty-radius-small: var(--ty-radius-sm);
  --ty-radius-medium: var(--ty-radius-md);
  --ty-radius-large: var(--ty-radius-lg);
  --ty-font-sans: "PingFang SC", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  --ty-font-serif: "Songti SC", "Noto Serif SC", serif;
  --ty-font-mono: "SF Mono", ui-monospace, Menlo, monospace;
  --ty-shadow-hairline: 0 1px 2px rgba(0, 0, 0, 0.04);
  --ty-shadow-float: 0 12px 32px rgba(0, 0, 0, 0.14);
}

.dark {
  --ty-background: var(--ty-neutral-950);
  --ty-foreground: #F5F5F5;
  --ty-card: #1B1B1B;
  --ty-card-foreground: #F5F5F5;
  --ty-popover: #1B1B1B;
  --ty-popover-foreground: #F5F5F5;
  --ty-primary: #F5F5F5;
  --ty-primary-foreground: #121212;
  --ty-muted: #242424;
  --ty-muted-foreground: #A3A3A3;
  --ty-border: #2C2C2C;
  --ty-input: #2C2C2C;
  --ty-ring: #F5F5F5;
  --ty-surface-sunken: #181818;
  --ty-hairline: #2C2C2C;
  --ty-shadow-hairline: 0 1px 2px rgba(0, 0, 0, 0.30);
  --ty-shadow-float: 0 12px 32px rgba(0, 0, 0, 0.45);
}

.ty-display,
.ty-h1,
.ty-h2,
.ty-h3,
.ty-body,
.ty-caption,
.ty-label {
  font-family: var(--ty-font-sans);
}

.ty-display { font-weight: 700; line-height: 1.18; letter-spacing: -0.025em; }
.ty-h1 { font-weight: 700; line-height: 1.22; letter-spacing: -0.02em; }
.ty-h2 { font-weight: 600; line-height: 1.28; letter-spacing: -0.01em; }
.ty-h3 { font-weight: 600; line-height: 1.35; }
.ty-body { font-weight: 400; line-height: 1.6; }
.ty-caption { font-weight: 400; font-size: 13px; line-height: 1.5; }
.ty-label { font-weight: 500; font-size: 13px; line-height: 1.4; }
.ty-reading { font-family: var(--ty-font-serif); font-weight: 400; line-height: 1.95; }
.ty-numeric { font-family: var(--ty-font-sans); font-variant-numeric: tabular-nums; }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">

</head>
<body>
  <main class="preferences-page">
    <style id="critical-layout">
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--ty-surface-sunken);
        color: var(--ty-foreground);
        font-family: var(--ty-font-sans);
        -webkit-font-smoothing: antialiased;
      }
      button, input, select { font: inherit; }
      .preferences-page {
        width: 100%;
        max-width: 480px;
        min-height: 100vh;
        margin: 0 auto;
        background: var(--ty-background);
        color: var(--ty-foreground);
        font-family: var(--ty-font-sans);
      }
      .preferences-page svg { width: 20px; height: 20px; flex: none; stroke-width: 1.5; }
      .context-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 60px;
        padding: max(8px, env(safe-area-inset-top)) 20px 8px;
        border-bottom: 1px solid var(--ty-hairline);
      }
      .context-back { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; font-size: 13px; }
      .context-progress { color: var(--ty-muted-foreground); font-size: 13px; font-variant-numeric: tabular-nums; }
      .context-article { padding: 24px 24px 32px; }
      .context-chapter { margin: 0; color: var(--ty-muted-foreground); font-size: 13px; line-height: 1.5; }
      .context-title { margin: 8px 0 24px; font-size: 26px; font-weight: 600; line-height: 1.25; }
      .context-body { font-family: var(--ty-font-serif); font-size: 19px; line-height: 1.95; text-align: justify; }
      .context-body p { margin: 0; overflow-wrap: break-word; }
      .sheet {
        margin-top: 8px;
        border-top: 1px solid var(--ty-hairline);
        border-radius: var(--ty-radius-lg) var(--ty-radius-lg) 0 0;
        background: var(--ty-popover);
        box-shadow: var(--ty-shadow-float);
      }
      .sheet-handle { width: 36px; height: 4px; margin: 8px auto 4px; border-radius: var(--ty-radius-sm); background: var(--ty-neutral-300); }
      .sheet-header {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) 44px;
        align-items: center;
        gap: 8px;
        padding: 4px 12px 8px;
        border-bottom: 1px solid var(--ty-hairline);
      }
      .sheet-header h1 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.35; text-align: center; }
      .close-button, .step-button, .reset-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 44px;
        min-height: 44px;
        padding: 0;
        border: 0;
        border-radius: var(--ty-radius-md);
        background: transparent;
        color: var(--ty-foreground);
        cursor: pointer;
        transition: background-color 140ms cubic-bezier(.2,.8,.2,1), transform 140ms cubic-bezier(.2,.8,.2,1), opacity 140ms cubic-bezier(.2,.8,.2,1);
      }
      .settings-tabs {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
        padding: 0 16px;
        border-bottom: 1px solid var(--ty-hairline);
      }
      .settings-tabs a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
        min-height: 48px;
        padding: 0 2px;
        border-bottom: 2px solid transparent;
        color: var(--ty-foreground);
        font-size: 13px;
        line-height: 1.4;
        text-decoration: none;
        white-space: nowrap;
        transition: border-color 140ms cubic-bezier(.2,.8,.2,1), background-color 140ms cubic-bezier(.2,.8,.2,1), opacity 140ms cubic-bezier(.2,.8,.2,1);
      }
      .settings-tabs a[aria-current="page"] { border-bottom-color: var(--ty-foreground); }
      .settings-section { padding: 22px 20px 24px; scroll-margin-top: 16px; }
      .settings-section + .settings-section { border-top: 1px solid var(--ty-hairline); }
      .settings-section h2 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.35; }
      .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
      .section-value { color: var(--ty-muted-foreground); font-size: 13px; line-height: 1.5; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .setting-block + .setting-block { margin-top: 24px; padding-top: 22px; border-top: 1px solid var(--ty-hairline); }
      .font-size-control { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 12px; }
      .step-button { border: 1px solid var(--ty-input); background: var(--ty-background); }
      .font-size-range { width: 100%; min-height: 44px; margin: 0; accent-color: var(--ty-primary); cursor: pointer; }
      .range-label { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; clip-path: inset(50%); white-space: nowrap; }
      .choice-group {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        margin: 0;
        padding: 0;
        border: 1px solid var(--ty-input);
        border-radius: var(--ty-radius-md);
        background: var(--ty-background);
      }
      .choice {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-width: 0;
        min-height: 52px;
        padding: 8px 4px;
        color: var(--ty-foreground);
        font-size: 13px;
        line-height: 1.4;
        text-align: center;
        cursor: pointer;
        transition: background-color 140ms cubic-bezier(.2,.8,.2,1), opacity 140ms cubic-bezier(.2,.8,.2,1);
      }
      .choice + .choice { border-left: 1px solid var(--ty-hairline); }
      .choice:first-child { border-radius: var(--ty-radius-md) 0 0 var(--ty-radius-md); }
      .choice:last-child { border-radius: 0 var(--ty-radius-md) var(--ty-radius-md) 0; }
      .choice input { width: 16px; height: 16px; flex: none; margin: 0; accent-color: var(--ty-primary); }
      .choice span { min-width: 0; overflow-wrap: break-word; }
      .field-label { display: block; margin-bottom: 10px; font-size: 14px; font-weight: 600; line-height: 1.45; }
      .font-select {
        width: 100%;
        min-height: 48px;
        padding: 0 40px 0 12px;
        border: 1px solid var(--ty-input);
        border-radius: var(--ty-radius-md);
        background: var(--ty-background);
        color: var(--ty-foreground);
        font-family: var(--ty-font-sans);
        font-size: 15px;
        cursor: pointer;
      }
      .field-help { margin: 10px 0 0; color: var(--ty-muted-foreground); font-size: 13px; line-height: 1.6; }
      .rules-list { margin-top: 4px; }
      .switch-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 64px;
        padding: 12px 0;
        cursor: pointer;
      }
      .switch-row + .switch-row { border-top: 1px solid var(--ty-hairline); }
      .switch-copy { flex: 1; min-width: 0; }
      .switch-title { display: block; font-size: 15px; line-height: 1.45; }
      .switch-description { display: block; margin-top: 4px; color: var(--ty-muted-foreground); font-size: 13px; line-height: 1.55; overflow-wrap: break-word; }
      .switch-row input { width: 20px; height: 20px; flex: none; margin: 0; accent-color: var(--ty-primary); cursor: pointer; }
      .sheet-footer {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px 16px;
        padding: 12px 20px max(12px, env(safe-area-inset-bottom));
        border-top: 1px solid var(--ty-hairline);
        color: var(--ty-muted-foreground);
        font-size: 13px;
        line-height: 1.5;
      }
      .reset-button { padding: 0 12px; color: var(--ty-foreground); font-size: 14px; white-space: nowrap; }
      .close-button:focus-visible, .step-button:focus-visible, .reset-button:focus-visible, .settings-tabs a:focus-visible, .font-select:focus-visible, .font-size-range:focus-visible, .choice:focus-within, .switch-row:focus-within {
        outline: 2px solid var(--ty-ring);
        outline-offset: -3px;
      }
      .close-button:active, .step-button:active, .reset-button:active { transform: translateY(1px); }
      @media (hover: hover) {
        .close-button:hover, .step-button:hover, .reset-button:hover, .settings-tabs a:hover, .choice:hover, .switch-row:hover { background: var(--ty-muted); }
      }
      @media (max-width: 359px) {
        .context-article { padding-right: 20px; padding-left: 20px; }
        .settings-section { padding-right: 16px; padding-left: 16px; }
        .settings-tabs { padding-right: 12px; padding-left: 12px; gap: 4px; }
        .choice { gap: 4px; font-size: 12px; }
      }
      @media (min-width: 640px) {
        .preferences-page { border-right: 1px solid var(--ty-hairline); border-left: 1px solid var(--ty-hairline); }
      }
      @media (prefers-reduced-motion: reduce) {
        .close-button, .step-button, .reset-button, .settings-tabs a, .choice { transition-duration: .01ms; }
      }
    </style>

    <section class="reader-context" aria-label="底层正文上下文">
      <header class="context-header">
        <div class="context-back"><i data-lucide="chevron-left" aria-hidden="true"></i><span>此刻</span></div>
        <span class="context-progress">19 pt · 1.95 倍行距</span>
      </header>
      <article class="context-article">
        <p class="context-chapter">第四章</p>
        <p class="context-title">故乡</p>
        <div class="context-body"><p>我所记得的故乡全不如此。我的故乡好得多了。但要我记起他的美丽，说出他的佳处来，却又没有影像，没有言辞了。仿佛也就如此。</p></div>
      </article>
    </section>

    <section class="sheet" aria-labelledby="preferences-title">
      <div class="sheet-handle" aria-hidden="true"></div>
      <header class="sheet-header">
        <span aria-hidden="true"></span>
        <h1 id="preferences-title">阅读排版</h1>
        <button type="button" class="close-button" data-dom-id="preferences-close-reader" aria-label="关闭排版并返回正文"><i data-lucide="x" aria-hidden="true"></i></button>
      </header>
      <nav class="settings-tabs" aria-label="排版设置分类">
        <a href="#type-setting" aria-current="page">排版</a>
        <a href="#more-setting">更多排版</a>
        <a href="#font-setting">字体</a>
        <a href="#txt-setting">TXT 规则</a>
      </nav>

      <form id="preferences-form">
        <section class="settings-section" id="type-setting" aria-labelledby="type-setting-title">
          <div class="setting-block">
            <div class="section-heading"><h2 id="type-setting-title">字号</h2><output class="section-value" for="font-size">19 pt</output></div>
            <div class="font-size-control">
              <button class="step-button" type="button" aria-label="减小字号"><i data-lucide="minus" aria-hidden="true"></i></button>
              <label class="range-label" for="font-size">正文字号，14 至 28 pt</label>
              <input class="font-size-range" id="font-size" name="font-size" type="range" min="14" max="28" step="1" value="19">
              <button class="step-button" type="button" aria-label="增大字号"><i data-lucide="plus" aria-hidden="true"></i></button>
            </div>
          </div>
          <div class="setting-block">
            <div class="section-heading"><h2>行距</h2><span class="section-value">1.95 倍</span></div>
            <div class="choice-group" role="radiogroup" aria-label="正文行距">
              <label class="choice"><input type="radio" name="line-height" value="1.6"><span>紧凑 1.6</span></label>
              <label class="choice"><input type="radio" name="line-height" value="1.95" checked><span>标准 1.95</span></label>
              <label class="choice"><input type="radio" name="line-height" value="2.2"><span>宽松 2.2</span></label>
            </div>
          </div>
        </section>

        <section class="settings-section" id="more-setting" aria-labelledby="more-setting-title">
          <div class="setting-block">
            <div class="section-heading"><h2 id="more-setting-title">页边距</h2><span class="section-value">24 px</span></div>
            <div class="choice-group" role="radiogroup" aria-label="正文页边距">
              <label class="choice"><input type="radio" name="margin" value="16"><span>窄 · 16</span></label>
              <label class="choice"><input type="radio" name="margin" value="24" checked><span>标准 · 24</span></label>
              <label class="choice"><input type="radio" name="margin" value="40"><span>宽 · 40</span></label>
            </div>
          </div>
          <div class="setting-block">
            <div class="section-heading"><h2>翻页方式</h2><span class="section-value">左右翻页</span></div>
            <div class="choice-group" role="radiogroup" aria-label="翻页方式">
              <label class="choice"><input type="radio" name="pagination" value="scroll"><span>滚动</span></label>
              <label class="choice"><input type="radio" name="pagination" value="horizontal" checked><span>左右翻页</span></label>
              <label class="choice"><input type="radio" name="pagination" value="vertical"><span>上下翻页</span></label>
            </div>
          </div>
        </section>

        <section class="settings-section" id="font-setting" aria-labelledby="font-setting-title">
          <h2 id="font-setting-title">字体</h2>
          <div class="setting-block">
            <label class="field-label" for="reading-font">正文字体</label>
            <select class="font-select" id="reading-font" name="reading-font">
              <option value="Songti SC" selected>Songti SC（宋体）</option>
              <option value="PingFang SC">PingFang SC（系统）</option>
              <option value="Kaiti SC">Kaiti SC（楷体）</option>
              <option value="Heiti SC">Heiti SC（黑体）</option>
            </select>
            <p class="field-help">字体仅改变正文，界面始终使用 PingFang SC。</p>
          </div>
        </section>

        <section class="settings-section" id="txt-setting" aria-labelledby="txt-setting-title">
          <h2 id="txt-setting-title">TXT 规则</h2>
          <div class="rules-list">
            <label class="switch-row"><span class="switch-copy"><span class="switch-title">智能识别章节</span><span class="switch-description">按“第几章”等常见标题生成目录。</span></span><input type="checkbox" name="detect-chapters" checked></label>
            <label class="switch-row"><span class="switch-copy"><span class="switch-title">去除多余空行</span><span class="switch-description">合并连续空行，保留正常段落间距。</span></span><input type="checkbox" name="trim-empty-lines" checked></label>
            <label class="switch-row"><span class="switch-copy"><span class="switch-title">按缩进划分段落</span><span class="switch-description">适合以全角空格标记段首的文本。</span></span><input type="checkbox" name="indent-paragraphs"></label>
          </div>
        </section>
      </form>

      <footer class="sheet-footer"><span>更改即时应用，仅用于本书</span><button class="reset-button" type="reset" form="preferences-form">还原默认</button></footer>
    </section>
  </main>
  <script>lucide.createIcons();</script>
</body>
</html>
