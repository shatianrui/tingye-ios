<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通用设置</title>
    <style id="theme-vars">
:root {
  --ty-primary-50: #F5F5F5;
  --ty-primary-100: #E8E8E8;
  --ty-primary-200: #D1D1D1;
  --ty-primary-300: #A3A3A3;
  --ty-primary-400: #6E6E6E;
  --ty-primary-500: #1F1F1F;
  --ty-primary-600: #121212;
  --ty-neutral-0: #FFFFFF;
  --ty-neutral-50: #FAFAFA;
  --ty-neutral-100: #F5F5F5;
  --ty-neutral-200: #EFEFEF;
  --ty-neutral-300: #D8D8D8;
  --ty-neutral-400: #A3A3A3;
  --ty-neutral-500: #6E6E6E;
  --ty-neutral-600: #595959;
  --ty-neutral-900: #1F1F1F;
  --ty-neutral-950: #121212;
  --state-success: #2E6B4F;
  --state-error: #B43832;
  --ty-background: var(--ty-neutral-0);
  --ty-foreground: var(--ty-neutral-900);
  --ty-card: var(--ty-neutral-0);
  --ty-card-foreground: var(--ty-neutral-900);
  --ty-popover: var(--ty-neutral-0);
  --ty-popover-foreground: var(--ty-neutral-900);
  --ty-primary: var(--ty-primary-500);
  --ty-primary-foreground: var(--ty-neutral-0);
  --ty-muted: var(--ty-neutral-100);
  --ty-muted-foreground: var(--ty-neutral-600);
  --ty-border: var(--ty-neutral-200);
  --ty-input: var(--ty-neutral-200);
  --ty-ring: var(--ty-primary-500);
  --ty-surface-sunken: var(--ty-neutral-50);
  --ty-hairline: var(--ty-neutral-200);
  --ty-radius-sm: 4px;
  --ty-radius-md: 8px;
  --ty-radius-lg: 16px;
  --ty-radius-full: 9999px;
  --ty-radius-small: var(--ty-radius-sm);
  --ty-radius-medium: var(--ty-radius-md);
  --ty-radius-large: var(--ty-radius-lg);
  --ty-font-sans: "PingFang SC", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  --ty-font-serif: "Songti SC", "Noto Serif SC", serif;
  --ty-font-mono: "SF Mono", ui-monospace, Menlo, monospace;
  --ty-shadow-hairline: 0 1px 2px rgba(0, 0, 0, 0.04);
  --ty-shadow-float: 0 12px 32px rgba(0, 0, 0, 0.14);
}

.dark {
  --ty-background: var(--ty-neutral-950);
  --ty-foreground: #F5F5F5;
  --ty-card: #1B1B1B;
  --ty-card-foreground: #F5F5F5;
  --ty-popover: #1B1B1B;
  --ty-popover-foreground: #F5F5F5;
  --ty-primary: #F5F5F5;
  --ty-primary-foreground: #121212;
  --ty-muted: #242424;
  --ty-muted-foreground: #A3A3A3;
  --ty-border: #2C2C2C;
  --ty-input: #2C2C2C;
  --ty-ring: #F5F5F5;
  --ty-surface-sunken: #181818;
  --ty-hairline: #2C2C2C;
  --ty-shadow-hairline: 0 1px 2px rgba(0, 0, 0, 0.30);
  --ty-shadow-float: 0 12px 32px rgba(0, 0, 0, 0.45);
}

.ty-display,
.ty-h1,
.ty-h2,
.ty-h3,
.ty-body,
.ty-caption,
.ty-label {
  font-family: var(--ty-font-sans);
}

.ty-display { font-weight: 700; line-height: 1.18; letter-spacing: -0.025em; }
.ty-h1 { font-weight: 700; line-height: 1.22; letter-spacing: -0.02em; }
.ty-h2 { font-weight: 600; line-height: 1.28; letter-spacing: -0.01em; }
.ty-h3 { font-weight: 600; line-height: 1.35; }
.ty-body { font-weight: 400; line-height: 1.6; }
.ty-caption { font-weight: 400; font-size: 13px; line-height: 1.5; }
.ty-label { font-weight: 500; font-size: 13px; line-height: 1.4; }
.ty-reading { font-family: var(--ty-font-serif); font-weight: 400; line-height: 1.95; }
.ty-numeric { font-family: var(--ty-font-sans); font-variant-numeric: tabular-nums; }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--ty-background);
    --color-foreground: var(--ty-foreground);
    --color-card: var(--ty-card);
    --color-card-foreground: var(--ty-card-foreground);
    --color-popover: var(--ty-popover);
    --color-popover-foreground: var(--ty-popover-foreground);
    --color-primary: var(--ty-primary);
    --color-primary-foreground: var(--ty-primary-foreground);
    --color-muted: var(--ty-muted);
    --color-muted-foreground: var(--ty-muted-foreground);
    --color-border: var(--ty-border);
    --color-input: var(--ty-input);
    --color-ring: var(--ty-ring);
    --radius-sm: var(--ty-radius-sm);
    --radius-md: var(--ty-radius-md);
    --radius-lg: var(--ty-radius-lg);
  }
  @layer base {
    body { background: var(--ty-background); color: var(--ty-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--ty-background); }
      .text-background { color: var(--ty-background); }
      .border-background { border-color: var(--ty-background); }
      .ring-background { --tw-ring-color: var(--ty-background); }
      .bg-foreground { background-color: var(--ty-foreground); }
      .text-foreground { color: var(--ty-foreground); }
      .border-foreground { border-color: var(--ty-foreground); }
      .ring-foreground { --tw-ring-color: var(--ty-foreground); }
      .bg-card { background-color: var(--ty-card); }
      .text-card { color: var(--ty-card); }
      .border-card { border-color: var(--ty-card); }
      .ring-card { --tw-ring-color: var(--ty-card); }
      .bg-card-foreground { background-color: var(--ty-card-foreground); }
      .text-card-foreground { color: var(--ty-card-foreground); }
      .border-card-foreground { border-color: var(--ty-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--ty-card-foreground); }
      .bg-popover { background-color: var(--ty-popover); }
      .text-popover { color: var(--ty-popover); }
      .border-popover { border-color: var(--ty-popover); }
      .ring-popover { --tw-ring-color: var(--ty-popover); }
      .bg-popover-foreground { background-color: var(--ty-popover-foreground); }
      .text-popover-foreground { color: var(--ty-popover-foreground); }
      .border-popover-foreground { border-color: var(--ty-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--ty-popover-foreground); }
      .bg-primary { background-color: var(--ty-primary); }
      .text-primary { color: var(--ty-primary); }
      .border-primary { border-color: var(--ty-primary); }
      .ring-primary { --tw-ring-color: var(--ty-primary); }
      .bg-primary-foreground { background-color: var(--ty-primary-foreground); }
      .text-primary-foreground { color: var(--ty-primary-foreground); }
      .border-primary-foreground { border-color: var(--ty-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--ty-primary-foreground); }
      .bg-muted { background-color: var(--ty-muted); }
      .text-muted { color: var(--ty-muted); }
      .border-muted { border-color: var(--ty-muted); }
      .ring-muted { --tw-ring-color: var(--ty-muted); }
      .bg-muted-foreground { background-color: var(--ty-muted-foreground); }
      .text-muted-foreground { color: var(--ty-muted-foreground); }
      .border-muted-foreground { border-color: var(--ty-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--ty-muted-foreground); }
      .bg-border { background-color: var(--ty-border); }
      .text-border { color: var(--ty-border); }
      .border-border { border-color: var(--ty-border); }
      .ring-border { --tw-ring-color: var(--ty-border); }
      .bg-input { background-color: var(--ty-input); }
      .text-input { color: var(--ty-input); }
      .border-input { border-color: var(--ty-input); }
      .ring-input { --tw-ring-color: var(--ty-input); }
      .bg-ring { background-color: var(--ty-ring); }
      .text-ring { color: var(--ty-ring); }
      .border-ring { border-color: var(--ty-ring); }
      .ring-ring { --tw-ring-color: var(--ty-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
<main class="settings-page">
<style id="critical-layout">
.settings-page{min-height:100vh;width:100%;margin:0;background:var(--ty-surface-sunken);color:var(--ty-foreground);font-family:var(--ty-font-sans)}
.settings-page,.settings-page *,.settings-page *::before,.settings-page *::after{box-sizing:border-box}
.settings-shell{width:100%;max-width:430px;min-height:100vh;margin:0 auto;background:var(--ty-background)}
.topbar{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px;min-height:52px;padding:env(safe-area-inset-top,0px) 8px 0;border-bottom:1px solid var(--ty-hairline)}
.topbar h1{margin:0;font-size:17px;font-weight:600;line-height:1.3;text-align:center;letter-spacing:-.01em}
.icon-button{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;min-width:44px;padding:0;border:0;border-radius:var(--ty-radius-md);background:transparent;color:var(--ty-foreground);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background-color 140ms ease,opacity 140ms ease}.icon-button svg{width:22px;height:22px;stroke-width:1.5}.icon-button:active{opacity:.6}
.icon-button:focus-visible,.setting-row:focus-visible,.switch:focus-visible,.reorder-button:focus-visible{outline:2px solid var(--ty-ring);outline-offset:-2px}
.settings-content{padding:24px 20px 32px}
.settings-section+.settings-section{margin-top:28px}
.settings-section h2{margin:0 0 8px;color:var(--ty-muted-foreground);font-size:13px;font-weight:400;line-height:1.5}
.settings-group{border:1px solid var(--ty-hairline);border-radius:var(--ty-radius-md);background:var(--ty-card)}
.setting-row{display:grid;grid-template-columns:minmax(0,1fr) auto 16px;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 12px;border:0;background:transparent;color:var(--ty-foreground);font-family:var(--ty-font-sans);font-size:16px;line-height:1.45;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background-color 140ms ease,opacity 140ms ease}
.setting-row+.setting-row,.switch-row+.setting-row,.setting-row+.switch-row{border-top:1px solid var(--ty-hairline)}
.setting-label{min-width:0;overflow-wrap:anywhere}.setting-value{color:var(--ty-muted-foreground);font-size:14px;line-height:1.45;text-align:right;white-space:nowrap}.chevron{width:16px;height:16px;color:var(--ty-muted-foreground);stroke-width:1.5}.setting-row:active{opacity:.65}
.switch-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:16px;min-height:52px;padding:0 12px;font-size:16px;line-height:1.45;cursor:pointer}
.switch{position:relative;width:48px;height:32px;flex-shrink:0;margin:0;border:1px solid var(--ty-border);border-radius:var(--ty-radius-lg);background:var(--ty-muted);appearance:none;cursor:pointer;transition:background-color 160ms ease,border-color 160ms ease}
.switch::before{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:var(--ty-neutral-0);box-shadow:var(--ty-shadow-hairline);transition:transform 160ms ease}
.switch:checked{border-color:var(--ty-primary);background:var(--ty-primary)}.switch:checked::before{transform:translateX(16px)}
.section-note{margin:8px 0 0;color:var(--ty-muted-foreground);font-size:12px;line-height:1.55}
.menu-list{margin:0;padding:0;list-style:none;border:1px solid var(--ty-hairline);border-radius:var(--ty-radius-md);background:var(--ty-card)}
.menu-item{display:grid;grid-template-columns:24px minmax(0,1fr) 44px;align-items:center;gap:12px;min-height:52px;padding-left:12px;font-size:16px;line-height:1.45}.menu-item+.menu-item{border-top:1px solid var(--ty-hairline)}
.order-index{color:var(--ty-muted-foreground);font-size:13px;text-align:center;font-variant-numeric:tabular-nums}.reorder-button{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border:0;border-radius:var(--ty-radius-md);background:transparent;color:var(--ty-muted-foreground);cursor:grab;transition:background-color 140ms ease,color 140ms ease,opacity 140ms ease}.reorder-button svg{width:20px;height:20px;stroke-width:1.5}.reorder-button:active{cursor:grabbing;opacity:.6}
.page-footer{padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ty-hairline);background:var(--ty-surface-sunken);color:var(--ty-muted-foreground);font-size:12px;line-height:1.6;text-align:center}.page-footer p{margin:0}.page-footer p+p{margin-top:4px}
@media(hover:hover){.icon-button:hover,.setting-row:hover,.reorder-button:hover{background:var(--ty-muted)}.reorder-button:hover{color:var(--ty-foreground)}}
@media(max-width:350px){.settings-content{padding-right:16px;padding-left:16px}.setting-row{gap:8px;font-size:15px}.setting-value{font-size:13px}}
@media(prefers-reduced-motion:reduce){.icon-button,.setting-row,.switch,.switch::before,.reorder-button{transition-duration:.01ms}}
</style>
<div class="settings-shell">
<header class="topbar">
<button type="button" class="icon-button" data-dom-id="settings-general-back-profile" aria-label="返回我的"><i data-lucide="chevron-left" aria-hidden="true"></i></button>
<h1>通用设置</h1><span aria-hidden="true"></span>
</header>
<div class="settings-content">
<section class="settings-section" aria-labelledby="general-group">
<h2 id="general-group">通用</h2>
<div class="settings-group">
<button type="button" class="setting-row"><span class="setting-label">语言</span><span class="setting-value">简体中文</span><i data-lucide="chevron-right" class="chevron" aria-hidden="true"></i></button>
<button type="button" class="setting-row"><span class="setting-label">启动页</span><span class="setting-value">继续阅读</span><i data-lucide="chevron-right" class="chevron" aria-hidden="true"></i></button>
<button type="button" class="setting-row"><span class="setting-label">日期与时间</span><span class="setting-value">跟随系统</span><i data-lucide="chevron-right" class="chevron" aria-hidden="true"></i></button>
<label class="switch-row"><span>触觉反馈</span><input class="switch" type="checkbox" role="switch" checked aria-label="触觉反馈"></label>
</div>
<p class="section-note">触觉反馈用于翻页、完成目标和整理书籍等操作。</p>
</section>
<section class="settings-section" aria-labelledby="menu-group">
<h2 id="menu-group">菜单</h2>
<div class="settings-group">
<button type="button" class="setting-row"><span class="setting-label">长按手势</span><span class="setting-value">打开书籍菜单</span><i data-lucide="chevron-right" class="chevron" aria-hidden="true"></i></button>
<button type="button" class="setting-row"><span class="setting-label">显示项目</span><span class="setting-value">4 项</span><i data-lucide="chevron-right" class="chevron" aria-hidden="true"></i></button>
</div>
<p class="section-note">菜单顺序会同时应用到书库与阅读页面。</p>
</section>
<section class="settings-section" aria-labelledby="order-group">
<h2 id="order-group">菜单顺序</h2>
<ol class="menu-list">
<li class="menu-item"><span class="order-index">1</span><span>继续阅读</span><button type="button" class="reorder-button" aria-label="调整继续阅读的顺序"><i data-lucide="grip-vertical" aria-hidden="true"></i></button></li>
<li class="menu-item"><span class="order-index">2</span><span>查看书籍详情</span><button type="button" class="reorder-button" aria-label="调整查看书籍详情的顺序"><i data-lucide="grip-vertical" aria-hidden="true"></i></button></li>
<li class="menu-item"><span class="order-index">3</span><span>导出笔记</span><button type="button" class="reorder-button" aria-label="调整导出笔记的顺序"><i data-lucide="grip-vertical" aria-hidden="true"></i></button></li>
<li class="menu-item"><span class="order-index">4</span><span>分享书籍</span><button type="button" class="reorder-button" aria-label="调整分享书籍的顺序"><i data-lucide="grip-vertical" aria-hidden="true"></i></button></li>
</ol>
<p class="section-note">拖动右侧手柄调整顺序；更改会自动保存到此设备。</p>
</section>
<section class="settings-section" aria-labelledby="behavior-group">
<h2 id="behavior-group">操作</h2>
<div class="settings-group">
<label class="switch-row"><span>翻页时播放声音</span><input class="switch" type="checkbox" role="switch" aria-label="翻页时播放声音"></label>
<label class="switch-row"><span>完成阅读后显示分享选项</span><input class="switch" type="checkbox" role="switch" checked aria-label="完成阅读后显示分享选项"></label>
</div>
</section>
</div>
<footer class="page-footer"><p>听页 · 通用偏好仅在此设备生效</p><p>当前语言：简体中文 · 启动页：继续阅读</p></footer>
</div>
</main>
<script>lucide.createIcons();</script>
</body>
</html>
