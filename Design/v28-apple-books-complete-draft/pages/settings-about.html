<style id="critical-layout">
  *,*::before,*::after{box-sizing:border-box}
  html{background:var(--ty-surface-sunken)}
  body{margin:0;min-width:0;min-height:100vh;background:var(--ty-surface-sunken);color:var(--ty-foreground);font-family:var(--ty-font-sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  button,a{font:inherit}button,a{-webkit-tap-highlight-color:transparent}button{cursor:pointer}a{color:inherit}
  button:focus-visible,a:focus-visible{outline:2px solid var(--ty-ring);outline-offset:3px}button:disabled{cursor:not-allowed;opacity:.45}svg{width:20px;height:20px;flex:0 0 auto;stroke-width:1.5}
  .board{width:100%;max-width:960px;min-height:100vh;margin:0 auto;padding:32px 20px 0}.board-heading{max-width:720px;margin:0 0 28px}.board-heading h1{margin:0;font-size:30px;font-weight:700;line-height:1.22;letter-spacing:-.02em}.board-heading p{margin:8px 0 0;color:var(--ty-muted-foreground);font-size:15px;line-height:1.65}
  .screen-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:start}.screen-wrap{min-width:0;margin:0}.screen-label{margin:0 0 10px;color:var(--ty-muted-foreground);font-size:13px;font-weight:500;line-height:1.5}.phone-screen{width:100%;max-width:430px;margin:0 auto;border:1px solid var(--ty-hairline);border-radius:var(--ty-radius-lg);background:var(--ty-background)}.screen-content{padding:20px}.screen-stage{display:grid;grid-template-columns:minmax(0,1fr)}.screen-stage>.screen-content,.screen-stage>.sheet-layer{grid-area:1/1;min-width:0}
  .app-header{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px;min-height:44px;margin-bottom:20px}.app-header h2{margin:0;text-align:center;font-size:17px;font-weight:600;line-height:1.35}.header-note{justify-self:end;color:var(--ty-muted-foreground);font-size:12px}
  .icon-button,.text-button,.primary-button,.secondary-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:44px;min-height:44px;border-radius:var(--ty-radius-md);text-decoration:none;line-height:1.45;transition:background-color 140ms ease,opacity 140ms ease}.icon-button{padding:0;border:0;background:transparent;color:var(--ty-foreground)}.text-button{padding:0 8px;border:0;background:transparent;color:var(--ty-foreground)}.primary-button{padding:10px 16px;border:1px solid var(--ty-primary);background:var(--ty-primary);color:var(--ty-primary-foreground)}.secondary-button{padding:10px 16px;border:1px solid var(--ty-border);background:var(--ty-background);color:var(--ty-foreground)}
  .app-identity{display:grid;justify-items:center;padding:10px 0 26px;text-align:center}.identity-mark{display:flex;align-items:center;justify-content:center;width:56px;height:56px;border:1px solid var(--ty-hairline);border-radius:var(--ty-radius-lg);background:var(--ty-foreground);color:var(--ty-background)}.identity-mark svg{width:28px;height:28px}.app-identity h3{margin:14px 0 0;font-size:24px;font-weight:600;line-height:1.3;letter-spacing:-.01em}.app-identity p{margin:5px 0 0;color:var(--ty-muted-foreground);font-size:13px;font-variant-numeric:tabular-nums}.app-identity .identity-tagline{margin-top:10px;color:var(--ty-foreground);font-size:14px;font-variant-numeric:normal}
  .settings-section+.settings-section{margin-top:26px}.settings-section>h3{margin:0 0 8px;color:var(--ty-muted-foreground);font-size:13px;font-weight:400;line-height:1.5}.settings-group{border-top:1px solid var(--ty-hairline);border-bottom:1px solid var(--ty-hairline)}
  .setting-row{display:grid;grid-template-columns:minmax(0,1fr) auto 16px;align-items:center;gap:12px;width:100%;min-height:54px;padding:10px 0;border:0;background:transparent;color:var(--ty-foreground);font-size:16px;line-height:1.45;text-align:left;text-decoration:none;cursor:pointer;transition:opacity 140ms ease}.setting-row+.setting-row{border-top:1px solid var(--ty-hairline)}.setting-copy{min-width:0}.setting-label{display:block;overflow-wrap:anywhere}.setting-subtitle{display:block;margin-top:3px;color:var(--ty-muted-foreground);font-size:12px;line-height:1.5;overflow-wrap:anywhere}.setting-value{max-width:160px;color:var(--ty-muted-foreground);font-size:13px;line-height:1.45;text-align:right;overflow-wrap:anywhere}.chevron{width:16px;height:16px;color:var(--ty-muted-foreground)}
  .section-note{margin:8px 0 0;color:var(--ty-muted-foreground);font-size:12px;line-height:1.6}.success-text{color:var(--state-success)}.inline-status{min-height:22px;margin:10px 0 0;color:var(--state-success);font-size:13px;line-height:1.55}
  .legal-footer{margin:28px 0 0;color:var(--ty-muted-foreground);font-size:12px;line-height:1.7;text-align:center}.legal-footer p{margin:0}.legal-footer p+p{margin-top:4px}
  .sheet-layer{position:relative;inset:auto;z-index:5;display:flex;align-items:flex-end;padding:72px 10px 10px;border-radius:var(--ty-radius-lg);background:color-mix(in srgb,var(--ty-neutral-950) 38%,transparent)}.sheet-layer[hidden]{display:none}
  .bottom-sheet{width:100%;padding:8px 20px 20px;border:1px solid var(--ty-border);border-radius:var(--ty-radius-lg);background:var(--ty-popover);color:var(--ty-popover-foreground);box-shadow:var(--ty-shadow-float)}.sheet-handle{width:36px;height:4px;margin:2px auto 12px;border-radius:var(--ty-radius-full);background:var(--ty-neutral-300)}.sheet-top{display:grid;grid-template-columns:minmax(0,1fr) 44px;align-items:center;gap:12px}.sheet-top h3{margin:0;font-size:20px;font-weight:600;line-height:1.35}.sheet-intro{margin:8px 0 0;color:var(--ty-muted-foreground);font-size:13px;line-height:1.6}.privacy-list{margin:16px 0 0;padding:0;list-style:none;border-top:1px solid var(--ty-hairline)}.privacy-list li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--ty-hairline)}.privacy-list li>svg{margin-top:2px}.privacy-list strong{display:block;font-size:15px;font-weight:600;line-height:1.45}.privacy-list p{margin:4px 0 0;color:var(--ty-muted-foreground);font-size:13px;line-height:1.6;overflow-wrap:anywhere}.sheet-actions{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:18px}.sheet-actions .primary-button,.sheet-actions .secondary-button{width:100%}.sheet-status{min-height:20px;margin:10px 0 0;color:var(--ty-muted-foreground);font-size:12px;line-height:1.55;text-align:center}
  .app-footer{width:100%;max-width:960px;margin:32px auto 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ty-hairline);color:var(--ty-muted-foreground);font-size:13px}.footer-inner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px}.app-footer p{margin:0}.app-footer a{display:inline-flex;align-items:center;min-height:44px;color:var(--ty-foreground);text-decoration:none}
  @media(hover:hover){.icon-button:hover,.text-button:hover,.secondary-button:hover{background:var(--ty-muted)}.setting-row:hover{opacity:.68}.primary-button:hover{opacity:.84}}
  @media(min-width:800px){.board{padding:48px 32px 0}.screen-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.phone-screen{max-width:none}.app-footer{padding-right:32px;padding-left:32px}}
  @media(max-width:359px){.board{padding-right:12px;padding-left:12px}.screen-content{padding:16px}.setting-row{gap:8px;font-size:15px}.setting-value{max-width:118px}.bottom-sheet{padding-right:16px;padding-left:16px}.sheet-layer{padding-right:6px;padding-left:6px}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>

<script>
  (() => {
    const update = document.getElementById('check-update');
    update.addEventListener('click', () => {
      update.disabled = true;
      document.getElementById('update-subtitle').textContent = '正在检查…';
      document.getElementById('update-status').textContent = '正在连接 App Store，当前版本仍可正常使用。';
      window.setTimeout(() => {
        update.disabled = false;
        document.getElementById('update-subtitle').textContent = '已是最新版本';
        document.getElementById('update-status').textContent = '刚刚检查 · 2.8.0（28014）已是最新版本';
      }, 700);
    });
    const layer = document.getElementById('privacy-layer');
    function closePrivacy() {
      layer.hidden = true;
      document.getElementById('privacy-status').textContent = '已关闭摘要，关于页与原有设置保持不变。';
    }
    document.getElementById('close-privacy').addEventListener('click', closePrivacy);
    document.getElementById('done-privacy').addEventListener('click', closePrivacy);
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !layer.hidden) closePrivacy();
    });
  })();
</script>
