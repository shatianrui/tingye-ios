<main class="board">
  <header class="board-heading"><h1>导入书籍</h1><p>从文件、局域网或远程书库添加内容；每一本书都有独立、可追踪的导入结果。</p></header>
  <div class="screen-grid">
    <figure class="screen-wrap">
      <figcaption class="screen-label">添加书籍</figcaption>
      <section class="phone-screen" aria-label="添加书籍画板">
        <div class="screen-content">
          <header class="app-header"><a class="icon-button" href="shelf.html" data-dom-id="import-back-shelf" aria-label="返回书库"><i data-lucide="chevron-left" aria-hidden="true"></i></a><h2>添加书籍</h2><span class="header-note">3 种方式</span></header>
          <p class="section-intro">选择书籍所在的位置。导入后仍会保留原文件，听页只复制你确认的内容。</p>
          <ul class="method-list">
            <li><button class="method-row" id="choose-files" type="button"><i data-lucide="folder-open" aria-hidden="true"></i><span class="method-copy"><strong>从文件选取</strong><span>浏览本机与“文件”App，可一次选择多本</span></span><i class="method-arrow" data-lucide="chevron-right" aria-hidden="true"></i></button></li>
            <li><a class="method-row" href="#wifi-import"><i data-lucide="wifi" aria-hidden="true"></i><span class="method-copy"><strong>Wi-Fi 传书</strong><span>用同一网络下的电脑浏览器发送书籍</span></span><i class="method-arrow" data-lucide="chevron-right" aria-hidden="true"></i></a></li>
            <li><a class="method-row" href="remote-sources.html" data-dom-id="open-remote-sources"><i data-lucide="cloud" aria-hidden="true"></i><span class="method-copy"><strong>远程书库</strong><span>从 WebDAV、SMB 或 OPDS 来源选择书籍</span></span><i class="method-arrow" data-lucide="chevron-right" aria-hidden="true"></i></a></li>
          </ul>
          <input class="visually-hidden" id="epub-files" type="file" multiple accept=".epub,.pdf,.txt,.mobi,.azw3">
          <p class="format-note"><strong>支持格式</strong><br>EPUB、PDF、TXT、MOBI 与 AZW3。受数字版权保护的文件可能无法读取，失败时不会覆盖书库中的同名书籍。</p>
          <p class="action-status" id="file-status" role="status" aria-live="polite"></p>
        </div>
      </section>
    </figure>
    <figure class="screen-wrap" id="wifi-import">
      <figcaption class="screen-label">Wi-Fi 传书 · 服务已开启</figcaption>
      <section class="phone-screen" aria-label="Wi-Fi 传书画板">
        <div class="screen-content">
          <header class="app-header"><a class="icon-button" href="shelf.html" aria-label="返回书库"><i data-lucide="chevron-left" aria-hidden="true"></i></a><h2>Wi-Fi 传书</h2><span></span></header>
          <div class="wifi-state"><i data-lucide="circle-check" aria-hidden="true"></i><div><strong id="wifi-state-title">传书服务已开启</strong><p id="wifi-state-detail">仅限当前局域网访问，关闭后地址立即失效。</p></div></div>
          <label class="address-label" for="wifi-address">在电脑浏览器中打开</label>
          <div class="address-row"><input class="address-input" id="wifi-address" type="text" value="http://192.168.1.8:8080" readonly><button class="icon-button secondary-button" id="copy-address" type="button" aria-label="复制传书地址"><i data-lucide="copy" aria-hidden="true"></i></button></div>
          <ol class="steps">
            <li><strong>连接同一 Wi-Fi</strong><p>确认电脑与这台 iPhone 使用同一个局域网，不要开启访客隔离。</p></li>
            <li><strong>选择电脑中的书籍</strong><p>将文件拖入网页，或点击“选择文件”。单次最多发送 20 本。</p></li>
            <li><strong>返回听页确认导入</strong><p>传输完成后会逐本校验格式与完整性，再写入书库。</p></li>
          </ol>
          <p class="wifi-warning">传书期间请保持听页在前台。地址不包含账户信息，也不要转发到公共网络。</p>
          <button class="secondary-button full-button" id="toggle-wifi" type="button" aria-pressed="true"><i data-lucide="square" aria-hidden="true"></i><span>停止传书</span></button>
          <p class="action-status" id="copy-status" role="status" aria-live="polite"></p>
        </div>
      </section>
    </figure>
    <figure class="screen-wrap">
      <figcaption class="screen-label">逐项导入结果 · 失败可重试</figcaption>
      <section class="phone-screen" aria-label="书籍导入结果画板">
        <div class="screen-content">
          <header class="app-header"><a class="icon-button" href="shelf.html" aria-label="返回书库"><i data-lucide="chevron-left" aria-hidden="true"></i></a><h2>导入结果</h2><span class="header-note">3 项</span></header>
          <p class="result-summary"><strong id="result-count">2 本已导入，1 本失败</strong><span>成功书籍已加入“稍后阅读”，原文件未被移动。</span></p>
          <ul class="result-list">
            <li class="result-item"><div class="result-heading success"><i data-lucide="circle-check" aria-hidden="true"></i><div class="result-name"><strong>故乡.epub</strong><span>4.6 MB · 已导入</span></div></div><p class="result-detail">已识别书名、作者与封面，阅读进度从第一章开始。</p></li>
            <li class="result-item"><div class="result-heading success"><i data-lucide="circle-check" aria-hidden="true"></i><div class="result-name"><strong>春.epub</strong><span>2.8 MB · 已导入</span></div></div><p class="result-detail">文件校验完成，已保存到本机书库。</p></li>
            <li class="result-item" id="failed-item"><div class="result-heading failed" id="failed-heading"><i data-lucide="circle-x" aria-hidden="true"></i><div class="result-name"><strong>飞鸟集.epub</strong><span id="failed-meta">12.4 MB · 导入失败</span></div></div><p class="result-detail" id="failure-reason">文件在传输中断，校验未通过。请保持当前网络后重试，已成功的两本书无需重新导入。</p><button class="secondary-button" id="retry-import" data-dom-id="retry-import" type="button"><i data-lucide="rotate-cw" aria-hidden="true"></i><span>重试此项</span></button><p class="action-status error" id="retry-status" role="status" aria-live="polite"></p></li>
          </ul>
          <div class="result-footer"><a class="primary-button" href="shelf.html">完成并返回书库</a><a class="secondary-button" href="#wifi-import">继续传书</a></div>

    </figure>
  </div>
</main>
<footer class="app-footer"><div class="footer-inner"><p>听页 · 导入逐项校验，失败不会影响已完成内容。</p><nav class="footer-links" aria-label="页脚导航"><a href="shelf.html">书库</a><a href="remote-sources.html">远程书库</a><a href="profile.html">存储管理</a></nav><p>v28 · 中文界面</p></div></footer>
<script>
  (() => {
    const fileInput = document.getElementById('epub-files');
    document.getElementById('choose-files').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
      const count = fileInput.files.length;
      document.getElementById('file-status').textContent = count ? `已选择 ${count} 个文件，将在确认格式后开始导入。` : '未选择文件，书库没有变化。';
    });
    const address = document.getElementById('wifi-address');
    document.getElementById('copy-address').addEventListener('click', async () => {
      const status = document.getElementById('copy-status');
      try { await navigator.clipboard.writeText(address.value); status.textContent = '传书地址已复制，可粘贴到电脑浏览器。'; }
      catch { address.focus(); address.select(); status.textContent = '已选中传书地址，请使用系统复制命令。'; }
    });
    const wifiButton = document.getElementById('toggle-wifi');
    wifiButton.addEventListener('click', () => {
      const running = wifiButton.getAttribute('aria-pressed') === 'true';
      wifiButton.setAttribute('aria-pressed', String(!running));wifiButton.querySelector('span').textContent = running ? '重新开启' : '停止传书';
      document.getElementById('wifi-state-title').textContent = running ? '传书服务已停止' : '传书服务已开启';
      document.getElementById('wifi-state-detail').textContent = running ? '电脑已无法访问此地址，重新开启后可继续传书。' : '仅限当前局域网访问，关闭后地址立即失效。';
      address.disabled = running;document.getElementById('copy-address').disabled = running;
    });
    const retry = document.getElementById('retry-import');
    retry.addEventListener('click', () => {
      const status = document.getElementById('retry-status');
      retry.disabled = true;status.className = 'action-status';status.textContent = '正在重新校验《飞鸟集.epub》…';
      document.getElementById('failed-meta').textContent = '12.4 MB · 正在重试';
      window.setTimeout(() => {
        document.getElementById('failed-meta').textContent = '12.4 MB · 已导入';
        document.getElementById('failure-reason').textContent = '文件校验完成，已加入“稍后阅读”。阅读进度从第一章开始。';
        document.getElementById('result-count').textContent = '3 本已全部导入';
        status.className = 'action-status success';status.textContent = '重试成功，无需再次导入。';retry.hidden = true;
      }, 900);
    });
  })();
</script>
<script>lucide.createIcons();</script>
</body>
