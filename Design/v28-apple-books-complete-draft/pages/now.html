<body class="min-h-screen antialiased">
  <div class="desktop-stage">
    <aside class="context-panel" aria-label="今日阅读背景">
      <h2>阅读节奏</h2>
      <p>今天读了一会儿，也听了一会儿。两种进度各自保留，回来时不必寻找位置。</p>
      <dl class="context-list">
        <div><dt>当前书</dt><dd>故乡</dd></div>
        <div><dt>本周阅读</dt><dd>3小时42分</dd></div>
        <div><dt>连续阅读</dt><dd>4天</dd></div>
      </dl>
      <p class="context-note">阅读与听书记录仅用于个人统计与同步。</p>
    </aside>

    <main class="app-shell" id="main-content">
      <div class="app-content">
        <header class="page-header">
          <h1 class="ty-display">此刻</h1>
          <p class="page-date ty-numeric">10月30日 星期五</p>
        </header>

        <section class="current-section" aria-labelledby="current-title">
          <div class="section-heading">
            <h2 id="current-title" class="ty-h2">当前书</h2>
            <span class="section-meta ty-numeric">42%</span>
          </div>
          <div class="current-layout">
            <img class="book-cover current-cover" src="../assets/cover-hometown.png" width="104" height="156" alt="《故乡》封面" fetchpriority="high" decoding="async">
            <div class="current-copy">
              <h3 class="ty-h3">故乡</h3>
              <p class="author">鲁迅</p>
              <ul class="position-list" aria-label="当前阅读与听书位置">
                <li><i data-lucide="book-open" aria-hidden="true"></i><span>阅读 · 第四章 · 42%</span></li>
                <li><i data-lucide="headphones" aria-hidden="true"></i><span>听书 · 第三章 · 18:24</span></li>
              </ul>
            </div>
          </div>
          <a href="reader.html" class="primary-button" data-dom-id="cta-reader">
            <span>继续阅读</span><i data-lucide="arrow-right" aria-hidden="true"></i>
          </a>
        </section>

        <section class="content-section" aria-labelledby="recent-title">
          <h2 id="recent-title" class="ty-h2">最近阅读</h2>
          <ul class="recent-list">
            <li>
              <a class="recent-row" href="book-detail.html" aria-label="查看《春》详情">
                <img class="book-cover recent-cover" src="../assets/cover-spring.png" width="48" height="72" alt="《春》封面" loading="lazy" decoding="async">
                <span class="recent-copy"><strong>春</strong><span>朱自清 · 已读完</span></span>
                <i data-lucide="chevron-right" class="row-chevron" aria-hidden="true"></i>
              </a>
            </li>
            <li>
              <a class="recent-row" href="book-detail.html" aria-label="查看《飞鸟集》详情">
                <img class="book-cover recent-cover" src="../assets/cover-birds.png" width="48" height="72" alt="《飞鸟集》封面" loading="lazy" decoding="async">
                <span class="recent-copy"><strong>飞鸟集</strong><span>泰戈尔 · 阅读至18%</span></span>
                <i data-lucide="chevron-right" class="row-chevron" aria-hidden="true"></i>
              </a>
            </li>
          </ul>
        </section>

        <section class="content-section today-section" aria-labelledby="today-title">
          <h2 id="today-title" class="ty-h2">今日摘要</h2>
          <dl class="today-stats">
            <div><dt>阅读</dt><dd class="ty-numeric">32分钟</dd></div>
            <div><dt>听书</dt><dd class="ty-numeric">14分钟</dd></div>
            <div><dt>页数</dt><dd class="ty-numeric">24页</dd></div>
          </dl>
          <p class="weekly-note ty-numeric">本周阅读3小时42分 · 连续4天</p>
        </section>

        <footer class="business-footer">
          <p>阅读与听书进度独立保存</p>
          <p class="ty-numeric">最近同步 10月30日 09:42</p>
        </footer>
      </div>

      <nav data-mobile-nav="global" class="global-tab w-full h-[64px] shrink-0 border-t border-border bg-background"><div class="global-tab-inner w-full max-w-md mx-auto grid grid-cols-3 h-full"><a href="#" data-nav-key="now" data-active="true" class="tab-item min-w-0 min-h-[44px] flex flex-col items-center justify-center gap-1 px-1 h-full text-primary"><i data-lucide="book-open" class="tab-icon w-5 h-5 shrink-0"></i><span class="tab-label text-[11px] leading-none whitespace-nowrap max-w-full truncate font-semibold">此刻</span></a><a href="#" data-nav-key="shelf" data-dom-id="nav-shelf" class="tab-item min-w-0 min-h-[44px] flex flex-col items-center justify-center gap-1 px-1 h-full text-muted-foreground"><i data-lucide="library" class="tab-icon w-5 h-5 shrink-0"></i><span class="tab-label text-[11px] leading-none whitespace-nowrap max-w-full truncate">书库</span></a><a href="#" data-nav-key="profile" data-dom-id="nav-profile" class="tab-item min-w-0 min-h-[44px] flex flex-col items-center justify-center gap-1 px-1 h-full text-muted-foreground"><i data-lucide="user-round" class="tab-icon w-5 h-5 shrink-0"></i><span class="tab-label text-[11px] leading-none whitespace-nowrap max-w-full truncate">我的</span></a></div></nav>
    </main>
  </div>

  <style id="critical-layout">
    *, *::before, *::after { box-sizing: border-box; }
    html { background: var(--ty-surface-sunken); }
    body { margin: 0; min-height: 100vh; background: var(--ty-surface-sunken); color: var(--ty-foreground); font-family: var(--ty-font-sans); -webkit-font-smoothing: antialiased; }
    button, input { font: inherit; }
    a, button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--ty-ring); outline-offset: 3px; }
    .desktop-stage { width: 100%; max-width: 430px; margin: 0 auto; }
    .context-panel { display: none; }
    .app-shell { display: flex; flex-direction: column; width: 100%; min-height: 100vh; background: var(--ty-background); }
    .app-content { flex: 1; padding: max(28px, env(safe-area-inset-top)) 20px 0; }
    .app-shell svg, .context-panel svg { width: 20px; height: 20px; flex: none; stroke-width: 1.5; }
    .page-header { margin-bottom: 32px; }
    .page-header h1 { margin: 0; font-size: 30px; line-height: 1.22; letter-spacing: -0.02em; }
    .page-date { margin: 8px 0 0; color: var(--ty-muted-foreground); font-size: 13px; line-height: 1.5; }
    .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
    .section-heading h2, .content-section > h2 { margin: 0; font-size: 20px; line-height: 1.3; }
    .section-meta { color: var(--ty-muted-foreground); font-size: 13px; line-height: 1.5; }
    .current-layout { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 20px; align-items: center; margin-top: 16px; }
    .book-cover { display: block; width: 100%; height: auto; aspect-ratio: 2 / 3; object-fit: cover; border: 1px solid var(--ty-hairline); border-radius: var(--ty-radius-sm); background: var(--ty-surface-sunken); }
    .current-copy { min-width: 0; }
    .current-copy h3 { margin: 0; font-size: 20px; line-height: 1.35; }
    .author { margin: 6px 0 0; color: var(--ty-muted-foreground); font-size: 14px; line-height: 1.5; }
    .position-list { display: grid; gap: 10px; margin: 20px 0 0; padding: 0; list-style: none; }
    .position-list li { display: flex; align-items: flex-start; gap: 8px; color: var(--ty-muted-foreground); font-size: 13px; line-height: 1.5; font-variant-numeric: tabular-nums; }
    .position-list svg, .position-list i { width: 16px; height: 16px; margin-top: 2px; }
    .primary-button { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; margin-top: 20px; padding: 12px 16px; border: 0; border-radius: var(--ty-radius-md); background: var(--ty-primary); color: var(--ty-primary-foreground); font-size: 16px; font-weight: 600; line-height: 1.5; text-align: center; text-decoration: none; white-space: nowrap; cursor: pointer; transition: opacity 140ms cubic-bezier(.2,.8,.2,1), transform 140ms cubic-bezier(.2,.8,.2,1); }
    .primary-button:active { opacity: .72; transform: translateY(1px); }
    .content-section { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--ty-hairline); }
    .recent-list { margin: 12px 0 0; padding: 0; list-style: none; }
    .recent-row { display: grid; grid-template-columns: 48px minmax(0, 1fr) 20px; gap: 16px; align-items: center; min-height: 96px; padding: 12px 0; color: var(--ty-foreground); text-decoration: none; transition: opacity 140ms cubic-bezier(.2,.8,.2,1); }
    .recent-list li + li { border-top: 1px solid var(--ty-hairline); }
    .recent-copy { display: grid; min-width: 0; gap: 4px; }
    .recent-copy strong { font-size: 16px; font-weight: 600; line-height: 1.5; overflow-wrap: anywhere; }
    .recent-copy > span { color: var(--ty-muted-foreground); font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
    .row-chevron { color: var(--ty-muted-foreground); transition: transform 140ms cubic-bezier(.2,.8,.2,1); }
    .recent-row:active { opacity: .72; }
    .today-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 16px 0 0; padding: 16px 0; border-top: 1px solid var(--ty-hairline); border-bottom: 1px solid var(--ty-hairline); }
    .today-stats > div { min-width: 0; padding: 0 12px; }
    .today-stats > div:first-child { padding-left: 0; }
    .today-stats > div:last-child { padding-right: 0; }
    .today-stats > div + div { border-left: 1px solid var(--ty-hairline); }
    .today-stats dt { color: var(--ty-muted-foreground); font-size: 13px; line-height: 1.5; }
    .today-stats dd { margin: 4px 0 0; font-size: 20px; font-weight: 600; line-height: 1.3; white-space: nowrap; }
    .weekly-note { margin: 12px 0 0; color: var(--ty-muted-foreground); font-size: 13px; line-height: 1.5; }
    .business-footer { display: grid; gap: 4px; margin-top: 32px; padding: 20px 0 24px; border-top: 1px solid var(--ty-hairline); color: var(--ty-muted-foreground); font-size: 13px; line-height: 1.5; }
    .business-footer p { margin: 0; }
    .global-tab { width: 100%; height: 64px; flex: none; border-top: 1px solid var(--ty-hairline); background: var(--ty-background); }
    .global-tab-inner { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; height: 100%; }
    .tab-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 0; min-height: 44px; height: 100%; padding: 0 4px; color: var(--ty-muted-foreground); text-decoration: none; transition: color 140ms cubic-bezier(.2,.8,.2,1), opacity 140ms cubic-bezier(.2,.8,.2,1); }
    .tab-item[data-active="true"] { color: var(--ty-primary); }
    .tab-item:active { opacity: .72; }
    .tab-item:focus-visible { outline-offset: -4px; }
    .tab-icon { display: block; width: 20px; height: 20px; flex: none; stroke-width: 1.5; }
    .tab-label { max-width: 100%; font-size: 11px; font-weight: 400; line-height: 1; white-space: nowrap; }
    .context-panel h2 { margin: 0; font-size: 20px; line-height: 1.3; }
    .context-panel > p { margin: 16px 0 0; color: var(--ty-muted-foreground); font-size: 14px; line-height: 1.8; }
    .context-list { margin: 24px 0 0; border-top: 1px solid var(--ty-hairline); }
    .context-list > div { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--ty-hairline); font-size: 13px; line-height: 1.5; }
    .context-list dt { color: var(--ty-muted-foreground); }
    .context-list dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
    .context-panel .context-note { font-size: 13px; }
    @media (hover: hover) {
      .primary-button:hover { opacity: .86; transform: translateY(-1px); }
      .recent-row:hover .row-chevron { transform: translateX(2px); }
      .tab-item:hover { color: var(--ty-primary); }
    }
    @media (max-width: 350px) {
      .app-content { padding-right: 16px; padding-left: 16px; }
      .current-layout { grid-template-columns: 88px minmax(0, 1fr); gap: 16px; }
      .today-stats > div { padding-right: 8px; padding-left: 8px; }
      .today-stats dd { font-size: 18px; }
    }
    @media (min-width: 900px) {
