          <form id="default-form" novalidate>
            <label class="field"><span>显示名称</span><input type="text" value="家庭 NAS" autocomplete="off"></label>
            <label class="field"><span>服务器地址</span><input id="default-url" type="url" value="https://nas.home.lan:5006/Books" inputmode="url" autocomplete="url"><small class="field-hint">包含协议、端口与书籍目录，不在地址中填写密码。</small></label>
            <label class="field"><span>用户名</span><input type="text" value="reader" autocomplete="username"></label>
            <label class="field"><span>密码</span><input type="password" placeholder="已保存，留空则沿用" autocomplete="current-password"><small class="field-hint">已通过本机钥匙串安全保存。</small></label>
            <div class="switch-row"><label for="default-https">仅允许加密连接</label><input id="default-https" type="checkbox" checked></div>
            <div class="form-actions"><button class="primary-button" id="test-connection" type="submit"><i data-lucide="plug-zap" aria-hidden="true"></i>测试连接</button><a class="secondary-button" href="remote-sources.html">完成</a></div>
            <p class="form-status" id="default-status" role="status" aria-live="polite"></p>
          </form>
        </div>
      </section>
    </figure>
    <figure class="screen-wrap">
      <figcaption class="screen-label">编辑 WebDAV · 错误与恢复</figcaption>
      <section class="phone-screen" aria-label="WebDAV 校验错误画板">
        <div class="screen-content">
          <header class="app-header"><a class="icon-button" href="remote-sources.html" aria-label="返回远程书库"><i data-lucide="chevron-left" aria-hidden="true"></i></a><h2>编辑来源</h2><span class="header-note">未保存</span></header>
          <div class="validation-summary" id="validation-summary" role="alert"><i data-lucide="circle-alert" aria-hidden="true"></i><div><strong>有 1 项需要修正</strong><p>其余输入已保留，无需重新填写。</p></div></div>
          <form id="error-form" novalidate>
            <label class="field"><span>显示名称</span><input type="text" value="家庭 NAS" autocomplete="off"></label>
            <label class="field"><span>服务器地址</span><input id="error-url" type="text" value="nas.home.lan:5006/Books" inputmode="url" aria-invalid="true" aria-describedby="url-error"><small class="field-error" id="url-error"><i data-lucide="circle-alert" aria-hidden="true"></i><span>地址需以 https:// 开头，并保留完整目录路径。</span></small></label>
            <label class="field"><span>用户名</span><input type="text" value="reader" autocomplete="username"></label>
            <label class="field"><span>密码</span><input type="password" placeholder="已保存，留空则沿用" autocomplete="current-password"></label>
            <div class="switch-row"><label for="error-https">仅允许加密连接</label><input id="error-https" type="checkbox" checked></div>
            <div class="form-actions"><button class="primary-button" id="restore-config" type="button"><i data-lucide="history" aria-hidden="true"></i>恢复可用配置</button><button class="secondary-button" id="save-config" type="submit" disabled>保存更改</button></div>
            <p class="form-status error" id="error-status" role="status" aria-live="polite">尚未测试此地址，原连接仍可正常使用。</p>
          </form>
          <p class="recovery-note">恢复会回填今天 09:42 的可用地址，不会删除当前用户名或修改已保存密码。</p>
        </div>
      </section>
    </figure>
    <figure class="screen-wrap" id="browse-remote">
      <figcaption class="screen-label">目录浏览 · 连接失败重试</figcaption>
      <section class="phone-screen" aria-label="远程目录失败画板">
        <div class="screen-content">
          <header class="app-header"><a class="icon-button" href="remote-sources.html" aria-label="返回远程书库"><i data-lucide="chevron-left" aria-hidden="true"></i></a><h2>浏览书库</h2><span class="header-note">WebDAV</span></header>
          <nav class="breadcrumb" aria-label="当前目录"><span>家庭 NAS</span><i data-lucide="chevron-right" aria-hidden="true"></i><span>Books</span><i data-lucide="chevron-right" aria-hidden="true"></i><strong>文学</strong></nav>
          <section class="browse-error" id="browse-error"><i data-lucide="cloud-off" aria-hidden="true"></i><h3 id="browse-title">无法读取此目录</h3><p id="browse-description">与“家庭 NAS”的连接已超时。当前目录和来源配置已保留，请检查同一局域网后重试。</p><button class="primary-button" id="retry-remote" data-dom-id="retry-remote" type="button"><i data-lucide="rotate-cw" aria-hidden="true"></i><span>重新连接</span></button><span class="error-code">WebDAV · 请求超时 · 15 秒</span></section>
          <p class="browse-tip">远程目录不可用时，已导入到本机的书籍不受影响。</p>
          <section class="remote-results" id="remote-results" aria-live="polite" hidden><h3>文学 · 3 本书</h3><ul><li><i data-lucide="book" aria-hidden="true"></i><div><strong>故乡.epub</strong><span>4.6 MB · EPUB</span></div></li><li><i data-lucide="book" aria-hidden="true"></i><div><strong>春.epub</strong><span>2.8 MB · EPUB</span></div></li><li><i data-lucide="book" aria-hidden="true"></i><div><strong>飞鸟集.epub</strong><span>12.4 MB · EPUB</span></div></li></ul></section>
        </div>
      </section>
    </figure>
  </div>
</main>
<footer class="app-footer"><div class="footer-inner"><p>听页 · 远程来源由你掌控，连接错误不会清除配置。</p><nav class="footer-links" aria-label="页脚导航"><a href="import.html">导入书籍</a><a href="shelf.html">本机书库</a><a href="profile.html">隐私设置</a></nav><p>v28 · 中文界面</p></div></footer>
<script>
  (() => {
    document.getElementById('default-form').addEventListener('submit', event => {
      event.preventDefault();const status = document.getElementById('default-status');const button = document.getElementById('test-connection');
      button.disabled = true;status.className = 'form-status';status.textContent = '正在验证加密连接与书籍目录…';
      window.setTimeout(() => { status.className = 'form-status success';status.textContent = '连接成功，已找到 128 本书。配置尚未修改。';button.disabled = false; }, 800);
    });
    const restoredUrl = 'https://nas.home.lan:5006/Books';
    document.getElementById('restore-config').addEventListener('click', () => {
      const input = document.getElementById('error-url');input.value = restoredUrl;input.setAttribute('aria-invalid','false');input.removeAttribute('aria-describedby');
      document.getElementById('url-error').hidden = true;document.getElementById('validation-summary').hidden = true;
      document.getElementById('save-config').disabled = false;const status = document.getElementById('error-status');status.className = 'form-status success';status.textContent = '已恢复可用地址，其他输入保持不变。现在可以保存。';input.focus();
    });
    document.getElementById('error-form').addEventListener('submit', event => {
      event.preventDefault();const status = document.getElementById('error-status');status.className = 'form-status success';status.textContent = '设置已保存，下次浏览目录时将使用此配置。';
    });
    const retry = document.getElementById('retry-remote');
    retry.addEventListener('click', () => {
      retry.disabled = true;retry.querySelector('span').textContent = '正在连接';
      document.getElementById('browse-description').textContent = '正在重新连接“家庭 NAS”，并读取“文学”目录…';
      window.setTimeout(() => {
        document.getElementById('browse-title').textContent = '目录已恢复';document.getElementById('browse-description').textContent = '连接成功，已读取 3 本书。可继续浏览或选择导入。';
        retry.hidden = true;document.getElementById('remote-results').hidden = false;
      }, 900);
    });
  })();
</script>
<script>lucide.createIcons();</script>
