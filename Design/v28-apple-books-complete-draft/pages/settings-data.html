<style id="critical-layout">
  *,*::before,*::after{box-sizing:border-box}
  html{background:var(--ty-surface-sunken)}
  body{margin:0;min-width:0;min-height:100vh;background:var(--ty-surface-sunken);color:var(--ty-foreground);font-family:var(--ty-font-sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  button,a,input{font:inherit}button,a,input{-webkit-tap-highlight-color:transparent}button{cursor:pointer}a{color:inherit}
  button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--ty-ring);outline-offset:3px}
  button:disabled{cursor:not-allowed;opacity:.45}svg{width:20px;height:20px;flex:0 0 auto;stroke-width:1.5}
  .board{width:100%;max-width:1100px;min-height:100vh;margin:0 auto;padding:32px 20px 0}
  .board-heading{max-width:740px;margin:0 0 28px}.board-heading h1{margin:0;font-size:30px;font-weight:700;line-height:1.22;letter-spacing:-.02em}.board-heading p{margin:8px 0 0;color:var(--ty-muted-foreground);font-size:15px;line-height:1.65}
  .screen-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:start}.screen-wrap{min-width:0;margin:0}.screen-label{margin:0 0 10px;color:var(--ty-muted-foreground);font-size:13px;font-weight:500;line-height:1.5}
  .phone-screen{width:100%;max-width:430px;margin:0 auto;border:1px solid var(--ty-hairline);border-radius:var(--ty-radius-lg);background:var(--ty-background)}.screen-content{padding:20px}.screen-stage{display:grid;grid-template-columns:minmax(0,1fr)}.screen-stage>.screen-content,.screen-stage>.dialog-layer{grid-area:1/1;min-width:0}
  .app-header{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px;min-height:44px;margin-bottom:20px}.app-header h2{margin:0;text-align:center;font-size:17px;font-weight:600;line-height:1.35}.header-note{justify-self:end;color:var(--ty-muted-foreground);font-size:12px;line-height:1.4;text-align:right}
  .icon-button,.primary-button,.secondary-button,.text-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:44px;min-height:44px;border-radius:var(--ty-radius-md);text-decoration:none;line-height:1.45;transition:background-color 140ms ease,opacity 140ms ease,transform 140ms ease}
  .icon-button{padding:0;border:1px solid transparent;background:transparent;color:var(--ty-foreground)}.text-button{padding:0 8px;border:0;background:transparent;color:var(--ty-foreground)}
  .primary-button{padding:10px 16px;border:1px solid var(--ty-primary);background:var(--ty-primary);color:var(--ty-primary-foreground)}.secondary-button{padding:10px 16px;border:1px solid var(--ty-border);background:var(--ty-background);color:var(--ty-foreground)}
  .settings-section+.settings-section{margin-top:26px}.settings-section>h3{margin:0 0 8px;color:var(--ty-muted-foreground);font-size:13px;font-weight:400;line-height:1.5}.settings-group{border-top:1px solid var(--ty-hairline);border-bottom:1px solid var(--ty-hairline)}
  .setting-row{display:grid;grid-template-columns:minmax(0,1fr) auto 16px;align-items:center;gap:12px;width:100%;min-height:54px;padding:10px 0;border:0;background:transparent;color:var(--ty-foreground);font-size:16px;line-height:1.45;text-align:left;text-decoration:none;cursor:pointer;transition:opacity 140ms ease}.setting-row+.setting-row,.setting-row+.switch-row,.switch-row+.setting-row{border-top:1px solid var(--ty-hairline)}
  .setting-copy{min-width:0}.setting-label{display:block;overflow-wrap:anywhere}.setting-subtitle{display:block;margin-top:3px;color:var(--ty-muted-foreground);font-size:12px;line-height:1.5;overflow-wrap:anywhere}.setting-value{color:var(--ty-muted-foreground);font-size:13px;line-height:1.45;text-align:right;overflow-wrap:anywhere}.chevron{width:16px;height:16px;color:var(--ty-muted-foreground)}
  .switch-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:16px;min-height:54px;padding:5px 0;font-size:16px;line-height:1.45;cursor:pointer}.switch-copy{min-width:0}.switch-hit{display:flex;align-items:center;justify-content:flex-end;min-width:52px;min-height:44px}
  .switch{position:relative;width:48px;height:30px;flex:none;margin:0;border:1px solid var(--ty-border);border-radius:var(--ty-radius-lg);background:var(--ty-muted);appearance:none;cursor:pointer;transition:background-color 160ms ease,border-color 160ms ease}.switch::before{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:var(--ty-neutral-0);box-shadow:var(--ty-shadow-hairline);transition:transform 160ms ease}.switch:checked{border-color:var(--ty-primary);background:var(--ty-primary)}.switch:checked::before{transform:translateX(18px)}
  .section-note{margin:8px 0 0;color:var(--ty-muted-foreground);font-size:12px;line-height:1.6;overflow-wrap:anywhere}.success-text{color:var(--state-success)}
  .storage-summary{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:12px 0 10px}.storage-summary strong{font-size:28px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}.storage-summary span{color:var(--ty-muted-foreground);font-size:12px;text-align:right}
  .storage-meter{width:100%;height:8px;border-radius:var(--ty-radius-full);background:var(--ty-muted)}.storage-meter span{display:block;width:64%;height:100%;border-radius:var(--ty-radius-full);background:var(--ty-foreground)}
  .storage-list{margin:12px 0 0;padding:0;list-style:none}.storage-list li{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--ty-hairline);font-size:13px;line-height:1.5}.storage-list li span{color:var(--ty-muted-foreground)}.storage-list li strong{flex:none;font-weight:500;font-variant-numeric:tabular-nums}
  .inline-status{min-height:22px;margin:12px 0 0;color:var(--ty-muted-foreground);font-size:13px;line-height:1.6}.inline-status.success{color:var(--state-success)}
  .dialog-layer{position:relative;inset:auto;z-index:5;display:flex;align-items:center;justify-content:center;padding:24px 16px;border-radius:var(--ty-radius-lg);background:color-mix(in srgb,var(--ty-neutral-950) 42%,transparent)}.dialog-layer[hidden]{display:none}
  .alert-dialog{width:100%;max-width:326px;padding:20px;border:1px solid var(--ty-border);border-radius:var(--ty-radius-lg);background:var(--ty-popover);color:var(--ty-popover-foreground);box-shadow:var(--ty-shadow-float)}.dialog-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.dialog-top h3{margin:0;font-size:20px;font-weight:600;line-height:1.35}.alert-dialog p{margin:12px 0 0;color:var(--ty-muted-foreground);font-size:14px;line-height:1.65}.export-contents{margin:14px 0 0;padding:12px 0;border-top:1px solid var(--ty-hairline);border-bottom:1px solid var(--ty-hairline);list-style:none;font-size:13px;line-height:1.65}.export-contents li{display:flex;gap:8px}.export-contents li+li{margin-top:5px}.export-contents svg{width:16px;height:16px;margin-top:3px;color:var(--state-success)}.dialog-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}
  .export-state{padding:22px 0 8px;text-align:center}.export-state>.state-icon{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;color:var(--state-success)}.state-icon svg{width:30px;height:30px}.export-state h3{margin:14px 0 0;font-size:22px;font-weight:600;line-height:1.35}.export-state>p{margin:8px 0 0;color:var(--ty-muted-foreground);font-size:14px;line-height:1.65}.file-summary{margin:20px 0 0;padding:14px 0;border-top:1px solid var(--ty-hairline);border-bottom:1px solid var(--ty-hairline);text-align:left}.file-summary strong{display:block;font-size:15px;font-weight:600;overflow-wrap:anywhere}.file-summary span{display:block;margin-top:4px;color:var(--ty-muted-foreground);font-size:13px}.export-steps{margin:16px 0 0;padding:0;list-style:none;text-align:left}.export-steps li{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--ty-hairline);font-size:13px}.export-steps svg{width:17px;height:17px;margin-top:2px;color:var(--state-success)}.export-actions{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:20px}.export-actions .primary-button,.export-actions .secondary-button{width:100%}
  .app-footer{width:100%;max-width:1100px;margin:32px auto 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ty-hairline);color:var(--ty-muted-foreground);font-size:13px}.footer-inner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px}.app-footer p{margin:0}.app-footer a{display:inline-flex;align-items:center;min-height:44px;color:var(--ty-foreground);text-decoration:none}
  @media(hover:hover){.icon-button:hover,.text-button:hover{background:var(--ty-muted)}.setting-row:hover{opacity:.68}.secondary-button:hover{background:var(--ty-muted)}.primary-button:hover{opacity:.84}}

          <section class="settings-section"><h3>数据导出</h3><div class="settings-group"><div class="setting-row"><span class="setting-copy"><span class="setting-label">导出我的数据</span><span class="setting-subtitle">阅读进度、标注、收藏与偏好设置</span></span><span class="setting-value">ZIP</span><i class="chevron" data-lucide="chevron-right" aria-hidden="true"></i></div></div><p class="section-note">导出在本机完成。你可以随时取消，取消不会生成压缩包。</p></section>

<script>
  (() => {
    const clearButton = document.getElementById('clear-cache');
    clearButton.addEventListener('click', () => {
      clearButton.disabled = true;
      document.getElementById('cache-value').textContent = '0 MB';
      const status = document.getElementById('cache-status');
      status.className = 'inline-status success';
      status.textContent = '已清理 398 MB 缓存。书籍、音频、标注与阅读进度均已保留。';
    });
    const layer = document.getElementById('export-layer');
    const cancel = document.getElementById('cancel-export');
    function closeExport() {
      layer.hidden = true;
      document.getElementById('export-cancel-status').textContent = '已取消导出，没有生成文件，现有数据保持不变。';
    }
    cancel.addEventListener('click', closeExport);
    document.getElementById('close-export').addEventListener('click', closeExport);
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !layer.hidden) { closeExport(); cancel.focus(); }
    });
    document.getElementById('share-export').addEventListener('click', () => {
      document.getElementById('share-status').textContent = '系统分享面板已准备，可选择“存储到文件”或 AirDrop。';
    });
  })();
</script>
<script>lucide.createIcons();</script>
