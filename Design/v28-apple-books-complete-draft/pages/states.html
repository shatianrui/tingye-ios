  --ty-popover-foreground: #F5F5F5;

.ty-h1,
.ty-h2,
.ty-h3,
.ty-body,

<style id="critical-layout">
  *,*::before,*::after{box-sizing:border-box}html{background:var(--ty-surface-sunken)}body{margin:0;min-width:0;min-height:100vh;background:var(--ty-surface-sunken);color:var(--ty-foreground);font-family:var(--ty-font-sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  button,a,input{-webkit-tap-highlight-color:transparent}button,a{font:inherit}button{cursor:pointer}a{color:inherit}button:focus-visible,a:focus-visible{outline:2px solid var(--ty-ring);outline-offset:3px}button:disabled{cursor:not-allowed;opacity:.45}svg{width:20px;height:20px;flex:0 0 auto;stroke-width:1.5}
  .board{width:100%;max-width:1400px;min-height:100vh;margin:0 auto;padding:32px 20px 0}.board-heading{max-width:720px;margin:0 0 28px}.board-heading h1{margin:0;font-size:30px;font-weight:700;line-height:1.22;letter-spacing:-.02em}.board-heading p{margin:8px 0 0;color:var(--ty-muted-foreground)}
  .screen-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:start}.screen-wrap{min-width:0;margin:0}.screen-label{margin:0 0 10px;color:var(--ty-muted-foreground);font-size:13px;font-weight:500}.phone-screen{width:100%;max-width:430px;margin:0 auto;border:1px solid var(--ty-hairline);border-radius:var(--ty-radius-lg);background:var(--ty-background)}.screen-content{padding:20px}
  .app-header{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px;margin-bottom:20px}.app-header h2{margin:0;text-align:center;font-size:17px;font-weight:600;line-height:1.35}.header-note{justify-self:end;color:var(--ty-muted-foreground);font-size:13px;white-space:nowrap}
  .icon-button,.primary-button,.secondary-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:44px;min-height:44px;border-radius:var(--ty-radius-md);text-decoration:none;white-space:nowrap;transition:background-color 140ms cubic-bezier(.2,.8,.2,1),color 140ms cubic-bezier(.2,.8,.2,1),border-color 140ms cubic-bezier(.2,.8,.2,1),opacity 140ms cubic-bezier(.2,.8,.2,1),transform 140ms cubic-bezier(.2,.8,.2,1)}.icon-button{padding:0;border:1px solid transparent;background:transparent;color:var(--ty-foreground)}.icon-button:hover{background:var(--ty-muted)}.primary-button{padding:0 16px;border:1px solid var(--ty-primary);background:var(--ty-primary);color:var(--ty-primary-foreground)}.primary-button:hover{background:var(--ty-neutral-600);border-color:var(--ty-neutral-600)}.secondary-button{padding:0 16px;border:1px solid var(--ty-border);background:var(--ty-background);color:var(--ty-foreground)}.secondary-button:hover{background:var(--ty-muted)}.icon-button:active,.primary-button:active,.secondary-button:active{transform:translateY(1px)}
  .state-body{padding:24px 0 8px;text-align:center}.state-icon{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;color:var(--ty-foreground)}.state-icon svg{width:30px;height:30px}.state-icon.error{color:var(--state-error)}.state-body h3{margin:16px 0 0;font-size:22px;font-weight:600;line-height:1.3;letter-spacing:-.01em;overflow-wrap:anywhere}.state-body>p{margin:10px auto 0;max-width:330px;color:var(--ty-muted-foreground);font-size:14px;line-height:1.65;overflow-wrap:anywhere}.state-actions{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:24px}.state-actions .primary-button,.state-actions .secondary-button{width:100%}.state-note{margin:20px 0 0;padding-top:16px;border-top:1px solid var(--ty-hairline);color:var(--ty-muted-foreground);font-size:13px;line-height:1.6}.inline-status{min-height:22px;margin:12px 0 0;color:var(--ty-muted-foreground);font-size:13px;line-height:1.6}.inline-status.success{color:var(--state-success)}.inline-status.error{color:var(--state-error)}
  .loading-icon{animation:ty-spin 1.1s linear infinite}@keyframes ty-spin{to{transform:rotate(360deg)}}.loading-steps{margin:24px 0 0;padding:0;list-style:none;text-align:left;border-top:1px solid var(--ty-hairline)}.loading-steps li{display:flex;align-items:flex-start;gap:10px;padding:14px 0;border-bottom:1px solid var(--ty-hairline);color:var(--ty-muted-foreground);font-size:14px}.loading-steps li svg{margin-top:2px}.loading-steps li.done{color:var(--ty-foreground)}.loading-steps li.done svg{color:var(--state-success)}
  .download-summary{display:flex;align-items:baseline;justify-content:center;gap:8px;margin-top:20px}.download-summary strong{font-size:30px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}.download-summary span{color:var(--ty-muted-foreground);font-size:13px}
  .book-list{margin:0;padding:0;list-style:none;border-top:1px solid var(--ty-hairline)}.book-item{display:grid;grid-template-columns:72px minmax(0,1fr);gap:16px;align-items:start;padding:20px 0;border-bottom:1px solid var(--ty-hairline)}.book-cover{display:block;width:72px;height:108px;border:1px solid var(--ty-hairline);border-radius:var(--ty-radius-sm);background:var(--ty-muted);object-fit:cover}.book-copy{min-width:0}.book-copy h3{margin:0;font-size:17px;font-weight:600;line-height:1.55;letter-spacing:0;overflow-wrap:anywhere;word-break:break-word}.book-copy p{margin:8px 0 0;color:var(--ty-muted-foreground);font-size:13px;line-height:1.6;overflow-wrap:anywhere}.book-copy .reading-meta{color:var(--ty-foreground);font-variant-numeric:tabular-nums}.group-line{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.group-line span{display:inline-flex;align-items:center;min-height:32px;padding:2px 8px;border:1px solid var(--ty-border);border-radius:var(--ty-radius-sm);color:var(--ty-muted-foreground);font-size:12px;line-height:1.4}
  .storage-detail{margin:24px 0 0;text-align:left}.storage-meter{width:100%;height:8px;border-radius:var(--ty-radius-full);background:var(--ty-neutral-200)}.storage-meter span{display:block;width:94%;height:100%;border-radius:var(--ty-radius-full);background:var(--state-error)}.storage-legend{display:flex;justify-content:space-between;gap:16px;margin-top:8px;color:var(--ty-muted-foreground);font-size:12px}.storage-legend strong{color:var(--state-error);font-weight:500}.storage-list{margin:20px 0 0;padding:0;list-style:none;border-top:1px solid var(--ty-hairline)}.storage-list li{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--ty-hairline);font-size:13px}.storage-list span{color:var(--ty-muted-foreground)}.storage-list strong{font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
  .app-footer{width:100%;max-width:1400px;margin:32px auto 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ty-hairline);color:var(--ty-muted-foreground);font-size:13px}.footer-inner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px}.app-footer p{margin:0}.footer-links{display:flex;flex-wrap:wrap;gap:8px 16px}.footer-links a{display:inline-flex;align-items:center;min-height:44px;text-decoration:none}.footer-links a:hover{color:var(--ty-foreground)}
  @media (min-width:760px){.board{padding:48px 32px 0}.screen-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.phone-screen{max-width:none}.app-footer{padding-right:32px;padding-left:32px}}@media (min-width:1180px){.screen-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media (max-width:359px){.board{padding-right:12px;padding-left:12px}.screen-content{padding:16px}.book-item{grid-template-columns:56px minmax(0,1fr);gap:12px}.book-cover{width:56px;height:84px}.storage-list li{align-items:flex-start;flex-direction:column;gap:4px}}
  @media (hover:none){.icon-button:hover{background:transparent}.primary-button:hover{background:var(--ty-primary);border-color:var(--ty-primary)}}@media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}.loading-icon{animation:none}}
</style>
<main class="board">
  <header class="board-heading"><h1>全局状态</h1><p>每种状态都说明发生了什么、哪些内容仍可使用，以及下一步能做什么。</p></header>
  <div class="screen-grid">
    <figure class="screen-wrap">
      <figcaption class="screen-label">加载 · 读取本地书库</figcaption>
      <section class="phone-screen" aria-label="书库加载状态画板" aria-busy="true">
        <div class="screen-content"><header class="app-header"><a class="icon-button" href="shelf.html" aria-label="返回书库"><i data-lucide="chevron-left" aria-hidden="true"></i></a><h2>书库</h2><span class="header-note">加载中</span></header>
          <div class="state-body" role="status"><span class="state-icon"><i class="loading-icon" data-lucide="loader-circle" aria-hidden="true"></i></span><h3>正在整理书库</h3><p>正在读取本地书籍与阅读进度。已打开的书籍不会被关闭，请稍候。</p>
            <ul class="loading-steps"><li class="done"><i data-lucide="circle-check" aria-hidden="true"></i><span>已读取本地目录</span></li><li><i class="loading-icon" data-lucide="loader-circle" aria-hidden="true"></i><span>正在同步 12 本书的阅读进度</span></li><li><i data-lucide="circle" aria-hidden="true"></i><span>等待整理“阅读中”分组</span></li></ul>
          </div><p class="state-note">加载时间取决于书籍数量。无需重复进入页面，也不要强制退出听页。</p>
        </div>
      </section>
    </figure>
    <figure class="screen-wrap">
      <figcaption class="screen-label">空状态 · 零书籍</figcaption>
      <section class="phone-screen" aria-label="零书籍状态画板">
        <div class="screen-content"><header class="app-header"><a class="icon-button" href="shelf.html" aria-label="返回书库"><i data-lucide="chevron-left" aria-hidden="true"></i></a><h2>书库</h2><span class="header-note">0 本</span></header>
          <div class="state-body"><span class="state-icon"><i data-lucide="book-open" aria-hidden="true"></i></span><h3>书库还是空的</h3><p>导入第一本书后，封面、阅读进度和分组会显示在这里。支持 EPUB、PDF、TXT、MOBI 与 AZW3。</p><div class="state-actions"><a class="primary-button" href="import.html"><i data-lucide="plus" aria-hidden="true"></i>导入书籍</a><a class="secondary-button" href="remote-sources.html">浏览远程书库</a></div></div>
          <p class="state-note">没有书籍时也可先添加 WebDAV、SMB 或 OPDS 来源；远程文件只在确认导入后占用本机空间。</p>
        </div>
      </section>
    </figure>
    <figure class="screen-wrap">
      <figcaption class="screen-label">错误 · 本地索引读取失败</figcaption>
      <section class="phone-screen" aria-label="书库错误状态画板">
        <div class="screen-content"><header class="app-header"><a class="icon-button" href="shelf.html" aria-label="返回书库"><i data-lucide="chevron-left" aria-hidden="true"></i></a><h2>书库</h2><span class="header-note">读取失败</span></header>
          <div class="state-body"><span class="state-icon error"><i data-lucide="circle-alert" aria-hidden="true"></i></span><h3 id="error-title">书库暂时无法读取</h3><p id="error-description">本地索引在上次更新后未能完成。书籍文件仍保存在原位置，阅读进度不会因此删除。</p><div class="state-actions"><button class="primary-button" id="state-retry" data-dom-id="state-retry" type="button"><i data-lucide="rotate-cw" aria-hidden="true"></i><span>重新读取</span></button><a class="secondary-button" href="import.html">改为导入书籍</a></div><p class="inline-status error" id="state-status" role="status" aria-live="polite">若重试仍失败，可在“我的”中导出诊断信息。</p></div>
          <p class="state-note">错误编号：TY-LIB-INDEX-02。诊断信息不包含书籍正文或远程账户密码。</p>
        </div>
      </section>
    </figure>
    <figure class="screen-wrap">
      <figcaption class="screen-label">离线 · 本机内容可读</figcaption>

<script>
  (() => {
    const retry = document.getElementById('state-retry');
    retry.addEventListener('click', () => {
      const status = document.getElementById('state-status');retry.disabled = true;retry.querySelector('span').textContent = '正在读取';
      status.className = 'inline-status';status.textContent = '正在重新建立本地索引，书籍文件保持原位。';
      document.getElementById('error-description').textContent = '已保留当前页面，正在核对 12 本书的文件与阅读进度。';
      window.setTimeout(() => {
        document.getElementById('error-title').textContent = '书库已恢复';document.getElementById('error-description').textContent = '本地索引已更新，共找到 12 本书。阅读进度与分组均已保留。';
        status.className = 'inline-status success';status.textContent = '重新读取成功，可以返回书库继续阅读。';retry.hidden = true;
      }, 900);
    });
    document.getElementById('offline-check').addEventListener('click', event => {
      const button = event.currentTarget;const status = document.getElementById('offline-status');button.disabled = true;status.textContent = '正在检测网络连接…';
      window.setTimeout(() => { status.className = 'inline-status error';status.textContent = '仍处于离线状态。8 本已下载书籍可继续阅读。';button.disabled = false; }, 700);
    });
    document.getElementById('cancel-storage').addEventListener('click', event => {
      event.currentTarget.disabled = true;const status = document.getElementById('storage-status');status.className = 'inline-status success';status.textContent = '已取消本次导入，未写入不完整文件，书库没有变化。';
    });
  })();
</script>
