<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>听书播放器</title>
    <style id="theme-vars">
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&display=swap');

/* ============================================================
   听页 Tingye · 温暖纸质 / 灯下书斋 (Warm Paper · Lamplight Study)
   Brand prefix: ty
   暖纸色 · 宋体衬线 · 墨棕 + 单一灯琥珀
   ============================================================ */

:root {
  /* ---------- 品牌主色（单一色相：灯琥珀） ---------- */
  --ty-primary-50:  #FBF3E8;
  --ty-primary-100: #F5E4CC;
  --ty-primary-200: #EAC9A0;
  --ty-primary-300: #DCA96F;
  --ty-primary-400: #C98A4B;
  --ty-primary-500: #9C5B24;
  --ty-primary-600: #82491B;
  --ty-primary-700: #683A15;

  /* ---------- 中性阶（暖纸墨棕） ---------- */
  --ty-neutral-0:   #FDFBF5;
  --ty-neutral-50:  #F8F3E9;
  --ty-neutral-100: #F1EADC;
  --ty-neutral-200: #E3D8C3;
  --ty-neutral-300: #CFC0A5;
  --ty-neutral-400: #A6957D;
  --ty-neutral-500: #7A6A55;
  --ty-neutral-700: #4A3D2E;
  --ty-neutral-900: #2E2418;
  --ty-neutral-950: #171310;

  /* ---------- 状态色（仅语义状态，不作身份/分类用色） ---------- */
  --state-success: #4A7C59;
  --state-warning: #B07A2A;
  --state-error:   #B3402E;
  --state-info:    #9C5B24;

  /* ---------- 语义别名 · 浅色（默认） ---------- */
  --ty-background:         var(--ty-neutral-50);
  --ty-foreground:         var(--ty-neutral-900);
  --ty-card:               var(--ty-neutral-0);
  --ty-card-foreground:    var(--ty-neutral-900);
  --ty-popover:            var(--ty-neutral-0);
  --ty-popover-foreground: var(--ty-neutral-900);
  --ty-primary:            var(--ty-primary-500);
  --ty-primary-foreground: #FDFBF5;
  --ty-muted:              var(--ty-neutral-100);
  --ty-muted-foreground:   var(--ty-neutral-500);
  --ty-border:             var(--ty-neutral-200);
  --ty-input:              var(--ty-neutral-200);
  --ty-ring:               var(--ty-primary-500);

  /* 表面分层（浅色） */
  --ty-surface-sunken:     var(--ty-neutral-100);
  --ty-hairline:           var(--ty-neutral-200);

  /* ---------- 半径（温润的纸质尺度） ---------- */
  --ty-radius-sm:    4px;
  --ty-radius-md:    10px;
  --ty-radius-lg:    14px;
  --ty-radius-full:  9999px;
  --ty-radius-small:  var(--ty-radius-sm);
  --ty-radius-medium: var(--ty-radius-md);
  --ty-radius-large:  var(--ty-radius-lg);

  /* ---------- 字体系统 ---------- */
  --ty-font-serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --ty-font-sans: "PingFang SC", -apple-system, "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
  --ty-font-mono: "SF Mono", "JetBrains Mono", "Roboto Mono", ui-monospace, Menlo, monospace;

  /* ---------- 阴影（暖调，静态面阴影 alpha ≤ 0.05） ---------- */
  --ty-shadow-hairline: 0 1px 2px rgba(93, 64, 28, 0.05);
  --ty-shadow-float:   0 8px 24px rgba(93, 64, 28, 0.12), 0 2px 6px rgba(93, 64, 28, 0.06);
}

/* ---------- 语义别名 · 深色（夜读灯下） ---------- */
.dark {
  --ty-background:         var(--ty-neutral-950);
  --ty-foreground:         #E9DFCE;
  --ty-card:               #211B15;
  --ty-card-foreground:    #E9DFCE;
  --ty-popover:            #211B15;
  --ty-popover-foreground: #E9DFCE;
  --ty-primary:            #D9A05B;
  --ty-primary-foreground: #171310;
  --ty-muted:              #2A231B;
  --ty-muted-foreground:   #A6957D;
  --ty-border:             #3A3026;
  --ty-input:              #3A3026;
  --ty-ring:               #D9A05B;

  --ty-surface-sunken:     #120F0C;
  --ty-hairline:           #3A3026;

  --ty-shadow-hairline: 0 1px 2px rgba(0, 0, 0, 0.30);
  --ty-shadow-float:   0 8px 24px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.30);
}

/* ---------- 排版类（温暖纸质字体阶梯：标题用宋体衬线） ---------- */
.ty-display {
  font-family: var(--ty-font-serif);
  font-weight: 900;
  letter-spacing: -0.01em;
  line-height: 1.18;
}

.ty-h1 {
  font-family: var(--ty-font-serif);
  font-weight: 700;
  letter-spacing: 0;
  line-height: 1.22;
}

.ty-h2 {
  font-family: var(--ty-font-serif);
  font-weight: 700;
  letter-spacing: 0;
  line-height: 1.28;
}

.ty-h3 {
  font-family: var(--ty-font-serif);
  font-weight: 600;
  letter-spacing: 0.01em;
  line-height: 1.35;
}

.ty-body {
  font-family: var(--ty-font-serif);
  font-weight: 400;
  letter-spacing: 0.01em;
  line-height: 1.78;
}

.ty-caption {
  font-family: var(--ty-font-sans);
  font-weight: 500;
  font-size: 12px;
  line-height: 1.45;
}

/* 纸质标签：黑体小字、宽字距，用于元数据/栏目眉题 */
.ty-label {
  font-family: var(--ty-font-sans);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  line-height: 1.3;
}

.ty-numeric {
  font-family: var(--ty-font-mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--ty-background);
    --color-foreground: var(--ty-foreground);
    --color-card: var(--ty-card);
    --color-card-foreground: var(--ty-card-foreground);
    --color-popover: var(--ty-popover);
    --color-popover-foreground: var(--ty-popover-foreground);
    --color-primary: var(--ty-primary);
    --color-primary-foreground: var(--ty-primary-foreground);
    --color-muted: var(--ty-muted);
    --color-muted-foreground: var(--ty-muted-foreground);
    --color-border: var(--ty-border);
    --color-input: var(--ty-input);
    --color-ring: var(--ty-ring);
    --radius-sm: var(--ty-radius-sm);
    --radius-md: var(--ty-radius-md);
    --radius-lg: var(--ty-radius-lg);
  }
  @layer base {
    body { background: var(--ty-background); color: var(--ty-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--ty-background); }
      .text-background { color: var(--ty-background); }
      .border-background { border-color: var(--ty-background); }
      .ring-background { --tw-ring-color: var(--ty-background); }
      .bg-foreground { background-color: var(--ty-foreground); }
      .text-foreground { color: var(--ty-foreground); }
      .border-foreground { border-color: var(--ty-foreground); }
      .ring-foreground { --tw-ring-color: var(--ty-foreground); }
      .bg-card { background-color: var(--ty-card); }
      .text-card { color: var(--ty-card); }
      .border-card { border-color: var(--ty-card); }
      .ring-card { --tw-ring-color: var(--ty-card); }
      .bg-card-foreground { background-color: var(--ty-card-foreground); }
      .text-card-foreground { color: var(--ty-card-foreground); }
      .border-card-foreground { border-color: var(--ty-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--ty-card-foreground); }
      .bg-popover { background-color: var(--ty-popover); }
      .text-popover { color: var(--ty-popover); }
      .border-popover { border-color: var(--ty-popover); }
      .ring-popover { --tw-ring-color: var(--ty-popover); }
      .bg-popover-foreground { background-color: var(--ty-popover-foreground); }
      .text-popover-foreground { color: var(--ty-popover-foreground); }
      .border-popover-foreground { border-color: var(--ty-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--ty-popover-foreground); }
      .bg-primary { background-color: var(--ty-primary); }
      .text-primary { color: var(--ty-primary); }
      .border-primary { border-color: var(--ty-primary); }
      .ring-primary { --tw-ring-color: var(--ty-primary); }
      .bg-primary-foreground { background-color: var(--ty-primary-foreground); }
      .text-primary-foreground { color: var(--ty-primary-foreground); }
      .border-primary-foreground { border-color: var(--ty-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--ty-primary-foreground); }
      .bg-muted { background-color: var(--ty-muted); }
      .text-muted { color: var(--ty-muted); }
      .border-muted { border-color: var(--ty-muted); }
      .ring-muted { --tw-ring-color: var(--ty-muted); }
      .bg-muted-foreground { background-color: var(--ty-muted-foreground); }
      .text-muted-foreground { color: var(--ty-muted-foreground); }
      .border-muted-foreground { border-color: var(--ty-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--ty-muted-foreground); }
      .bg-border { background-color: var(--ty-border); }
      .text-border { color: var(--ty-border); }
      .border-border { border-color: var(--ty-border); }
      .ring-border { --tw-ring-color: var(--ty-border); }
      .bg-input { background-color: var(--ty-input); }
      .text-input { color: var(--ty-input); }
      .border-input { border-color: var(--ty-input); }
      .ring-input { --tw-ring-color: var(--ty-input); }
      .bg-ring { background-color: var(--ty-ring); }
      .text-ring { color: var(--ty-ring); }
      .border-ring { border-color: var(--ty-ring); }
      .ring-ring { --tw-ring-color: var(--ty-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="plyr-page">

      <!-- 1. 返回页眉 -->
      <header class="plyr-header">
        <a href="#" data-dom-id="back-book-detail" class="plyr-icon-btn" aria-label="返回书籍详情">
          <i data-lucide="chevron-left" class="w-5 h-5"></i>
        </a>
        <span class="plyr-header-label ty-label text-muted-foreground">NOW PLAYING</span>
        <button type="button" class="plyr-icon-btn plyr-header-end" aria-label="章节列表">
          <i data-lucide="list" class="w-5 h-5"></i>
        </button>
      </header>

      <!-- 2. 封面区（纯 CSS 排版：暖纸卡 + 宋体书名 + 琥珀书脊线） -->
      <section class="pt-7" aria-label="书籍封面">
        <div class="plyr-cover" aria-hidden="true">
          <span class="plyr-cover-spine"></span>
          <span class="plyr-cover-body">
            <span class="ty-label text-muted-foreground">AUDIO</span>
            <span class="plyr-cover-title ty-h2">禅与摩托车<br>维修艺术</span>
            <span class="plyr-cover-foot">
              <span class="plyr-cover-rule"></span>
              <span class="ty-caption text-muted-foreground">罗伯特·M·波西格</span>
            </span>
          </span>
        </div>
      </section>

      <!-- 3. 曲目信息 -->
      <section class="plyr-meta">
        <h1 class="ty-h2 plyr-meta-title">禅与摩托车维修艺术</h1>
        <p class="ty-label text-muted-foreground plyr-meta-sub">CH.12 · 罗伯特·M·波西格</p>
      </section>

      <!-- 4. 进度轴（暖发丝线 + 琥珀已播段 + 圆点） -->
      <section class="pt-7" aria-label="播放进度">
        <div class="plyr-track" role="img" aria-label="已播放 1 小时 2 分 44 秒，剩余 1 小时 24 分 10 秒">
          <span class="plyr-track-done"></span>
          <span class="plyr-track-dot"></span>
          <span class="plyr-track-rest"></span>
        </div>
        <div class="plyr-times">
          <span class="ty-numeric plyr-time">1:02:44</span>
          <span class="ty-numeric plyr-time plyr-time-rest">-1:24:10</span>
        </div>
      </section>

      <!-- 5. 播控行 -->
      <section class="plyr-controls">
        <button type="button" class="plyr-step" aria-label="后退 30 秒">
          <i data-lucide="rewind" class="w-6 h-6"></i>
        </button>
        <button type="button" class="plyr-play" aria-label="播放">
          <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" focusable="false"><path d="M8 5.5v13l11-6.5z" fill="currentColor"></path></svg>
        </button>
        <button type="button" class="plyr-step" aria-label="前进 30 秒">
          <i data-lucide="fast-forward" class="w-6 h-6"></i>
        </button>
      </section>

      <!-- 6. 次级控件（倍速 / 定时 / 目录） -->
      <section class="plyr-tools" aria-label="播放工具">
        <button type="button" class="plyr-tool" aria-label="语速 1.25 倍">
          <i data-lucide="gauge" class="w-4 h-4"></i>
          <span class="ty-numeric text-xs">1.25x</span>
        </button>
        <button type="button" class="plyr-tool" aria-label="定时 30 分钟">
          <i data-lucide="timer" class="w-4 h-4"></i>
          <span class="ty-numeric text-xs">30 MIN</span>
        </button>
        <button type="button" class="plyr-tool" aria-label="章节列表">
          <i data-lucide="list" class="w-4 h-4"></i>
          <span class="ty-numeric text-xs">列表</span>
        </button>
      </section>

    </main>

    <style id="critical-layout">
      .plyr-page { max-width: 26rem; margin: 0 auto; padding: 8px 22px 56px; overflow-x: clip; }

      /* 页眉 */
      .plyr-header { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; height: 56px; }
      .plyr-header-label { text-align: center; }
      .plyr-header-end { justify-self: end; }
      .plyr-icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; color: var(--ty-foreground); border-radius: var(--ty-radius-md); transition: background-color 160ms cubic-bezier(.2,.8,.2,1), color 160ms cubic-bezier(.2,.8,.2,1); }
      .plyr-icon-btn:hover { background: var(--ty-surface-sunken); }
      .plyr-icon-btn:active { background: var(--ty-border); }
      .plyr-icon-btn:focus-visible { outline: 2px solid var(--ty-ring); outline-offset: 2px; }

      /* 封面卡：暖纸卡 + 琥珀书脊线 */
      .plyr-cover { display: flex; max-width: 240px; aspect-ratio: 1 / 1; margin: 0 auto; background: var(--ty-card); border: 1px solid var(--ty-hairline); border-radius: var(--ty-radius-lg); box-shadow: var(--ty-shadow-hairline); overflow: hidden; }
      .plyr-cover-spine { flex: 0 0 5px; background: var(--ty-primary); }
      .plyr-cover-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 18px 20px; }
      .plyr-cover-title { font-size: 21px; line-height: 1.45; word-break: keep-all; color: var(--ty-foreground); }
      .plyr-cover-foot { display: flex; flex-direction: column; gap: 8px; }
      .plyr-cover-rule { width: 28px; height: 1px; background: var(--ty-border); }

      /* 曲目信息 */
      .plyr-meta { padding-top: 28px; text-align: center; }
      .plyr-meta-title { font-size: 22px; text-wrap: balance; word-break: keep-all; }
      .plyr-meta-sub { margin-top: 10px; }

      /* 进度轴 */
      .plyr-track { display: flex; align-items: center; height: 12px; }
      .plyr-track-done { flex: 0 0 44%; height: 2px; margin-right: -6px; background: var(--ty-primary); border-radius: var(--ty-radius-full); }
      .plyr-track-dot { flex: 0 0 auto; width: 12px; height: 12px; border-radius: var(--ty-radius-full); background: var(--ty-primary); border: 2px solid var(--ty-card); box-shadow: var(--ty-shadow-hairline); }
      .plyr-track-rest { flex: 1 1 auto; height: 2px; margin-left: -6px; background: var(--ty-hairline); border-radius: var(--ty-radius-full); }
      .plyr-times { display: flex; align-items: center; justify-content: space-between; padding-top: 10px; }
      .plyr-time { font-size: 12px; color: var(--ty-foreground); }
      .plyr-time-rest { color: var(--ty-muted-foreground); }

      /* 播控行 */
      .plyr-controls { display: flex; align-items: center; justify-content: center; gap: 30px; padding-top: 30px; }
      .plyr-step { display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; color: var(--ty-foreground); border-radius: var(--ty-radius-full); transition: background-color 160ms cubic-bezier(.2,.8,.2,1), transform 120ms cubic-bezier(.2,.8,.2,1); }
      .plyr-step:hover { background: var(--ty-surface-sunken); }
      .plyr-step:active { background: var(--ty-border); transform: scale(.96); }
      .plyr-step:focus-visible { outline: 2px solid var(--ty-ring); outline-offset: 2px; }
      .plyr-play { display: inline-flex; align-items: center; justify-content: center; width: 60px; height: 60px; border-radius: var(--ty-radius-full); background: var(--ty-primary); color: var(--ty-primary-foreground); box-shadow: var(--ty-shadow-hairline); transition: background-color 160ms cubic-bezier(.2,.8,.2,1), transform 120ms cubic-bezier(.2,.8,.2,1); }
      .plyr-play:hover { background: var(--ty-primary-600); }
      .plyr-play:active { transform: scale(.97); }
      .plyr-play:focus-visible { outline: 2px solid var(--ty-ring); outline-offset: 3px; }
      .plyr-play svg { margin-left: 3px; }

      /* 次级控件：墨色图标 + 小字，等距排列 */
      .plyr-tools { display: flex; align-items: center; justify-content: center; gap: 12px; padding-top: 30px; }
      .plyr-tool { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; color: var(--ty-foreground); border-radius: var(--ty-radius-full); transition: background-color 160ms cubic-bezier(.2,.8,.2,1), color 160ms cubic-bezier(.2,.8,.2,1); }
      .plyr-tool:hover { background: var(--ty-surface-sunken); }
      .plyr-tool:active { background: var(--ty-border); }
      .plyr-tool:focus-visible { outline: 2px solid var(--ty-ring); outline-offset: 2px; }

      .lucide { stroke-width: 1.5; }

      @media (prefers-reduced-motion: reduce) {
        .plyr-icon-btn, .plyr-step, .plyr-play, .plyr-tool { transition-duration: 0.01ms; }
        .plyr-step:active, .plyr-play:active { transform: none; }
      }
    </style>
    <script>lucide.createIcons();</script>
</body>
</html>
