@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&display=swap');

/* ============================================================
   听页 Tingye · 温暖纸质 / 灯下书斋 (Warm Paper · Lamplight Study)
   Brand prefix: ty
   暖纸色 · 宋体衬线 · 墨棕 + 单一灯琥珀
   ============================================================ */

:root {
  /* ---------- 品牌主色（单一色相：灯琥珀） ---------- */
  --ty-primary-50:  #FBF3E8;
  --ty-primary-100: #F5E4CC;
  --ty-primary-200: #EAC9A0;
  --ty-primary-300: #DCA96F;
  --ty-primary-400: #C98A4B;
  --ty-primary-500: #9C5B24;
  --ty-primary-600: #82491B;
  --ty-primary-700: #683A15;

  /* ---------- 中性阶（暖纸墨棕） ---------- */
  --ty-neutral-0:   #FDFBF5;
  --ty-neutral-50:  #F8F3E9;
  --ty-neutral-100: #F1EADC;
  --ty-neutral-200: #E3D8C3;
  --ty-neutral-300: #CFC0A5;
  --ty-neutral-400: #A6957D;
  --ty-neutral-500: #7A6A55;
  --ty-neutral-700: #4A3D2E;
  --ty-neutral-900: #2E2418;
  --ty-neutral-950: #171310;

  /* ---------- 状态色（仅语义状态，不作身份/分类用色） ---------- */
  --state-success: #4A7C59;
  --state-warning: #B07A2A;
  --state-error:   #B3402E;
  --state-info:    #9C5B24;

  /* ---------- 语义别名 · 浅色（默认） ---------- */
  --ty-background:         var(--ty-neutral-50);
  --ty-foreground:         var(--ty-neutral-900);
  --ty-card:               var(--ty-neutral-0);
  --ty-card-foreground:    var(--ty-neutral-900);
  --ty-popover:            var(--ty-neutral-0);
  --ty-popover-foreground: var(--ty-neutral-900);
  --ty-primary:            var(--ty-primary-500);
  --ty-primary-foreground: #FDFBF5;
  --ty-muted:              var(--ty-neutral-100);
  --ty-muted-foreground:   var(--ty-neutral-500);
  --ty-border:             var(--ty-neutral-200);
  --ty-input:              var(--ty-neutral-200);
  --ty-ring:               var(--ty-primary-500);

  /* 表面分层（浅色） */
  --ty-surface-sunken:     var(--ty-neutral-100);
  --ty-hairline:           var(--ty-neutral-200);

  /* ---------- 半径（温润的纸质尺度） ---------- */
  --ty-radius-sm:    4px;
  --ty-radius-md:    10px;
  --ty-radius-lg:    14px;
  --ty-radius-full:  9999px;
  --ty-radius-small:  var(--ty-radius-sm);
  --ty-radius-medium: var(--ty-radius-md);
  --ty-radius-large:  var(--ty-radius-lg);

  /* ---------- 字体系统 ---------- */
  --ty-font-serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --ty-font-sans: "PingFang SC", -apple-system, "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
  --ty-font-mono: "SF Mono", "JetBrains Mono", "Roboto Mono", ui-monospace, Menlo, monospace;

  /* ---------- 阴影（暖调，静态面阴影 alpha ≤ 0.05） ---------- */
  --ty-shadow-hairline: 0 1px 2px rgba(93, 64, 28, 0.05);
  --ty-shadow-float:   0 8px 24px rgba(93, 64, 28, 0.12), 0 2px 6px rgba(93, 64, 28, 0.06);
}

/* ---------- 语义别名 · 深色（夜读灯下） ---------- */
.dark {
  --ty-background:         var(--ty-neutral-950);
  --ty-foreground:         #E9DFCE;
  --ty-card:               #211B15;
  --ty-card-foreground:    #E9DFCE;
  --ty-popover:            #211B15;
  --ty-popover-foreground: #E9DFCE;
  --ty-primary:            #D9A05B;
  --ty-primary-foreground: #171310;
  --ty-muted:              #2A231B;
  --ty-muted-foreground:   #A6957D;
  --ty-border:             #3A3026;
  --ty-input:              #3A3026;
  --ty-ring:               #D9A05B;

  --ty-surface-sunken:     #120F0C;
  --ty-hairline:           #3A3026;

  --ty-shadow-hairline: 0 1px 2px rgba(0, 0, 0, 0.30);
  --ty-shadow-float:   0 8px 24px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.30);
}

/* ---------- 排版类（温暖纸质字体阶梯：标题用宋体衬线） ---------- */
.ty-display {
  font-family: var(--ty-font-serif);
  font-weight: 900;
  letter-spacing: -0.01em;
  line-height: 1.18;
}

.ty-h1 {
  font-family: var(--ty-font-serif);
  font-weight: 700;
  letter-spacing: 0;
  line-height: 1.22;
}

.ty-h2 {
  font-family: var(--ty-font-serif);
  font-weight: 700;
  letter-spacing: 0;
  line-height: 1.28;
}

.ty-h3 {
  font-family: var(--ty-font-serif);
  font-weight: 600;
  letter-spacing: 0.01em;
  line-height: 1.35;
}

.ty-body {
  font-family: var(--ty-font-serif);
  font-weight: 400;
  letter-spacing: 0.01em;
  line-height: 1.78;
}

.ty-caption {
  font-family: var(--ty-font-sans);
  font-weight: 500;
  font-size: 12px;
  line-height: 1.45;
}

/* 纸质标签：黑体小字、宽字距，用于元数据/栏目眉题 */
.ty-label {
  font-family: var(--ty-font-sans);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  line-height: 1.3;
}

.ty-numeric {
  font-family: var(--ty-font-mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}

    <style id="critical-layout">
      /* 页面骨架：暖纸底，flex 列布局，底部 tab 自然贴底（无 absolute） */
      body { min-height: 100vh; display: flex; flex-direction: column; background: var(--ty-background); color: var(--ty-foreground); font-family: var(--ty-font-sans); }

      .pg-iconbtn:hover { color: var(--ty-primary); border-color: var(--ty-primary-300); background: var(--ty-primary-50); }
      .pg-iconbtn:active { transform: scale(0.95); }
      .pg-iconbtn:focus-visible { outline: 2px solid var(--ty-ring); outline-offset: 2px; }
      .pg-icon-sm { width: 18px; height: 18px; }

      /* 2. 页眉（眉题 + 宋体大标题） */
      .pg-header { padding-top: 32px; }
      .pg-title { font-size: 42px; margin-top: 10px; text-wrap: balance; word-break: keep-all; }

      /* 3. 今日时长锚点区 */
      .pg-anchor { margin-top: 32px; padding: 22px 20px 20px; background: var(--ty-card); border: 1px solid var(--ty-hairline); border-radius: var(--ty-radius-lg); box-shadow: var(--ty-shadow-hairline); }
      .pg-anchor-head { display: flex; align-items: center; justify-content: space-between; }

      .pg-ruler-ticks { display: flex; justify-content: space-between; margin-top: 6px; }

      .pg-section { margin-top: 32px; }

      /* 4. 正在读书封卡（纯 CSS 排版封面：暖纸底 + 宋体书名 + 琥珀书脊线） */
      .pg-bookcard { display: flex; gap: 16px; padding: 18px; border: 1px solid var(--ty-hairline); border-radius: var(--ty-radius-lg); background: var(--ty-card); box-shadow: var(--ty-shadow-hairline); color: inherit; text-decoration: none; transition: border-color 160ms cubic-bezier(.2,.8,.2,1), transform 160ms cubic-bezier(.2,.8,.2,1); }

      .pg-bookcard:active { transform: translateY(0); }
      .pg-bookcard:focus-visible { outline: 2px solid var(--ty-ring); outline-offset: 2px; }
      .pg-cover { display: flex; width: 72px; aspect-ratio: 3 / 4; flex-shrink: 0; border: 1px solid var(--ty-hairline); border-radius: var(--ty-radius-sm); background: var(--ty-surface-sunken); overflow: hidden; }
      .pg-cover-spine { width: 4px; flex-shrink: 0; background: var(--ty-primary); }
      .pg-cover-body { display: flex; flex-direction: column; gap: 6px; padding: 10px 8px 10px 9px; min-width: 0; }
      .pg-cover-title { font-family: var(--ty-font-serif, "Songti SC", "STSong", "SimSun", serif); font-size: 12px; font-weight: 700; line-height: 1.35; color: var(--ty-foreground); word-break: keep-all; }
      .pg-cover-author { font-size: 8px; line-height: 1.4; color: var(--ty-muted-foreground); }
      .pg-bookmeta { flex: 1; min-width: 0; }
      .pg-booktitle { font-size: 17px; }
      .pg-bookauthor { margin-top: 3px; }
      .pg-bookchapter { margin-top: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .pg-bookprogress { height: 2px; background: var(--ty-surface-sunken); border-radius: var(--ty-radius-sm); margin-top: 12px; overflow: hidden; }
      .pg-bookprogress-fill { height: 100%; background: var(--ty-primary); }
      .pg-bookchevron { width: 16px; height: 16px; align-self: center; flex-shrink: 0; color: var(--ty-muted-foreground); transition: color 160ms cubic-bezier(.2,.8,.2,1), transform 160ms cubic-bezier(.2,.8,.2,1); }
      .pg-bookcard:hover .pg-bookchevron { color: var(--ty-primary); transform: translateX(2px); }

      /* 5. 今日目标（下沉纸面台账，发丝线分格） */
      .pg-goal { margin-top: 32px; }
      .pg-goal-label { margin-bottom: 12px; }
      .pg-goal-card { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--ty-surface-sunken); border: 1px solid var(--ty-hairline); border-radius: var(--ty-radius-md); overflow: hidden; }
      .pg-goal-cell { display: flex; flex-direction: column; gap: 6px; padding: 14px; min-width: 0; }
      .pg-goal-cell + .pg-goal-cell { border-left: 1px solid var(--ty-hairline); }
      .pg-goal-num { font-size: 18px; font-weight: 600; }
      .pg-goal-unit { font-size: 10px; font-weight: 500; letter-spacing: 0.08em; color: var(--ty-muted-foreground); }

      /* 6. 继续听书条 */
      .pg-listen { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 14px 16px; border: 1px solid var(--ty-hairline); border-radius: var(--ty-radius-md); background: var(--ty-card); color: inherit; text-decoration: none; transition: border-color 160ms cubic-bezier(.2,.8,.2,1), background-color 160ms cubic-bezier(.2,.8,.2,1); }
      .pg-listen:hover { border-color: var(--ty-primary-300); }
      .pg-listen:active { background: var(--ty-surface-sunken); }
      .pg-listen:focus-visible { outline: 2px solid var(--ty-ring); outline-offset: 2px; }
      .pg-playbtn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; flex-shrink: 0; border-radius: var(--ty-radius-full); background: var(--ty-primary); color: var(--ty-primary-foreground); transition: background-color 160ms cubic-bezier(.2,.8,.2,1), transform 160ms cubic-bezier(.2,.8,.2,1); }
      .pg-listen:hover .pg-playbtn { background: var(--ty-primary-600); }
      .pg-listen:active .pg-playbtn { transform: scale(0.94); }
      .pg-icon-play { width: 14px; height: 14px; margin-left: 1px; }
      .pg-listen-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
      .pg-listen-title { font-size: 13px; font-weight: 600; color: var(--ty-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .pg-listen-chev { width: 16px; height: 16px; flex-shrink: 0; color: var(--ty-muted-foreground); transition: color 160ms cubic-bezier(.2,.8,.2,1), transform 160ms cubic-bezier(.2,.8,.2,1); }
      .pg-listen:hover .pg-listen-chev { color: var(--ty-primary); transform: translateX(2px); }

      /* 底部 tab（共享 shell 契约，几何与 canonical 一致） */
      nav[data-mobile-nav="global"] { width: 100%; height: 56px; flex-shrink: 0; border-top: 1px solid var(--ty-border); background: var(--ty-background); }
      nav[data-mobile-nav="global"] > div { width: 100%; max-width: 28rem; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); height: 100%; }
      nav[data-mobile-nav="global"] a { min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0 4px; height: 100%; color: var(--ty-muted-foreground); text-decoration: none; }
      nav[data-mobile-nav="global"] a[data-active="true"] { color: var(--ty-primary); }
      nav[data-mobile-nav="global"] a svg { width: 20px; height: 20px; flex-shrink: 0; }
      nav[data-mobile-nav="global"] a span { font-size: 11px; line-height: 1; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
      nav[data-mobile-nav="global"] a[data-active="true"] span { font-weight: 600; }

      @media (prefers-reduced-motion: reduce) {
        .pg-iconbtn, .pg-bookcard, .pg-bookchevron, .pg-listen, .pg-playbtn, .pg-listen-chev { transition-duration: 0.01ms; }
        .pg-bookcard:hover, .pg-bookcard:active, .pg-iconbtn:active, .pg-listen:active .pg-playbtn { transform: none; }
        .pg-bookcard:hover .pg-bookchevron, .pg-listen:hover .pg-listen-chev { transform: none; }
      }
    </style>
    <script>lucide.createIcons();</script>
</body>
</html>
