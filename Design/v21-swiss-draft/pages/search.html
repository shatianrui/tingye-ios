<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索与空态</title>
    <style id="theme-vars">
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&display=swap');

/* ============================================================
   听页 Tingye · 温暖纸质 / 灯下书斋 (Warm Paper · Lamplight Study)
   Brand prefix: ty
   暖纸色 · 宋体衬线 · 墨棕 + 单一灯琥珀
   ============================================================ */

:root {
  /* ---------- 品牌主色（单一色相：灯琥珀） ---------- */
  --ty-primary-50:  #FBF3E8;
  --ty-primary-100: #F5E4CC;
  --ty-primary-200: #EAC9A0;
  --ty-primary-300: #DCA96F;
  --ty-primary-400: #C98A4B;
  --ty-primary-500: #9C5B24;
  --ty-primary-600: #82491B;
  --ty-primary-700: #683A15;

  /* ---------- 中性阶（暖纸墨棕） ---------- */
  --ty-neutral-0:   #FDFBF5;
  --ty-neutral-50:  #F8F3E9;
  --ty-neutral-100: #F1EADC;
  --ty-neutral-200: #E3D8C3;
  --ty-neutral-300: #CFC0A5;
  --ty-neutral-400: #A6957D;
  --ty-neutral-500: #7A6A55;
  --ty-neutral-700: #4A3D2E;
  --ty-neutral-900: #2E2418;
  --ty-neutral-950: #171310;

  /* ---------- 状态色（仅语义状态，不作身份/分类用色） ---------- */
  --state-success: #4A7C59;
  --state-warning: #B07A2A;
  --state-error:   #B3402E;
  --state-info:    #9C5B24;

  /* ---------- 语义别名 · 浅色（默认） ---------- */
  --ty-background:         var(--ty-neutral-50);
  --ty-foreground:         var(--ty-neutral-900);
  --ty-card:               var(--ty-neutral-0);
  --ty-card-foreground:    var(--ty-neutral-900);
  --ty-popover:            var(--ty-neutral-0);
  --ty-popover-foreground: var(--ty-neutral-900);
  --ty-primary:            var(--ty-primary-500);
  --ty-primary-foreground: #FDFBF5;
  --ty-muted:              var(--ty-neutral-100);
  --ty-muted-foreground:   var(--ty-neutral-500);
  --ty-border:             var(--ty-neutral-200);
  --ty-input:              var(--ty-neutral-200);
  --ty-ring:               var(--ty-primary-500);

  /* 表面分层（浅色） */
  --ty-surface-sunken:     var(--ty-neutral-100);
  --ty-hairline:           var(--ty-neutral-200);

  /* ---------- 半径（温润的纸质尺度） ---------- */
  --ty-radius-sm:    4px;
  --ty-radius-md:    10px;
  --ty-radius-lg:    14px;
  --ty-radius-full:  9999px;
  --ty-radius-small:  var(--ty-radius-sm);
  --ty-radius-medium: var(--ty-radius-md);
  --ty-radius-large:  var(--ty-radius-lg);

  /* ---------- 字体系统 ---------- */
  --ty-font-serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --ty-font-sans: "PingFang SC", -apple-system, "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
  --ty-font-mono: "SF Mono", "JetBrains Mono", "Roboto Mono", ui-monospace, Menlo, monospace;

  /* ---------- 阴影（暖调，静态面阴影 alpha ≤ 0.05） ---------- */
  --ty-shadow-hairline: 0 1px 2px rgba(93, 64, 28, 0.05);
  --ty-shadow-float:   0 8px 24px rgba(93, 64, 28, 0.12), 0 2px 6px rgba(93, 64, 28, 0.06);
}

/* ---------- 语义别名 · 深色（夜读灯下） ---------- */
.dark {
  --ty-background:         var(--ty-neutral-950);
  --ty-foreground:         #E9DFCE;
  --ty-card:               #211B15;
  --ty-card-foreground:    #E9DFCE;
  --ty-popover:            #211B15;
  --ty-popover-foreground: #E9DFCE;
  --ty-primary:            #D9A05B;
  --ty-primary-foreground: #171310;
  --ty-muted:              #2A231B;
  --ty-muted-foreground:   #A6957D;
  --ty-border:             #3A3026;
  --ty-input:              #3A3026;
  --ty-ring:               #D9A05B;

  --ty-surface-sunken:     #120F0C;
  --ty-hairline:           #3A3026;

  --ty-shadow-hairline: 0 1px 2px rgba(0, 0, 0, 0.30);
  --ty-shadow-float:   0 8px 24px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.30);
}

/* ---------- 排版类（温暖纸质字体阶梯：标题用宋体衬线） ---------- */
.ty-display {
  font-family: var(--ty-font-serif);
  font-weight: 900;
  letter-spacing: -0.01em;
  line-height: 1.18;
}

.ty-h1 {
  font-family: var(--ty-font-serif);
  font-weight: 700;
  letter-spacing: 0;
  line-height: 1.22;
}

.ty-h2 {
  font-family: var(--ty-font-serif);
  font-weight: 700;
  letter-spacing: 0;
  line-height: 1.28;
}

.ty-h3 {
  font-family: var(--ty-font-serif);
  font-weight: 600;
  letter-spacing: 0.01em;
  line-height: 1.35;
}

.ty-body {
  font-family: var(--ty-font-serif);
  font-weight: 400;
  letter-spacing: 0.01em;
  line-height: 1.78;
}

.ty-caption {
  font-family: var(--ty-font-sans);
  font-weight: 500;
  font-size: 12px;
  line-height: 1.45;
}

/* 纸质标签：黑体小字、宽字距，用于元数据/栏目眉题 */
.ty-label {
  font-family: var(--ty-font-sans);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  line-height: 1.3;
}

.ty-numeric {
  font-family: var(--ty-font-mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--ty-background);
    --color-foreground: var(--ty-foreground);
    --color-card: var(--ty-card);
    --color-card-foreground: var(--ty-card-foreground);
    --color-popover: var(--ty-popover);
    --color-popover-foreground: var(--ty-popover-foreground);
    --color-primary: var(--ty-primary);
    --color-primary-foreground: var(--ty-primary-foreground);
    --color-muted: var(--ty-muted);
    --color-muted-foreground: var(--ty-muted-foreground);
    --color-border: var(--ty-border);
    --color-input: var(--ty-input);
    --color-ring: var(--ty-ring);
    --radius-sm: var(--ty-radius-sm);
    --radius-md: var(--ty-radius-md);
    --radius-lg: var(--ty-radius-lg);
  }
  @layer base {
    body { background: var(--ty-background); color: var(--ty-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

      .bg-card-foreground { background-color: var(--ty-card-foreground); }
      .text-card-foreground { color: var(--ty-card-foreground); }
      .border-card-foreground { border-color: var(--ty-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--ty-card-foreground); }

      .bg-popover-foreground { background-color: var(--ty-popover-foreground); }
      .text-popover-foreground { color: var(--ty-popover-foreground); }
      .border-popover-foreground { border-color: var(--ty-popover-foreground); }

      .bg-primary { background-color: var(--ty-primary); }
      .text-primary { color: var(--ty-primary); }
      .border-primary { border-color: var(--ty-primary); }
      .ring-primary { --tw-ring-color: var(--ty-primary); }
      .bg-primary-foreground { background-color: var(--ty-primary-foreground); }
      .text-primary-foreground { color: var(--ty-primary-foreground); }
      .border-primary-foreground { border-color: var(--ty-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--ty-primary-foreground); }
      .bg-muted { background-color: var(--ty-muted); }
      .text-muted { color: var(--ty-muted); }
      .border-muted { border-color: var(--ty-muted); }

      .bg-muted-foreground { background-color: var(--ty-muted-foreground); }
      .text-muted-foreground { color: var(--ty-muted-foreground); }
      .border-muted-foreground { border-color: var(--ty-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--ty-muted-foreground); }
      .bg-border { background-color: var(--ty-border); }
      .text-border { color: var(--ty-border); }
      .border-border { border-color: var(--ty-border); }

      .bg-input { background-color: var(--ty-input); }

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;

</head>
<body class="min-h-screen font-sans antialiased">
    <main class="pg-page">
      <!-- 页眉：返回 + 下沉暖纸搜索框 -->
      <header class="pg-header">
        <a href="#" data-dom-id="back-library" class="pg-back" aria-label="返回书库">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </a>
        <label class="pg-searchbar" role="search">
          <svg class="pg-search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input class="pg-input" type="search" placeholder="搜索书名 / 作者" aria-label="搜索书名或作者">
          <svg class="pg-clear" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </label>
      </header>

      <!-- 历史搜索 -->
      <section class="pg-section">
        <p class="ty-label pg-eyebrow">历史 HISTORY</p>
        <div class="pg-chips">
          <a href="#" class="pg-chip ty-caption">平面国</a>
          <a href="#" class="pg-chip ty-caption">设计</a>
          <a href="#" class="pg-chip ty-caption">短篇小说</a>
          <a href="#" class="pg-chip ty-caption">波西格</a>
        </div>
      </section>

      <!-- 结果示例 -->
      <section class="pg-section">
        <p class="ty-label pg-eyebrow">结果 RESULT</p>
        <div class="pg-results">
          <a href="#" data-dom-id="link-book-detail" class="pg-result">
            <span class="pg-cover" aria-hidden="true"><span class="pg-cover-char">平</span></span>
            <span class="pg-result-meta">
              <span class="ty-h3 pg-result-name">《平面国》</span>
              <span class="ty-caption pg-result-sub">埃德温·艾勃特</span>
            </span>
            <span class="ty-numeric pg-result-progress">62%</span>
          </a>
        </div>
      </section>

      <!-- 空态：一盏台灯与摊开的书 -->
      <section class="pg-empty">
        <svg class="pg-empty-art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 132" fill="none" aria-hidden="true">
          <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 112h144"/>
            <path d="M30 112a13 9 0 0 1 26 0"/>
            <path d="M43 103V76"/>
            <circle cx="43" cy="76" r="2.5"/>
            <path d="M45 74l22-18"/>
            <path d="M60 42l30 16-9 15-29-16z"/>
            <path d="M124 92c-6-4-15-5-22-2v20c7-3 16-2 22 2z"/>
            <path d="M124 92c6-4 15-5 22-2v20c-7-3-16-2-22 2z"/>
          </g>
          <circle class="pg-lamp-glow" cx="90" cy="72" r="3.5" stroke-width="1.5"/>
        </svg>
        <p class="ty-label pg-empty-label">NO MORE RESULTS</p>
        <p class="ty-body pg-empty-line">换个关键词试试，或导入新书</p>
      </section>
    </main>

    <style id="critical-layout">
      .pg-page { max-width: 28rem; margin: 0 auto; padding: 0 20px 96px; }

      /* 页眉：返回 + 搜索框 */
      .pg-header { display: flex; align-items: center; gap: 12px; padding: 20px 0 8px; }
      .pg-back {
        display: inline-flex; align-items: center; justify-content: center;
        width: 36px; height: 36px; flex-shrink: 0;
        border-radius: var(--ty-radius-md);
        color: var(--ty-foreground);
        transition: background-color 160ms ease, color 160ms ease;
      }
      .pg-back:hover { background-color: var(--ty-muted); }
      .pg-back:active { background-color: var(--ty-border); }

      /* 搜索框：下沉暖纸 + 暖发丝线 */
      .pg-searchbar {
        display: flex; align-items: center; gap: 10px;
        flex: 1; min-width: 0;
        height: 44px; padding: 0 14px;
        background: var(--ty-surface-sunken);
        border: 1px solid var(--ty-hairline);
        border-radius: var(--ty-radius-md);
        cursor: text;
        transition: border-color 160ms ease, background-color 160ms ease, box-shadow 160ms ease;
      }
      .pg-searchbar:focus-within {
        border-color: var(--ty-ring);
        background-color: var(--ty-card);
        box-shadow: var(--ty-shadow-hairline);
      }
      .pg-search-icon { flex-shrink: 0; color: var(--ty-foreground); transition: color 160ms ease; }
      .pg-searchbar:focus-within .pg-search-icon { color: var(--ty-primary); }
      .pg-input {
        flex: 1; min-width: 0;
        border: none; outline: none; background: transparent;
        font-family: var(--ty-font-serif);
        font-size: 14px; line-height: 1.5;
        color: var(--ty-foreground);
      }
      .pg-input::placeholder { color: var(--ty-muted-foreground); }
      .pg-input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
      .pg-clear { flex-shrink: 0; color: var(--ty-muted-foreground); }

      /* 分区 */
      .pg-section { margin-top: 28px; }
      .pg-eyebrow { color: var(--ty-muted-foreground); }

      /* 历史词 */
      .pg-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
      .pg-chip {
        display: inline-flex; align-items: center;
        height: 32px; padding: 0 14px;
        border: 1px solid var(--ty-hairline);
        border-radius: var(--ty-radius-lg);
        color: var(--ty-foreground);
        transition: background-color 160ms ease, border-color 160ms ease;
      }
      .pg-chip:hover { background-color: var(--ty-card); border-color: var(--ty-border); }
      .pg-chip:active { background-color: var(--ty-muted); }

      /* 结果卡 */
      .pg-results {
        margin-top: 12px;
        background: var(--ty-card);
        border: 1px solid var(--ty-hairline);
        border-radius: var(--ty-radius-md);
        box-shadow: var(--ty-shadow-hairline);
        padding: 0 16px;
      }
      .pg-result {
        display: flex; align-items: center; gap: 14px;
        padding: 14px 4px;
        border-radius: var(--ty-radius-sm);
        color: var(--ty-card-foreground);
        transition: background-color 160ms ease;
      }
      .pg-result + .pg-result { border-top: 1px solid var(--ty-hairline); }
      .pg-result:hover { background-color: var(--ty-surface-sunken); }
      .pg-result:active { background-color: var(--ty-muted); }

      /* 纯 CSS 书封缩略：暖纸底 + 宋体书名 */
      .pg-cover {
        width: 48px; height: 64px; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        background: var(--ty-surface-sunken);
        border: 1px solid var(--ty-hairline);
        border-left: 3px solid var(--ty-neutral-300);
        border-radius: var(--ty-radius-sm);
      }
      .pg-cover-char {
        font-family: var(--ty-font-serif);
        font-weight: 700; font-size: 20px; line-height: 1;
        color: var(--ty-foreground);
      }

      .pg-result-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
      .pg-result-name { font-size: 16px; color: var(--ty-foreground); }
      .pg-result-sub { color: var(--ty-muted-foreground); }
      .pg-result-progress { flex-shrink: 0; font-size: 12px; color: var(--ty-primary); }

      /* 空态：台灯与书 */
      .pg-empty {
        margin-top: 64px; padding: 8px 0 24px;
        display: flex; flex-direction: column; align-items: center; text-align: center;
      }
      .pg-empty-art { width: 176px; height: 132px; color: var(--ty-foreground); }
      .pg-lamp-glow { stroke: var(--ty-primary); }
      .pg-empty-label { margin-top: 24px; color: var(--ty-muted-foreground); }
      .pg-empty-line { margin-top: 10px; font-size: 15px; color: var(--ty-foreground); }

      @media (prefers-reduced-motion: reduce) {
        .pg-back, .pg-searchbar, .pg-search-icon, .pg-chip, .pg-result { transition: none; }
      }
    </style>
    <script>lucide.createIcons();</script>
</body>
</html>
