    <style id="theme-vars">
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&display=swap');

/* ============================================================
   听页 Tingye · 温暖纸质 / 灯下书斋 (Warm Paper · Lamplight Study)
   Brand prefix: ty
   暖纸色 · 宋体衬线 · 墨棕 + 单一灯琥珀
   ============================================================ */

:root {
  /* ---------- 品牌主色（单一色相：灯琥珀） ---------- */
  --ty-primary-50:  #FBF3E8;
  --ty-primary-100: #F5E4CC;
  --ty-primary-200: #EAC9A0;
  --ty-primary-300: #DCA96F;
  --ty-primary-400: #C98A4B;
  --ty-primary-500: #9C5B24;
  --ty-primary-600: #82491B;
  --ty-primary-700: #683A15;

  /* ---------- 中性阶（暖纸墨棕） ---------- */
  --ty-neutral-0:   #FDFBF5;
  --ty-neutral-50:  #F8F3E9;
  --ty-neutral-100: #F1EADC;
  --ty-neutral-200: #E3D8C3;
  --ty-neutral-300: #CFC0A5;
  --ty-neutral-400: #A6957D;
  --ty-neutral-500: #7A6A55;
  --ty-neutral-700: #4A3D2E;
  --ty-neutral-900: #2E2418;
  --ty-neutral-950: #171310;

  /* ---------- 状态色（仅语义状态，不作身份/分类用色） ---------- */
  --state-success: #4A7C59;
  --state-warning: #B07A2A;
  --state-error:   #B3402E;
  --state-info:    #9C5B24;

  /* ---------- 语义别名 · 浅色（默认） ---------- */
  --ty-background:         var(--ty-neutral-50);
  --ty-foreground:         var(--ty-neutral-900);
  --ty-card:               var(--ty-neutral-0);
  --ty-card-foreground:    var(--ty-neutral-900);
  --ty-popover:            var(--ty-neutral-0);
  --ty-popover-foreground: var(--ty-neutral-900);
  --ty-primary:            var(--ty-primary-500);
  --ty-primary-foreground: #FDFBF5;
  --ty-muted:              var(--ty-neutral-100);
  --ty-muted-foreground:   var(--ty-neutral-500);
  --ty-border:             var(--ty-neutral-200);
  --ty-input:              var(--ty-neutral-200);
  --ty-ring:               var(--ty-primary-500);

  /* 表面分层（浅色） */
  --ty-surface-sunken:     var(--ty-neutral-100);
  --ty-hairline:           var(--ty-neutral-200);

  /* ---------- 半径（温润的纸质尺度） ---------- */
  --ty-radius-sm:    4px;
  --ty-radius-md:    10px;
  --ty-radius-lg:    14px;
  --ty-radius-full:  9999px;
  --ty-radius-small:  var(--ty-radius-sm);
  --ty-radius-medium: var(--ty-radius-md);
  --ty-radius-large:  var(--ty-radius-lg);

  /* ---------- 字体系统 ---------- */
  --ty-font-serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --ty-font-sans: "PingFang SC", -apple-system, "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
  --ty-font-mono: "SF Mono", "JetBrains Mono", "Roboto Mono", ui-monospace, Menlo, monospace;

  /* ---------- 阴影（暖调，静态面阴影 alpha ≤ 0.05） ---------- */
  --ty-shadow-hairline: 0 1px 2px rgba(93, 64, 28, 0.05);
  --ty-shadow-float:   0 8px 24px rgba(93, 64, 28, 0.12), 0 2px 6px rgba(93, 64, 28, 0.06);
}

/* ---------- 语义别名 · 深色（夜读灯下） ---------- */
.dark {
  --ty-background:         var(--ty-neutral-950);
  --ty-foreground:         #E9DFCE;
  --ty-card:               #211B15;
  --ty-card-foreground:    #E9DFCE;
  --ty-popover:            #211B15;
  --ty-popover-foreground: #E9DFCE;
  --ty-primary:            #D9A05B;
  --ty-primary-foreground: #171310;
  --ty-muted:              #2A231B;
  --ty-muted-foreground:   #A6957D;
  --ty-border:             #3A3026;
  --ty-input:              #3A3026;
  --ty-ring:               #D9A05B;

  --ty-surface-sunken:     #120F0C;
  --ty-hairline:           #3A3026;

  --ty-shadow-hairline: 0 1px 2px rgba(0, 0, 0, 0.30);
  --ty-shadow-float:   0 8px 24px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.30);
}

/* ---------- 排版类（温暖纸质字体阶梯：标题用宋体衬线） ---------- */
.ty-display {
  font-family: var(--ty-font-serif);
  font-weight: 900;
  letter-spacing: -0.01em;
  line-height: 1.18;
}

.ty-h1 {
  font-family: var(--ty-font-serif);
  font-weight: 700;
  letter-spacing: 0;
  line-height: 1.22;
}

.ty-h2 {
  font-family: var(--ty-font-serif);
  font-weight: 700;
  letter-spacing: 0;
  line-height: 1.28;
}

.ty-h3 {
  font-family: var(--ty-font-serif);
  font-weight: 600;
  letter-spacing: 0.01em;
  line-height: 1.35;
}

.ty-body {
  font-family: var(--ty-font-serif);
  font-weight: 400;
  letter-spacing: 0.01em;
  line-height: 1.78;
}

.ty-caption {
  font-family: var(--ty-font-sans);
  font-weight: 500;
  font-size: 12px;
  line-height: 1.45;
}

/* 纸质标签：黑体小字、宽字距，用于元数据/栏目眉题 */
.ty-label {
  font-family: var(--ty-font-sans);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  line-height: 1.3;
}

.ty-numeric {
  font-family: var(--ty-font-mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}

    <style id="critical-layout">
      /* 报头 */
      .pg-header { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; padding-top:28px; padding-bottom:6px; }
      .pg-iconbtn { display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:var(--ty-radius-md); border:1px solid var(--ty-hairline); background-color:var(--ty-card); color:var(--ty-foreground); text-decoration:none; transition:background-color 140ms cubic-bezier(.2,.8,.2,1), border-color 140ms cubic-bezier(.2,.8,.2,1), transform 140ms cubic-bezier(.2,.8,.2,1); -webkit-tap-highlight-color:transparent; }
      .pg-iconbtn:hover { background-color:var(--ty-muted); }
      .pg-iconbtn:active { transform:scale(.96); }
      .pg-iconbtn:focus-visible { outline:2px solid var(--ty-ring); outline-offset:2px; }
      .pg-iconbtn-primary { background-color:var(--ty-primary); border-color:var(--ty-primary); color:var(--ty-primary-foreground); }
      .pg-iconbtn-primary:hover { background-color:var(--ty-primary-600); border-color:var(--ty-primary-600); }

      /* 计数眉题行 */
      .pg-countrow { display:flex; align-items:center; gap:12px; margin-top:20px; }
      .pg-countline { flex:1 1 auto; min-width:24px; height:1px; background:var(--ty-hairline); }

      /* 书封墙：三列等宽，沟槽 15px */
      .book-wall { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:15px; margin-top:16px; }
      .book-cover { display:flex; overflow:hidden; aspect-ratio:3/4; border:1px solid var(--ty-hairline); border-radius:var(--ty-radius-md); box-shadow:var(--ty-shadow-hairline); text-decoration:none; color:inherit; transition:transform 160ms cubic-bezier(.2,.8,.2,1), border-color 160ms cubic-bezier(.2,.8,.2,1); }
      .book-cover:hover { transform:translateY(-2px); border-color:var(--ty-neutral-300); }
      .book-cover:active { transform:translateY(0) scale(.98); }
      a.book-cover:focus-visible { outline:2px solid var(--ty-ring); outline-offset:2px; }
      .paper-a { background-color:var(--ty-card); }
      .paper-b { background-color:var(--ty-neutral-50); }
      .paper-c { background-color:var(--ty-neutral-100); }
      .book-spine { width:4px; flex-shrink:0; background-color:var(--ty-primary); }
      .book-body { flex:1 1 auto; min-width:0; padding:10px 10px 12px; display:flex; flex-direction:column; }
      .book-idx { font-size:10px; line-height:1; letter-spacing:0.08em; color:var(--ty-muted-foreground); }
      .book-rule { height:1px; background:var(--ty-hairline); margin-bottom:8px; }
      .book-title { font-family:var(--ty-font-serif); font-size:13px; font-weight:600; line-height:1.4; color:var(--ty-foreground); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:keep-all; }
      .book-author { font-size:10px; line-height:1.4; color:var(--ty-muted-foreground); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

      /* 页尾收束 */
      .pg-colophon { display:flex; align-items:center; gap:12px; margin-top:32px; }
      .pg-colophon::before, .pg-colophon::after { content:""; flex:1 1 0; min-width:0; height:1px; background:var(--ty-hairline); }
      .pg-colophon-dot { width:5px; height:5px; flex-shrink:0; border-radius:var(--ty-radius-full); background-color:var(--ty-primary); }

      @media (prefers-reduced-motion: reduce) {
        .pg-iconbtn, .book-cover { transition:none; }
        .pg-iconbtn:active, .book-cover:hover, .book-cover:active { transform:none; }
      }
    </style>
