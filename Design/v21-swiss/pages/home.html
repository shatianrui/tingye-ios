<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>读 · 正在阅读</title>
    <style id="theme-vars">
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

/* ============================================================
   听页 Tingye · v21 瑞士网格 / 苏黎世白 (Swiss Grid · Zurich White)
   Brand prefix: ty
   国际主义网格 · 无衬线 · 黑白灰 + 单一信号蓝
   ============================================================ */

:root {
  /* ---------- 品牌主色（单一色相：信号蓝） ---------- */
  --ty-primary-50:  #EEF3FF;
  --ty-primary-100: #DCE7FF;
  --ty-primary-200: #B8CFFF;
  --ty-primary-300: #85AFFF;
  --ty-primary-400: #4D8BFF;
  --ty-primary-500: #0057FF;
  --ty-primary-600: #0048DB;
  --ty-primary-700: #003AB0;

  /* ---------- 中性阶（黑白灰） ---------- */
  --ty-neutral-0:   #FFFFFF;
  --ty-neutral-50:  #FAFAFA;
  --ty-neutral-100: #F4F4F5;
  --ty-neutral-200: #E4E4E7;
  --ty-neutral-300: #D4D4D8;
  --ty-neutral-400: #A1A1AA;
  --ty-neutral-500: #71717A;
  --ty-neutral-700: #3F3F46;
  --ty-neutral-900: #18181B;
  --ty-neutral-950: #0B0B0C;

  /* ---------- 状态色（仅语义状态，不作身份/分类用色） ---------- */
  --state-success: #16A34A;
  --state-warning: #D97706;
  --state-error:   #DC2626;
  --state-info:    #0057FF;

  /* ---------- 语义别名 · 浅色（默认） ---------- */
  --ty-background:         var(--ty-neutral-0);
  --ty-foreground:         #111112;
  --ty-card:               var(--ty-neutral-0);
  --ty-card-foreground:    #111112;
  --ty-popover:            var(--ty-neutral-0);
  --ty-popover-foreground: #111112;
  --ty-primary:            var(--ty-primary-500);
  --ty-primary-foreground: #FFFFFF;
  --ty-muted:              var(--ty-neutral-100);
  --ty-muted-foreground:   #6E6E73;
  --ty-border:             var(--ty-neutral-200);
  --ty-input:              var(--ty-neutral-200);
  --ty-ring:               var(--ty-primary-500);

  /* 表面分层（浅色） */
  --ty-surface-sunken:     var(--ty-neutral-50);
  --ty-hairline:           var(--ty-neutral-200);

  /* ---------- 半径（克制的瑞士尺度） ---------- */
  --ty-radius-sm:    2px;
  --ty-radius-md:    8px;
  --ty-radius-lg:    12px;
  --ty-radius-full:  9999px;
  --ty-radius-small:  var(--ty-radius-sm);
  --ty-radius-medium: var(--ty-radius-md);
  --ty-radius-large:  var(--ty-radius-lg);

  /* ---------- 字体系统 ---------- */
  --ty-font-sans: "Inter", "PingFang SC", "Noto Sans SC", -apple-system, "Helvetica Neue", "Helvetica", Arial, sans-serif;
  --ty-font-mono: "SF Mono", "JetBrains Mono", "Roboto Mono", ui-monospace, Menlo, monospace;

  /* ---------- 阴影（静态面以描边为主，阴影 alpha ≤ 0.05） ---------- */
  --ty-shadow-hairline: 0 1px 2px rgba(17, 17, 18, 0.04);
  --ty-shadow-float:   0 8px 24px rgba(17, 17, 18, 0.10), 0 2px 6px rgba(17, 17, 18, 0.06);
}

/* ---------- 语义别名 · 深色 ---------- */
.dark {
  --ty-background:         var(--ty-neutral-950);
  --ty-foreground:         #F5F5F6;
  --ty-card:               #141416;
  --ty-card-foreground:    #F5F5F6;
  --ty-popover:            #141416;
  --ty-popover-foreground: #F5F5F6;
  --ty-primary:            #4D7CFE;
  --ty-primary-foreground: #FFFFFF;
  --ty-muted:              #1B1B1E;
  --ty-muted-foreground:   #9C9CA3;
  --ty-border:             #26262B;
  --ty-input:              #26262B;
  --ty-ring:               #4D7CFE;

  --ty-surface-sunken:     #0F0F11;
  --ty-hairline:           #26262B;

  --ty-shadow-hairline: 0 1px 2px rgba(0, 0, 0, 0.30);
  --ty-shadow-float:   0 8px 24px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.30);
}

/* ---------- 排版类（瑞士网格字体阶梯） ---------- */
.ty-display {
  font-family: var(--ty-font-sans);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.04;
}

.ty-h1 {
  font-family: var(--ty-font-sans);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.12;
}

.ty-h2 {
  font-family: var(--ty-font-sans);
  font-weight: 700;
  letter-spacing: -0.015em;
  line-height: 1.2;
}

.ty-h3 {
  font-family: var(--ty-font-sans);
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.3;
}

.ty-body {
  font-family: var(--ty-font-sans);
  font-weight: 400;
  letter-spacing: 0;
  line-height: 1.65;
}

.ty-caption {
  font-family: var(--ty-font-sans);
  font-weight: 500;
  font-size: 12px;
  line-height: 1.45;
}

/* 瑞士标签：等宽、大写、宽字距，用于元数据/编号/刻度 */
.ty-label {
  font-family: var(--ty-font-mono);
  font-weight: 500;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  line-height: 1.3;
}

.ty-numeric {
  font-family: var(--ty-font-mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {

    --color-popover: var(--ty-popover);
    --color-popover-foreground: var(--ty-popover-foreground);
    --color-primary: var(--ty-primary);
    --color-primary-foreground: var(--ty-primary-foreground);

    --color-ring: var(--ty-ring);
    --radius-sm: var(--ty-radius-sm);

    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

      .text-primary-foreground { color: var(--ty-primary-foreground); }

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        display: inline-flex;

</head>
<body class="min-h-screen font-sans antialiased">
    <main class="w-full max-w-md mx-auto px-4">
      <!-- 1. 页眉 -->
      <header class="pg-header">
        <div>
          <p class="ty-label text-muted-foreground">TINGYE / READ</p>
          <h1 class="ty-h1 mt-2" style="font-size:40px;text-wrap:balance;word-break:keep-all;">读</h1>
        </div>
        <a href="#" data-dom-id="shortcut-search" aria-label="搜索" class="pg-iconbtn">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </a>
      </header>

      <!-- 2. 今日锚点区 -->
      <section class="pg-anchor" aria-label="今日阅读">
        <p class="ty-label text-muted-foreground">今日阅读</p>
        <div class="pg-anchor-num">
          <span class="ty-numeric" style="font-size:64px;line-height:1;font-weight:600;letter-spacing:-0.03em;">47</span>
          <span class="ty-label text-muted-foreground" style="letter-spacing:0.1em;">MIN</span>
        </div>
        <p class="ty-caption text-muted-foreground mt-1">目标 <span class="ty-numeric">75</span> MIN</p>
        <div class="pg-ruler" role="img" aria-label="今日阅读进度 62%">
          <div class="pg-ruler-track">
            <div class="pg-ruler-fill" style="width:62%;"></div>
          </div>
          <div class="pg-ruler-ticks" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>
      </section>

      <!-- 3. 正在读卡 -->
      <section aria-label="正在读">
        <a href="#" data-dom-id="link-book-detail" class="pg-bookcard group">
          <div class="pg-cover" aria-hidden="true">
            <span class="pg-cover-spine"></span>
            <span class="pg-cover-text">
              <span class="pg-cover-title">平面国</span>
              <span class="pg-cover-author">埃德温·艾勃特</span>
            </span>
          </div>
          <div class="pg-bookmeta">
            <h2 class="ty-h3" style="font-size:16px;">平面国</h2>
            <p class="ty-caption text-muted-foreground mt-0.5">埃德温·艾勃特</p>
            <p class="ty-numeric text-muted-foreground mt-2" style="font-size:12px;">62% · 第 7 章 球体的启示</p>
            <div class="pg-bookprogress" aria-hidden="true">
              <div style="width:62%;height:100%;background:var(--ty-primary);"></div>
            </div>
          </div>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 text-muted-foreground self-center shrink-0"><path d="m9 18 6-6-6-6"/></svg>
        </a>
      </section>

      <!-- 4. 正在听横条 -->
      <a href="#" data-dom-id="shortcut-player" class="pg-listen" aria-label="正在听：禅与摩托车维修艺术">
        <span class="pg-playbtn" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="none" class="w-3 h-3" style="margin-left:1px;"><path d="M6 4.5v15l13-7.5z"/></svg>
        </span>
        <span class="ty-caption truncate">禅与摩托车维修艺术</span>
        <span class="ty-numeric text-muted-foreground ml-auto shrink-0" style="font-size:12px;">剩 1:24:10</span>
      </a>
    </main>
    <nav data-mobile-nav="global" class="w-full h-[56px] shrink-0 border-t border-border bg-background"><div class="w-full max-w-md mx-auto grid grid-cols-3 h-full"><a href="#" data-nav-key="library" data-dom-id="nav-library" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-muted-foreground"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 shrink-0"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">书</span></a><a href="#" data-nav-key="read" data-active="true" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-primary"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 shrink-0"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate font-semibold">读</span></a><a href="#" data-nav-key="profile" data-dom-id="nav-profile" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-muted-foreground"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 shrink-0"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">己</span></a></div></nav>
    <style id="critical-layout">
      main.w-full { max-width: 28rem; margin-left: auto; margin-right: auto; padding-left: 16px; padding-right: 16px; }
      .mt-0\.5 { margin-top: 2px; } .mt-1 { margin-top: 4px; } .mt-2 { margin-top: 8px; }
      .ml-auto { margin-left: auto; } .shrink-0 { flex-shrink: 0; } .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .w-3 { width: 12px; } .h-3 { height: 12px; } .w-4 { width: 16px; } .h-4 { height: 16px; } .w-5 { width: 20px; } .h-5 { height: 20px; }
      .self-center { align-self: center; }
      nav[data-mobile-nav="global"] { width: 100%; height: 56px; flex-shrink: 0; border-top: 1px solid var(--ty-border); background: var(--ty-background); }
      nav[data-mobile-nav="global"] > div { width: 100%; max-width: 28rem; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); height: 100%; }
      nav[data-mobile-nav="global"] a { min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0 4px; height: 100%; color: var(--ty-muted-foreground); text-decoration: none; }
      nav[data-mobile-nav="global"] a[data-active="true"] { color: var(--ty-primary); }
      nav[data-mobile-nav="global"] a svg { width: 20px; height: 20px; flex-shrink: 0; }
      nav[data-mobile-nav="global"] a span { font-size: 11px; line-height: 1; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
      nav[data-mobile-nav="global"] a[data-active="true"] span { font-weight: 600; }

      .pg-header { display: flex; align-items: flex-start; justify-content: space-between; padding-top: 32px; }
      .pg-iconbtn { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border: 1px solid var(--ty-border); border-radius: var(--ty-radius-md); color: var(--ty-foreground); background: var(--ty-card); text-decoration: none; transition: color 140ms cubic-bezier(.2,.8,.2,1), border-color 140ms cubic-bezier(.2,.8,.2,1); }
      .pg-iconbtn:hover { color: var(--ty-primary); border-color: var(--ty-primary); }
      .pg-iconbtn:focus-visible { outline: 2px solid var(--ty-ring); outline-offset: 2px; }

      .pg-anchor { padding: 40px 0 32px; border-bottom: 1px solid var(--ty-border); }
      .pg-anchor-num { display: flex; align-items: baseline; gap: 8px; margin-top: 8px; }
      .pg-ruler { margin-top: 20px; }
      .pg-ruler-track { position: relative; height: 3px; background: var(--ty-muted); border-radius: var(--ty-radius-sm); overflow: hidden; }
      .pg-ruler-fill { height: 100%; background: var(--ty-primary); }
      .pg-ruler-ticks { display: flex; justify-content: space-between; margin-top: 6px; }
      .pg-ruler-ticks span { width: 1px; height: 5px; background: var(--ty-border); }

      .pg-bookcard { display: flex; gap: 16px; padding: 16px; margin-top: 24px; border: 1px solid var(--ty-border); border-radius: var(--ty-radius-md); background: var(--ty-card); color: inherit; text-decoration: none; transition: border-color 140ms cubic-bezier(.2,.8,.2,1), transform 140ms cubic-bezier(.2,.8,.2,1); }
      .pg-bookcard:hover { border-color: var(--ty-neutral-300); transform: translateY(-1px); }
      .pg-bookcard:focus-visible { outline: 2px solid var(--ty-ring); outline-offset: 2px; }
      .pg-cover { position: relative; width: 64px; aspect-ratio: 3 / 4; flex-shrink: 0; border: 1px solid var(--ty-border); border-radius: var(--ty-radius-sm); background: var(--ty-card); overflow: hidden; }
      .pg-cover-spine { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--ty-primary); }
      .pg-cover-text { position: absolute; left: 10px; right: 6px; top: 10px; display: flex; flex-direction: column; gap: 4px; }
      .pg-cover-title { font-size: 11px; font-weight: 700; line-height: 1.3; color: var(--ty-foreground); word-break: keep-all; }
      .pg-cover-author { font-size: 8px; line-height: 1.3; color: var(--ty-muted-foreground); }
      .pg-bookmeta { flex: 1; min-width: 0; }
      .pg-bookprogress { height: 2px; background: var(--ty-muted); border-radius: var(--ty-radius-sm); margin-top: 10px; overflow: hidden; }

      .pg-listen { display: flex; align-items: center; gap: 12px; padding: 12px 0; margin-top: 24px; margin-bottom: 48px; border-top: 1px solid var(--ty-border); border-bottom: 1px solid var(--ty-border); color: inherit; text-decoration: none; transition: color 140ms cubic-bezier(.2,.8,.2,1); }
      .pg-listen:hover { color: var(--ty-primary); }
      .pg-listen:focus-visible { outline: 2px solid var(--ty-ring); outline-offset: 2px; }
      .pg-playbtn { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; flex-shrink: 0; border: 1px solid var(--ty-foreground); border-radius: var(--ty-radius-full); color: var(--ty-foreground); transition: border-color 140ms cubic-bezier(.2,.8,.2,1), color 140ms cubic-bezier(.2,.8,.2,1); }
      .pg-listen:hover .pg-playbtn { border-color: var(--ty-primary); color: var(--ty-primary); }

      @media (prefers-reduced-motion: reduce) {
        .pg-iconbtn, .pg-bookcard, .pg-listen, .pg-playbtn { transition-duration: 0.01ms; }
      }
    </style>
    <script>lucide.createIcons();</script>
</body>
