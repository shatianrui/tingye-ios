<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>应用图标方案</title>
    <style id="theme-vars">
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

/* ============================================================
   听页 Tingye · v21 瑞士网格 / 苏黎世白 (Swiss Grid · Zurich White)
   Brand prefix: ty
   国际主义网格 · 无衬线 · 黑白灰 + 单一信号蓝
   ============================================================ */

:root {
  /* ---------- 品牌主色（单一色相：信号蓝） ---------- */
  --ty-primary-50:  #EEF3FF;
  --ty-primary-100: #DCE7FF;
  --ty-primary-200: #B8CFFF;
  --ty-primary-300: #85AFFF;
  --ty-primary-400: #4D8BFF;
  --ty-primary-500: #0057FF;
  --ty-primary-600: #0048DB;
  --ty-primary-700: #003AB0;

  /* ---------- 中性阶（黑白灰） ---------- */
  --ty-neutral-0:   #FFFFFF;
  --ty-neutral-50:  #FAFAFA;
  --ty-neutral-100: #F4F4F5;
  --ty-neutral-200: #E4E4E7;
  --ty-neutral-300: #D4D4D8;
  --ty-neutral-400: #A1A1AA;
  --ty-neutral-500: #71717A;
  --ty-neutral-700: #3F3F46;
  --ty-neutral-900: #18181B;
  --ty-neutral-950: #0B0B0C;

  /* ---------- 状态色（仅语义状态，不作身份/分类用色） ---------- */
  --state-success: #16A34A;
  --state-warning: #D97706;
  --state-error:   #DC2626;
  --state-info:    #0057FF;

  /* ---------- 语义别名 · 浅色（默认） ---------- */
  --ty-background:         var(--ty-neutral-0);
  --ty-foreground:         #111112;
  --ty-card:               var(--ty-neutral-0);
  --ty-card-foreground:    #111112;
  --ty-popover:            var(--ty-neutral-0);
  --ty-popover-foreground: #111112;
  --ty-primary:            var(--ty-primary-500);
  --ty-primary-foreground: #FFFFFF;
  --ty-muted:              var(--ty-neutral-100);
  --ty-muted-foreground:   #6E6E73;
  --ty-border:             var(--ty-neutral-200);
  --ty-input:              var(--ty-neutral-200);
  --ty-ring:               var(--ty-primary-500);

  /* 表面分层（浅色） */
  --ty-surface-sunken:     var(--ty-neutral-50);
  --ty-hairline:           var(--ty-neutral-200);

  /* ---------- 半径（克制的瑞士尺度） ---------- */
  --ty-radius-sm:    2px;
  --ty-radius-md:    8px;
  --ty-radius-lg:    12px;
  --ty-radius-full:  9999px;
  --ty-radius-small:  var(--ty-radius-sm);
  --ty-radius-medium: var(--ty-radius-md);
  --ty-radius-large:  var(--ty-radius-lg);

  /* ---------- 字体系统 ---------- */
  --ty-font-sans: "Inter", "PingFang SC", "Noto Sans SC", -apple-system, "Helvetica Neue", "Helvetica", Arial, sans-serif;
  --ty-font-mono: "SF Mono", "JetBrains Mono", "Roboto Mono", ui-monospace, Menlo, monospace;

  /* ---------- 阴影（静态面以描边为主，阴影 alpha ≤ 0.05） ---------- */
  --ty-shadow-hairline: 0 1px 2px rgba(17, 17, 18, 0.04);
  --ty-shadow-float:   0 8px 24px rgba(17, 17, 18, 0.10), 0 2px 6px rgba(17, 17, 18, 0.06);
}

/* ---------- 语义别名 · 深色 ---------- */
.dark {
  --ty-background:         var(--ty-neutral-950);
  --ty-foreground:         #F5F5F6;
  --ty-card:               #141416;
  --ty-card-foreground:    #F5F5F6;
  --ty-popover:            #141416;
  --ty-popover-foreground: #F5F5F6;
  --ty-primary:            #4D7CFE;
  --ty-primary-foreground: #FFFFFF;
  --ty-muted:              #1B1B1E;
  --ty-muted-foreground:   #9C9CA3;
  --ty-border:             #26262B;
  --ty-input:              #26262B;
  --ty-ring:               #4D7CFE;

  --ty-surface-sunken:     #0F0F11;
  --ty-hairline:           #26262B;

  --ty-shadow-hairline: 0 1px 2px rgba(0, 0, 0, 0.30);
  --ty-shadow-float:   0 8px 24px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.30);
}

/* ---------- 排版类（瑞士网格字体阶梯） ---------- */
.ty-display {
  font-family: var(--ty-font-sans);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.04;
}

.ty-h1 {
  font-family: var(--ty-font-sans);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.12;
}

.ty-h2 {
  font-family: var(--ty-font-sans);
  font-weight: 700;
  letter-spacing: -0.015em;
  line-height: 1.2;
}

.ty-h3 {
  font-family: var(--ty-font-sans);
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.3;
}

.ty-body {
  font-family: var(--ty-font-sans);
  font-weight: 400;
  letter-spacing: 0;
  line-height: 1.65;
}

.ty-caption {
  font-family: var(--ty-font-sans);
  font-weight: 500;
  font-size: 12px;
  line-height: 1.45;
}

/* 瑞士标签：等宽、大写、宽字距，用于元数据/编号/刻度 */
.ty-label {
  font-family: var(--ty-font-mono);
  font-weight: 500;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  line-height: 1.3;
}

.ty-numeric {
  font-family: var(--ty-font-mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--ty-background);
    --color-foreground: var(--ty-foreground);
    --color-card: var(--ty-card);
    --color-card-foreground: var(--ty-card-foreground);
    --color-popover: var(--ty-popover);
    --color-popover-foreground: var(--ty-popover-foreground);
    --color-primary: var(--ty-primary);
    --color-primary-foreground: var(--ty-primary-foreground);
    --color-muted: var(--ty-muted);
    --color-muted-foreground: var(--ty-muted-foreground);
    --color-border: var(--ty-border);
    --color-input: var(--ty-input);
    --color-ring: var(--ty-ring);
    --radius-sm: var(--ty-radius-sm);
    --radius-md: var(--ty-radius-md);
    --radius-lg: var(--ty-radius-lg);
  }
  @layer base {
    body { background: var(--ty-background); color: var(--ty-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--ty-background); }
      .text-background { color: var(--ty-background); }
      .border-background { border-color: var(--ty-background); }
      .ring-background { --tw-ring-color: var(--ty-background); }
      .bg-foreground { background-color: var(--ty-foreground); }
      .text-foreground { color: var(--ty-foreground); }
      .border-foreground { border-color: var(--ty-foreground); }
      .ring-foreground { --tw-ring-color: var(--ty-foreground); }
      .bg-card { background-color: var(--ty-card); }
      .text-card { color: var(--ty-card); }
      .border-card { border-color: var(--ty-card); }
      .ring-card { --tw-ring-color: var(--ty-card); }
      .bg-card-foreground { background-color: var(--ty-card-foreground); }
      .text-card-foreground { color: var(--ty-card-foreground); }
      .border-card-foreground { border-color: var(--ty-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--ty-card-foreground); }
      .bg-popover { background-color: var(--ty-popover); }
      .text-popover { color: var(--ty-popover); }
      .border-popover { border-color: var(--ty-popover); }
      .ring-popover { --tw-ring-color: var(--ty-popover); }
      .bg-popover-foreground { background-color: var(--ty-popover-foreground); }
      .text-popover-foreground { color: var(--ty-popover-foreground); }
      .border-popover-foreground { border-color: var(--ty-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--ty-popover-foreground); }
      .bg-primary { background-color: var(--ty-primary); }
      .text-primary { color: var(--ty-primary); }
      .border-primary { border-color: var(--ty-primary); }
      .ring-primary { --tw-ring-color: var(--ty-primary); }
      .bg-primary-foreground { background-color: var(--ty-primary-foreground); }
      .text-primary-foreground { color: var(--ty-primary-foreground); }
      .border-primary-foreground { border-color: var(--ty-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--ty-primary-foreground); }
      .bg-muted { background-color: var(--ty-muted); }
      .text-muted { color: var(--ty-muted); }
      .border-muted { border-color: var(--ty-muted); }
      .ring-muted { --tw-ring-color: var(--ty-muted); }
      .bg-muted-foreground { background-color: var(--ty-muted-foreground); }
      .text-muted-foreground { color: var(--ty-muted-foreground); }
      .border-muted-foreground { border-color: var(--ty-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--ty-muted-foreground); }
      .bg-border { background-color: var(--ty-border); }
      .text-border { color: var(--ty-border); }
      .border-border { border-color: var(--ty-border); }
      .ring-border { --tw-ring-color: var(--ty-border); }
      .bg-input { background-color: var(--ty-input); }
      .text-input { color: var(--ty-input); }
      .border-input { border-color: var(--ty-input); }
      .ring-input { --tw-ring-color: var(--ty-input); }
      .bg-ring { background-color: var(--ty-ring); }
      .text-ring { color: var(--ty-ring); }
      .border-ring { border-color: var(--ty-ring); }
      .ring-ring { --tw-ring-color: var(--ty-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>
      <style id="critical-layout">
        .ib-wrap { max-width: 28rem; margin: 0 auto; padding: 48px 16px 64px; }
        .ib-center { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .ib-row { display: flex; justify-content: center; gap: 16px; }
        .ib-iconbox { display: flex; align-items: center; justify-content: center; }
        .ib-stage { background: var(--ty-muted); border-radius: 12px; padding: 48px 32px 40px; }
        .ib-s40 { width: 160px; height: 160px; }
        .ib-s20 { width: 80px; height: 80px; }
        .ib-svg-lg { width: 96px; height: 96px; }
        .ib-svg-sm { width: 48px; height: 48px; }
        .ib-h1 { font-size: 30px; }
        .ib-mono { font-family: var(--ty-font-mono); font-size: 11px; letter-spacing: 0.12em; }
        .ib-mono-xs { font-family: var(--ty-font-mono); font-size: 10px; letter-spacing: 0.12em; }
        .ib-specrow { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 14px 0; border-top: 1px solid var(--ty-border); }
        .ib-gridlines {
          background-image:
            repeating-linear-gradient(to right, var(--ty-border) 0, var(--ty-border) 1px, transparent 1px, transparent 12.5%),
            repeating-linear-gradient(to bottom, var(--ty-border) 0, var(--ty-border) 1px, transparent 1px, transparent 12.5%);
        }
        .ib-safe { position: absolute; top: 10%; right: 10%; bottom: 10%; left: 10%; border: 1px dashed var(--ty-border); border-radius: 14%; }
      </style>

      <div class="ib-wrap">
        <!-- 1. 页眉 -->
        <header class="mb-10">
          <p class="ty-label text-muted-foreground">TINGYE / APP ICON · V21</p>
          <h1 class="ty-h1 ib-h1 text-foreground mt-3" style="text-wrap:balance;word-break:keep-all;">应用图标</h1>
          <p class="ty-body text-muted-foreground mt-4">翻页成声：阅读与听书的交界。</p>
        </header>

        <!-- 2. 主展示 -->
        <section class="ib-stage ib-center mb-12 bg-muted">
          <div class="ib-iconbox ib-s40" style="background:#0057FF;border-radius:22.37%;">
            <svg class="ib-svg-lg" viewBox="0 0 64 64" fill="none" role="img" aria-label="听页应用图标：翻页成声">
              <path d="M9 17.5 L30 23.5 L30 50 L9 43.5 Z" fill="#FFFFFF"/>
              <path d="M32.59 40.34 A10 10 0 0 1 39.66 47.41" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
              <path d="M34.14 34.55 A16 16 0 0 1 45.45 45.86" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
              <path d="M35.69 28.75 A22 22 0 0 1 51.25 44.31" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
            </svg>
          </div>
          <p class="ib-mono text-muted-foreground mt-8">PRIMARY · 1024 × 1024</p>
        </section>

        <!-- 3. 三变体行 -->
        <section class="ib-row mb-12">
          <div class="ib-center">
            <div class="ib-iconbox ib-s20 bg-card border border-border" style="border-radius:22.37%;">
              <svg class="ib-svg-sm" viewBox="0 0 64 64" fill="none" role="img" aria-label="图标变体 A：白底蓝符号">
                <path d="M9 17.5 L30 23.5 L30 50 L9 43.5 Z" fill="#0057FF"/>
                <path d="M32.59 40.34 A10 10 0 0 1 39.66 47.41" stroke="#0057FF" stroke-width="3.5" stroke-linecap="round"/>
                <path d="M34.14 34.55 A16 16 0 0 1 45.45 45.86" stroke="#0057FF" stroke-width="3.5" stroke-linecap="round"/>
                <path d="M35.69 28.75 A22 22 0 0 1 51.25 44.31" stroke="#0057FF" stroke-width="3.5" stroke-linecap="round"/>
              </svg>
            </div>
            <p class="ib-mono-xs text-muted-foreground mt-3">A</p>
          </div>
          <div class="ib-center">
            <div class="ib-iconbox ib-s20" style="background:#0057FF;border-radius:22.37%;">
              <svg class="ib-svg-sm" viewBox="0 0 64 64" fill="none" role="img" aria-label="图标变体 B：蓝底白符号">
                <path d="M9 17.5 L30 23.5 L30 50 L9 43.5 Z" fill="#FFFFFF"/>
                <path d="M32.59 40.34 A10 10 0 0 1 39.66 47.41" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
                <path d="M34.14 34.55 A16 16 0 0 1 45.45 45.86" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
                <path d="M35.69 28.75 A22 22 0 0 1 51.25 44.31" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
              </svg>
            </div>
            <p class="ib-mono-xs text-muted-foreground mt-3">B</p>
          </div>
          <div class="ib-center">
            <div class="ib-iconbox ib-s20" style="background:#0B0B0C;border-radius:22.37%;">
              <svg class="ib-svg-sm" viewBox="0 0 64 64" fill="none" role="img" aria-label="图标变体 C：暗底亮蓝符号">
                <path d="M9 17.5 L30 23.5 L30 50 L9 43.5 Z" fill="#4D7CFE"/>
                <path d="M32.59 40.34 A10 10 0 0 1 39.66 47.41" stroke="#4D7CFE" stroke-width="3.5" stroke-linecap="round"/>
                <path d="M34.14 34.55 A16 16 0 0 1 45.45 45.86" stroke="#4D7CFE" stroke-width="3.5" stroke-linecap="round"/>
                <path d="M35.69 28.75 A22 22 0 0 1 51.25 44.31" stroke="#4D7CFE" stroke-width="3.5" stroke-linecap="round"/>
              </svg>
            </div>
            <p class="ib-mono-xs text-muted-foreground mt-3">C</p>
          </div>
        </section>

        <!-- 4. 构造网格 -->
        <section class="ib-center mb-12">
          <div class="relative ib-s40">
            <div class="ib-iconbox absolute inset-0" style="background:#0057FF;border-radius:22.37%;">
              <svg class="ib-svg-lg" viewBox="0 0 64 64" fill="none" role="img" aria-label="图标构造网格：64 单位网格与 80% 安全区">
                <path d="M9 17.5 L30 23.5 L30 50 L9 43.5 Z" fill="#FFFFFF"/>
                <path d="M32.59 40.34 A10 10 0 0 1 39.66 47.41" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
                <path d="M34.14 34.55 A16 16 0 0 1 45.45 45.86" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
                <path d="M35.69 28.75 A22 22 0 0 1 51.25 44.31" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="ib-gridlines absolute inset-0 pointer-events-none" style="border-radius:22.37%;" aria-hidden="true"></div>
            <div class="ib-safe pointer-events-none" aria-hidden="true"></div>
          </div>
          <p class="ib-mono text-muted-foreground mt-6">GRID 64 · SAFE 80%</p>
        </section>

        <!-- 5. 规格标注表 -->
        <section class="mb-12">
          <div class="ib-specrow">
            <span class="ib-mono text-muted-foreground">CANVAS</span>
            <span class="ib-mono text-foreground ty-numeric">1024 × 1024</span>
          </div>
          <div class="ib-specrow">
            <span class="ib-mono text-muted-foreground">GRID</span>
            <span class="ib-mono text-foreground ty-numeric">64 UNITS</span>
          </div>
          <div class="ib-specrow" style="border-bottom:1px solid var(--ty-border);">
            <span class="ib-mono text-muted-foreground">RADIUS</span>
            <span class="ib-mono text-foreground ty-numeric">22.37% (iOS)</span>
          </div>
        </section>

        <!-- 6. 页脚 -->
        <footer class="ib-center">
          <p class="ib-mono text-muted-foreground">听页 TINGYE · SWISS GRID EDITION</p>
        </footer>
      </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
