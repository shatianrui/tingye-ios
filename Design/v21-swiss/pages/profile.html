<!DOCTYPE html>

    <style id="theme-vars">
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

/* ============================================================
   听页 Tingye · v21 瑞士网格 / 苏黎世白 (Swiss Grid · Zurich White)
   Brand prefix: ty
   国际主义网格 · 无衬线 · 黑白灰 + 单一信号蓝
   ============================================================ */

:root {
  /* ---------- 品牌主色（单一色相：信号蓝） ---------- */
  --ty-primary-50:  #EEF3FF;
  --ty-primary-100: #DCE7FF;
  --ty-primary-200: #B8CFFF;
  --ty-primary-300: #85AFFF;
  --ty-primary-400: #4D8BFF;
  --ty-primary-500: #0057FF;
  --ty-primary-600: #0048DB;
  --ty-primary-700: #003AB0;

  /* ---------- 中性阶（黑白灰） ---------- */
  --ty-neutral-0:   #FFFFFF;
  --ty-neutral-50:  #FAFAFA;
  --ty-neutral-100: #F4F4F5;
  --ty-neutral-200: #E4E4E7;
  --ty-neutral-300: #D4D4D8;
  --ty-neutral-400: #A1A1AA;
  --ty-neutral-500: #71717A;
  --ty-neutral-700: #3F3F46;
  --ty-neutral-900: #18181B;
  --ty-neutral-950: #0B0B0C;

  /* ---------- 状态色（仅语义状态，不作身份/分类用色） ---------- */
  --state-success: #16A34A;
  --state-warning: #D97706;
  --state-error:   #DC2626;
  --state-info:    #0057FF;

  /* ---------- 语义别名 · 浅色（默认） ---------- */
  --ty-background:         var(--ty-neutral-0);
  --ty-foreground:         #111112;
  --ty-card:               var(--ty-neutral-0);
  --ty-card-foreground:    #111112;
  --ty-popover:            var(--ty-neutral-0);
  --ty-popover-foreground: #111112;
  --ty-primary:            var(--ty-primary-500);
  --ty-primary-foreground: #FFFFFF;
  --ty-muted:              var(--ty-neutral-100);
  --ty-muted-foreground:   #6E6E73;
  --ty-border:             var(--ty-neutral-200);
  --ty-input:              var(--ty-neutral-200);
  --ty-ring:               var(--ty-primary-500);

  /* 表面分层（浅色） */
  --ty-surface-sunken:     var(--ty-neutral-50);
  --ty-hairline:           var(--ty-neutral-200);

  /* ---------- 半径（克制的瑞士尺度） ---------- */
  --ty-radius-sm:    2px;
  --ty-radius-md:    8px;
  --ty-radius-lg:    12px;
  --ty-radius-full:  9999px;
  --ty-radius-small:  var(--ty-radius-sm);
  --ty-radius-medium: var(--ty-radius-md);
  --ty-radius-large:  var(--ty-radius-lg);

  /* ---------- 字体系统 ---------- */
  --ty-font-sans: "Inter", "PingFang SC", "Noto Sans SC", -apple-system, "Helvetica Neue", "Helvetica", Arial, sans-serif;
  --ty-font-mono: "SF Mono", "JetBrains Mono", "Roboto Mono", ui-monospace, Menlo, monospace;

  /* ---------- 阴影（静态面以描边为主，阴影 alpha ≤ 0.05） ---------- */
  --ty-shadow-hairline: 0 1px 2px rgba(17, 17, 18, 0.04);
  --ty-shadow-float:   0 8px 24px rgba(17, 17, 18, 0.10), 0 2px 6px rgba(17, 17, 18, 0.06);
}

/* ---------- 语义别名 · 深色 ---------- */
.dark {
  --ty-background:         var(--ty-neutral-950);
  --ty-foreground:         #F5F5F6;
  --ty-card:               #141416;
  --ty-card-foreground:    #F5F5F6;
  --ty-popover:            #141416;
  --ty-popover-foreground: #F5F5F6;
  --ty-primary:            #4D7CFE;
  --ty-primary-foreground: #FFFFFF;
  --ty-muted:              #1B1B1E;
  --ty-muted-foreground:   #9C9CA3;
  --ty-border:             #26262B;
  --ty-input:              #26262B;
  --ty-ring:               #4D7CFE;

  --ty-surface-sunken:     #0F0F11;
  --ty-hairline:           #26262B;

  --ty-shadow-hairline: 0 1px 2px rgba(0, 0, 0, 0.30);
  --ty-shadow-float:   0 8px 24px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.30);
}

/* ---------- 排版类（瑞士网格字体阶梯） ---------- */
.ty-display {
  font-family: var(--ty-font-sans);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.04;
}

.ty-h1 {
  font-family: var(--ty-font-sans);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.12;
}

.ty-h2 {
  font-family: var(--ty-font-sans);
  font-weight: 700;
  letter-spacing: -0.015em;
  line-height: 1.2;
}

.ty-h3 {
  font-family: var(--ty-font-sans);
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.3;
}

.ty-body {
  font-family: var(--ty-font-sans);
  font-weight: 400;
  letter-spacing: 0;
  line-height: 1.65;
}

.ty-caption {
  font-family: var(--ty-font-sans);
  font-weight: 500;
  font-size: 12px;
  line-height: 1.45;
}

/* 瑞士标签：等宽、大写、宽字距，用于元数据/编号/刻度 */
.ty-label {
  font-family: var(--ty-font-mono);
  font-weight: 500;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  line-height: 1.3;
}

.ty-numeric {
  font-family: var(--ty-font-mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}

    </style>

  }

<body class="min-h-screen font-sans antialiased">
    <main class="w-full max-w-md mx-auto px-4 pb-6">
      <style id="critical-layout">
        .pg-header { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; padding-top:24px; padding-bottom:16px; }
        .pg-iconbtn { display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:var(--ty-radius-md); color:var(--ty-foreground); text-decoration:none; transition:background-color 120ms cubic-bezier(.2,.8,.2,1); -webkit-tap-highlight-color:transparent; }
        .pg-iconbtn:hover { background-color:var(--ty-muted); }
        .pg-iconbtn:active { transform:scale(.99); }
        .pg-iconbtn:focus-visible { outline:2px solid var(--ty-ring); outline-offset:2px; }
        .pg-hairline { height:1px; background:var(--ty-border); margin-top:12px; margin-bottom:16px; }
        .stats-grid { display:grid; grid-template-columns:repeat(3,1fr); }
        .stat-cell { border-left:1px solid var(--ty-border); padding-left:12px; min-width:0; }
        .stat-cell:first-child { border-left:none; padding-left:0; }
        .bg-neutral-200 { background-color:var(--ty-neutral-200); }
        .week-bars { display:flex; align-items:flex-end; height:80px; }
        .week-col { flex:1; display:flex; justify-content:center; min-width:0; }
        .week-bar { width:8px; border-radius:var(--ty-radius-sm); }
        .week-labels { display:flex; margin-top:8px; }
        .week-labels span { flex:1; text-align:center; min-width:0; }
        .note-row { display:flex; gap:12px; padding:16px 0; }
        .note-icon { flex-shrink:0; color:var(--ty-muted-foreground); margin-top:2px; }
        .note-quote { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
        @media (prefers-reduced-motion: reduce) {
          .pg-iconbtn { transition-duration:0.01ms; }
        }
      </style>
