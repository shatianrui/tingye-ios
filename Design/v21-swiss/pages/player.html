<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>听书播放器</title>
    <style id="theme-vars">
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

/* ============================================================
   听页 Tingye · v21 瑞士网格 / 苏黎世白 (Swiss Grid · Zurich White)
   Brand prefix: ty
   国际主义网格 · 无衬线 · 黑白灰 + 单一信号蓝
   ============================================================ */

:root {
  /* ---------- 品牌主色（单一色相：信号蓝） ---------- */
  --ty-primary-50:  #EEF3FF;
  --ty-primary-100: #DCE7FF;
  --ty-primary-200: #B8CFFF;
  --ty-primary-300: #85AFFF;
  --ty-primary-400: #4D8BFF;
  --ty-primary-500: #0057FF;
  --ty-primary-600: #0048DB;
  --ty-primary-700: #003AB0;

  /* ---------- 中性阶（黑白灰） ---------- */
  --ty-neutral-0:   #FFFFFF;
  --ty-neutral-50:  #FAFAFA;
  --ty-neutral-100: #F4F4F5;
  --ty-neutral-200: #E4E4E7;
  --ty-neutral-300: #D4D4D8;
  --ty-neutral-400: #A1A1AA;
  --ty-neutral-500: #71717A;
  --ty-neutral-700: #3F3F46;
  --ty-neutral-900: #18181B;
  --ty-neutral-950: #0B0B0C;

  /* ---------- 状态色（仅语义状态，不作身份/分类用色） ---------- */
  --state-success: #16A34A;
  --state-warning: #D97706;
  --state-error:   #DC2626;
  --state-info:    #0057FF;

  /* ---------- 语义别名 · 浅色（默认） ---------- */
  --ty-background:         var(--ty-neutral-0);
  --ty-foreground:         #111112;
  --ty-card:               var(--ty-neutral-0);
  --ty-card-foreground:    #111112;
  --ty-popover:            var(--ty-neutral-0);
  --ty-popover-foreground: #111112;
  --ty-primary:            var(--ty-primary-500);
  --ty-primary-foreground: #FFFFFF;
  --ty-muted:              var(--ty-neutral-100);
  --ty-muted-foreground:   #6E6E73;
  --ty-border:             var(--ty-neutral-200);
  --ty-input:              var(--ty-neutral-200);
  --ty-ring:               var(--ty-primary-500);

  /* 表面分层（浅色） */
  --ty-surface-sunken:     var(--ty-neutral-50);
  --ty-hairline:           var(--ty-neutral-200);

  /* ---------- 半径（克制的瑞士尺度） ---------- */
  --ty-radius-sm:    2px;
  --ty-radius-md:    8px;
  --ty-radius-lg:    12px;
  --ty-radius-full:  9999px;
  --ty-radius-small:  var(--ty-radius-sm);
  --ty-radius-medium: var(--ty-radius-md);
  --ty-radius-large:  var(--ty-radius-lg);

  /* ---------- 字体系统 ---------- */
  --ty-font-sans: "Inter", "PingFang SC", "Noto Sans SC", -apple-system, "Helvetica Neue", "Helvetica", Arial, sans-serif;
  --ty-font-mono: "SF Mono", "JetBrains Mono", "Roboto Mono", ui-monospace, Menlo, monospace;

  /* ---------- 阴影（静态面以描边为主，阴影 alpha ≤ 0.05） ---------- */
  --ty-shadow-hairline: 0 1px 2px rgba(17, 17, 18, 0.04);
  --ty-shadow-float:   0 8px 24px rgba(17, 17, 18, 0.10), 0 2px 6px rgba(17, 17, 18, 0.06);
}

/* ---------- 语义别名 · 深色 ---------- */
.dark {
  --ty-background:         var(--ty-neutral-950);
  --ty-foreground:         #F5F5F6;
  --ty-card:               #141416;
  --ty-card-foreground:    #F5F5F6;
  --ty-popover:            #141416;
  --ty-popover-foreground: #F5F5F6;
  --ty-primary:            #4D7CFE;
  --ty-primary-foreground: #FFFFFF;
  --ty-muted:              #1B1B1E;
  --ty-muted-foreground:   #9C9CA3;
  --ty-border:             #26262B;
  --ty-input:              #26262B;
  --ty-ring:               #4D7CFE;

  --ty-surface-sunken:     #0F0F11;
  --ty-hairline:           #26262B;

  --ty-shadow-hairline: 0 1px 2px rgba(0, 0, 0, 0.30);
  --ty-shadow-float:   0 8px 24px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.30);
}

/* ---------- 排版类（瑞士网格字体阶梯） ---------- */
.ty-display {
  font-family: var(--ty-font-sans);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.04;
}

.ty-h1 {
  font-family: var(--ty-font-sans);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.12;
}

.ty-h2 {
  font-family: var(--ty-font-sans);
  font-weight: 700;
  letter-spacing: -0.015em;
  line-height: 1.2;
}

.ty-h3 {
  font-family: var(--ty-font-sans);
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.3;
}

.ty-body {
  font-family: var(--ty-font-sans);
  font-weight: 400;
  letter-spacing: 0;
  line-height: 1.65;
}

.ty-caption {
  font-family: var(--ty-font-sans);
  font-weight: 500;
  font-size: 12px;
  line-height: 1.45;
}

/* 瑞士标签：等宽、大写、宽字距，用于元数据/编号/刻度 */
.ty-label {
  font-family: var(--ty-font-mono);
  font-weight: 500;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  line-height: 1.3;
}

.ty-numeric {
  font-family: var(--ty-font-mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--ty-background);
    --color-foreground: var(--ty-foreground);
    --color-card: var(--ty-card);
    --color-card-foreground: var(--ty-card-foreground);
    --color-popover: var(--ty-popover);
    --color-popover-foreground: var(--ty-popover-foreground);
    --color-primary: var(--ty-primary);
    --color-primary-foreground: var(--ty-primary-foreground);
    --color-muted: var(--ty-muted);
    --color-muted-foreground: var(--ty-muted-foreground);
    --color-border: var(--ty-border);
    --color-input: var(--ty-input);
    --color-ring: var(--ty-ring);
    --radius-sm: var(--ty-radius-sm);
    --radius-md: var(--ty-radius-md);
    --radius-lg: var(--ty-radius-lg);
  }
  @layer base {
    body { background: var(--ty-background); color: var(--ty-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--ty-background); }
      .text-background { color: var(--ty-background); }
      .border-background { border-color: var(--ty-background); }
      .ring-background { --tw-ring-color: var(--ty-background); }
      .bg-foreground { background-color: var(--ty-foreground); }
      .text-foreground { color: var(--ty-foreground); }
      .border-foreground { border-color: var(--ty-foreground); }
      .ring-foreground { --tw-ring-color: var(--ty-foreground); }
      .bg-card { background-color: var(--ty-card); }
      .text-card { color: var(--ty-card); }
      .border-card { border-color: var(--ty-card); }
      .ring-card { --tw-ring-color: var(--ty-card); }
      .bg-card-foreground { background-color: var(--ty-card-foreground); }
      .text-card-foreground { color: var(--ty-card-foreground); }
      .border-card-foreground { border-color: var(--ty-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--ty-card-foreground); }
      .bg-popover { background-color: var(--ty-popover); }
      .text-popover { color: var(--ty-popover); }
      .border-popover { border-color: var(--ty-popover); }
      .ring-popover { --tw-ring-color: var(--ty-popover); }
      .bg-popover-foreground { background-color: var(--ty-popover-foreground); }
      .text-popover-foreground { color: var(--ty-popover-foreground); }
      .border-popover-foreground { border-color: var(--ty-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--ty-popover-foreground); }
      .bg-primary { background-color: var(--ty-primary); }
      .text-primary { color: var(--ty-primary); }
      .border-primary { border-color: var(--ty-primary); }
      .ring-primary { --tw-ring-color: var(--ty-primary); }
      .bg-primary-foreground { background-color: var(--ty-primary-foreground); }
      .text-primary-foreground { color: var(--ty-primary-foreground); }
      .border-primary-foreground { border-color: var(--ty-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--ty-primary-foreground); }
      .bg-muted { background-color: var(--ty-muted); }
      .text-muted { color: var(--ty-muted); }
      .border-muted { border-color: var(--ty-muted); }
      .ring-muted { --tw-ring-color: var(--ty-muted); }
      .bg-muted-foreground { background-color: var(--ty-muted-foreground); }
      .text-muted-foreground { color: var(--ty-muted-foreground); }
      .border-muted-foreground { border-color: var(--ty-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--ty-muted-foreground); }
      .bg-border { background-color: var(--ty-border); }
      .text-border { color: var(--ty-border); }
      .border-border { border-color: var(--ty-border); }
      .ring-border { --tw-ring-color: var(--ty-border); }
      .bg-input { background-color: var(--ty-input); }
      .text-input { color: var(--ty-input); }
      .border-input { border-color: var(--ty-input); }
      .ring-input { --tw-ring-color: var(--ty-input); }
      .bg-ring { background-color: var(--ty-ring); }
      .text-ring { color: var(--ty-ring); }
      .border-ring { border-color: var(--ty-ring); }
      .ring-ring { --tw-ring-color: var(--ty-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>
      <style id="critical-layout">
        .pl-col { max-width: 28rem; margin-left: auto; margin-right: auto; padding-left: 16px; padding-right: 16px; }
        .pl-header { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; height: 56px; }
        .pl-header-label { text-align: center; }
        .pl-icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; color: var(--ty-foreground); border-radius: var(--ty-radius-md); transition: color 160ms cubic-bezier(.2,.8,.2,1); }
        .pl-icon-btn:hover { color: var(--ty-primary); }
        .pl-icon-btn:focus-visible { outline: 2px solid var(--ty-ring); outline-offset: 2px; }
        .pl-cover { position: relative; max-width: 220px; aspect-ratio: 1/1; margin-left: auto; margin-right: auto; background: var(--ty-card); border: 1px solid var(--ty-border); display: flex; flex-direction: column; justify-content: space-between; padding: 20px 20px 20px 26px; }
        .pl-cover-spine { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--ty-primary); }
        .pl-ticks { position: relative; display: flex; align-items: center; justify-content: space-between; height: 24px; }
        .pl-tick { width: 1px; flex-shrink: 0; }
        .pl-tick-done { height: 20px; background: var(--ty-primary); }
        .pl-tick-rest { height: 8px; background: var(--ty-neutral-200); }
        .pl-thumb { position: absolute; left: 45%; top: 50%; transform: translate(-50%, -50%); width: 10px; height: 10px; border-radius: var(--ty-radius-full); background: var(--ty-primary); }
        .pl-controls { display: flex; align-items: center; justify-content: center; gap: 32px; }
        .pl-play { display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: var(--ty-radius-full); background: var(--ty-primary); color: var(--ty-primary-foreground); transition: background-color 160ms cubic-bezier(.2,.8,.2,1); }
        .pl-play:hover { background: var(--ty-primary-600); }
        .pl-play:active { transform: scale(.98); }
        .pl-play:focus-visible { outline: 2px solid var(--ty-ring); outline-offset: 3px; }
        .pl-play svg { fill: currentColor; margin-left: 3px; }
        .pl-chips { display: flex; align-items: center; justify-content: center; gap: 8px; }
        .pl-chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding-left: 12px; padding-right: 12px; border: 1px solid var(--ty-border); border-radius: var(--ty-radius-full); color: var(--ty-foreground); background: transparent; transition: border-color 160ms cubic-bezier(.2,.8,.2,1); }
        .pl-chip:hover { border-color: var(--ty-neutral-400); }
        .pl-chip:focus-visible { outline: 2px solid var(--ty-ring); outline-offset: 2px; }
        .lucide { stroke-width: 1.5; }
        @media (prefers-reduced-motion: reduce) { .pl-icon-btn, .pl-play, .pl-chip { transition-duration: 0.01ms; } }
      </style>

      <div class="pl-col">

        <!-- 1. 页眉 -->
        <header class="pl-header">
          <a href="#" data-dom-id="back-book-detail" class="pl-icon-btn" aria-label="返回书籍详情">
            <i data-lucide="chevron-down" class="w-5 h-5"></i>
          </a>
          <span class="pl-header-label ty-label text-muted-foreground">NOW PLAYING</span>
          <button type="button" class="pl-icon-btn justify-self-end" aria-label="章节列表">
            <i data-lucide="list" class="w-5 h-5"></i>
          </button>
        </header>

        <!-- 2. 大封面 -->
        <section class="pt-8 pb-8">
          <div class="pl-cover" aria-hidden="true">
            <span class="pl-cover-spine"></span>
            <span class="ty-label text-muted-foreground">AUDIO</span>
            <span>
              <span class="ty-h3 block" style="font-size:17px;line-height:1.4;">禅与摩托车<br>维修艺术</span>
              <span class="ty-caption text-muted-foreground block mt-2" style="font-size:10px;">罗伯特·M·波西格</span>
            </span>
          </div>
        </section>

        <!-- 3. 题录 -->
        <section class="text-center pb-8">
          <h1 class="ty-h2 text-xl" style="text-wrap:balance;word-break:keep-all;">禅与摩托车维修艺术</h1>
          <p class="ty-caption text-muted-foreground font-mono mt-2">CH.12 · 罗伯特·M·波西格</p>
        </section>

        <!-- 4. 刻度进度轨 -->
        <section class="pb-8" aria-label="播放进度">
          <div class="pl-ticks" role="img" aria-label="已播放 1 小时 2 分 44 秒，剩余 1 小时 24 分 10 秒">
            <span class="pl-tick pl-tick-done"></span>
            <span class="pl-tick pl-tick-done"></span>
            <span class="pl-tick pl-tick-done"></span>
            <span class="pl-tick pl-tick-done"></span>
            <span class="pl-tick pl-tick-done"></span>
            <span class="pl-tick pl-tick-done"></span>
            <span class="pl-tick pl-tick-done"></span>
            <span class="pl-tick pl-tick-done"></span>
            <span class="pl-tick pl-tick-done"></span>
            <span class="pl-tick pl-tick-done"></span>
            <span class="pl-tick pl-tick-done"></span>
            <span class="pl-tick pl-tick-done"></span>
            <span class="pl-tick pl-tick-done"></span>
            <span class="pl-tick pl-tick-done"></span>
            <span class="pl-tick pl-tick-rest"></span>
            <span class="pl-tick pl-tick-rest"></span>
            <span class="pl-tick pl-tick-rest"></span>
            <span class="pl-tick pl-tick-rest"></span>
            <span class="pl-tick pl-tick-rest"></span>
            <span class="pl-tick pl-tick-rest"></span>
            <span class="pl-tick pl-tick-rest"></span>
            <span class="pl-tick pl-tick-rest"></span>
            <span class="pl-tick pl-tick-rest"></span>
            <span class="pl-tick pl-tick-rest"></span>
            <span class="pl-tick pl-tick-rest"></span>
            <span class="pl-tick pl-tick-rest"></span>
            <span class="pl-tick pl-tick-rest"></span>
            <span class="pl-tick pl-tick-rest"></span>
            <span class="pl-tick pl-tick-rest"></span>
            <span class="pl-tick pl-tick-rest"></span>
            <span class="pl-tick pl-tick-rest"></span>
            <span class="pl-tick pl-tick-rest"></span>
            <span class="pl-thumb"></span>
          </div>
          <div class="flex items-center justify-between pt-2">
            <span class="ty-numeric text-xs">1:02:44</span>
            <span class="ty-numeric text-xs text-muted-foreground">-1:24:10</span>
          </div>
        </section>

        <!-- 5. 控制组 -->
        <section class="pl-controls pb-8">
          <button type="button" class="pl-icon-btn w-8 h-8" aria-label="后退 30 秒">
            <i data-lucide="skip-back" class="w-8 h-8"></i>
          </button>
          <button type="button" class="pl-play" aria-label="播放">
            <i data-lucide="play" class="w-7 h-7"></i>
          </button>
          <button type="button" class="pl-icon-btn w-8 h-8" aria-label="前进 30 秒">
            <i data-lucide="skip-forward" class="w-8 h-8"></i>
          </button>
        </section>

        <!-- 6. 功能 chip 行 -->
        <section class="pl-chips pb-12">
          <button type="button" class="pl-chip" aria-label="语速 1.25 倍">
            <i data-lucide="gauge" class="w-3.5 h-3.5 text-muted-foreground"></i>
            <span class="ty-numeric text-xs">1.25x</span>
          </button>
          <button type="button" class="pl-chip" aria-label="定时 30 分钟">
            <i data-lucide="timer" class="w-3.5 h-3.5 text-muted-foreground"></i>
            <span class="ty-numeric text-xs">30 MIN</span>
          </button>
          <button type="button" class="pl-chip" aria-label="章节列表">
            <i data-lucide="list" class="w-3.5 h-3.5 text-muted-foreground"></i>
            <span class="ty-numeric text-xs">列表</span>
          </button>
        </section>

      </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
