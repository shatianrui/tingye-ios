<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>听页图标 · 墨 Ink · 线装书题签</title>
<style>
  body{margin:0;padding:48px 20px 72px;background:#F4F1EA;font-family:-apple-system,"PingFang SC",sans-serif;color:#1C1B18;text-align:center}
  h1{font-family:"Songti SC","Noto Serif CJK SC",serif;font-size:34px;margin:0 0 8px}
  p.sub{color:#6B6759;margin:0 0 40px}
  .row{display:flex;gap:40px;justify-content:center;align-items:flex-end;flex-wrap:wrap;margin-bottom:48px}
  .cap{font-size:13px;color:#6B6759;margin-top:12px}
  .icon{border-radius:22.5%;box-shadow:0 12px 32px rgba(60,50,30,.18)}
  .dark{background:#101012;padding:32px;border-radius:24px}
</style>
</head>
<body>
<h1>听页 · 墨 Ink 图标</h1>
<p class="sub">宣纸底 · 线装书 · 竖排题签「听页」 · 朱砂闲章 —— 与 v16 界面同源</p>

<div class="row">
  <div><img class="icon" src="final/AppIcon.png" width="256" height="256"><div class="cap">默认（日间）1024</div></div>
  <div class="dark"><img class="icon" src="final/AppIcon-dark.png" width="256" height="256"><div class="cap" style="color:#A5A296">夜间 1024</div></div>
  <div class="dark" style="background:#3A3A3C"><img class="icon" src="final/AppIcon-tinted.png" width="256" height="256"><div class="cap" style="color:#A5A296">着色（灰度底，iOS 施加色调）</div></div>
</div>

<div class="row">
  <div><img class="icon" src="final/AppIcon.png" width="120" height="120"><div class="cap">120</div></div>
  <div><img class="icon" src="final/AppIcon.png" width="80" height="80"><div class="cap">80</div></div>
  <div><img class="icon" src="final/AppIcon.png" width="60" height="60"><div class="cap">60</div></div>
  <div><img class="icon" src="final/AppIcon-dark.png" width="60" height="60" style="background:#101012"><div class="cap">60 夜间</div></div>
</div>

<p class="sub">源文件 ink-book.svg · 渲染 render-icons.py（--install 写入资产目录）· 校验：1024×1024 不透明 PNG</p>
</body>
</html>
