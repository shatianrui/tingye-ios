<body class="min-h-screen font-sans antialiased">
    <main class="profile-page">
        <style id="critical-layout">
            .profile-page {
                min-height: 100vh;
                width: 100%;
                margin: 0;
                background: var(--ty-surface-sunken);
                color: var(--ty-foreground);
                font-family: var(--ty-font-sans);
            }
            .profile-page,
            .profile-page *,
            .profile-page *::before,
            .profile-page *::after {
                box-sizing: border-box;
            }
            .profile-shell {
                width: 100%;
                max-width: 430px;
                min-height: 100vh;
                margin: 0 auto;
                background: var(--ty-background);
            }
            .profile-content {
                width: 100%;
                padding: 28px 20px calc(96px + env(safe-area-inset-bottom, 0px));
            }
            .profile-header {
                width: 100%;
                padding-bottom: 32px;
            }
            .profile-title {
                margin: 0;
                font-family: var(--ty-font-sans);
                font-size: 30px;
                font-weight: 700;
                line-height: 1.25;
                letter-spacing: -0.02em;
                color: var(--ty-foreground);
                word-break: keep-all;
                overflow-wrap: break-word;
            }
            .profile-subtitle {
                margin: 8px 0 0;
                font-size: 15px;
                font-weight: 400;
                line-height: 1.6;
                color: var(--ty-muted-foreground);
                text-wrap: pretty;
            }
            .reading-overview {
                width: 100%;
                margin-bottom: 36px;
            }
            .section-title {
                margin: 0 0 18px;
                font-family: var(--ty-font-sans);
                font-size: 20px;
                font-weight: 600;
                line-height: 1.3;
                letter-spacing: -0.01em;
                color: var(--ty-foreground);
                text-wrap: balance;
                word-break: keep-all;
            }
            .reading-total {
                margin: 0;
                font-family: var(--ty-font-sans);
                font-size: 40px;
                font-weight: 600;
                line-height: 1.18;
                letter-spacing: -0.03em;
                color: var(--ty-foreground);
                font-variant-numeric: tabular-nums;
                white-space: nowrap;
            }
            .reading-comparison {
                margin: 10px 0 0;
                font-size: 15px;
                font-weight: 400;
                line-height: 1.5;
                color: var(--ty-muted-foreground);
                font-variant-numeric: tabular-nums;
                white-space: nowrap;
            }
            .reading-stats {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                width: 100%;
                margin: 28px 0 0;
                padding: 24px 0 0;
                border-top: 1px solid var(--ty-hairline);
            }
            .reading-stat {
                display: flex;
                min-width: 0;
                flex-direction: column;
                gap: 4px;
                padding: 0 12px;
            }
            .reading-stat:first-child {
                padding-left: 0;
            }
            .reading-stat:last-child {
                padding-right: 0;
            }
            .reading-stat + .reading-stat {
                border-left: 1px solid var(--ty-hairline);
            }
            .stat-label {
                min-width: 0;
                margin: 0;
                font-size: 13px;
                font-weight: 400;
                line-height: 1.5;
                color: var(--ty-muted-foreground);
                white-space: nowrap;
            }
            .stat-value {
                order: -1;
                min-width: 0;
                margin: 0;
                font-family: var(--ty-font-sans);
                font-size: 20px;
                font-weight: 600;
                line-height: 1.3;
                color: var(--ty-foreground);
                font-variant-numeric: tabular-nums;
                white-space: nowrap;
            }
            .reading-footprint {
                width: 100%;
                margin-bottom: 40px;
            }
            .reading-footprint .section-title {
                margin-bottom: 12px;
            }
            .footprint-list {
                width: 100%;
                margin: 0;
                padding: 0;
                list-style: none;
                border-top: 1px solid var(--ty-hairline);
            }
            .footprint-row {
                display: grid;
                grid-template-columns: 48px minmax(0, 1fr);
                column-gap: 12px;
                align-items: center;
                width: 100%;
                min-height: 56px;
                border-bottom: 1px solid var(--ty-hairline);
            }
            .footprint-time {
                min-width: 0;
                font-family: var(--ty-font-sans);
                font-size: 13px;
                font-weight: 400;
                line-height: 1.5;
                color: var(--ty-muted-foreground);
                font-variant-numeric: tabular-nums;
                white-space: nowrap;
            }
            .footprint-entry {
                min-width: 0;
                margin: 0;
                overflow: hidden;
                font-size: 16px;
                font-weight: 400;
                line-height: 1.5;
                color: var(--ty-foreground);
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .settings-section {
                width: 100%;
            }
            .settings-list {
                width: 100%;
                border-top: 1px solid var(--ty-hairline);
                border-bottom: 1px solid var(--ty-hairline);
            }
            .settings-row {
                display: grid;
                grid-template-columns: 24px minmax(0, 1fr) 16px;
                column-gap: 12px;
                align-items: center;
                width: 100%;
                min-height: 52px;
                margin: 0;
                padding: 0;
                border: 0;
                border-radius: 0;
                background: transparent;
                color: var(--ty-foreground);
                font-family: var(--ty-font-sans);
                text-align: left;
                cursor: pointer;
                -webkit-tap-highlight-color: transparent;
            }
            .settings-row + .settings-row {
                border-top: 1px solid var(--ty-hairline);
            }
            .settings-icon,
            .settings-chevron {
                display: block;
                flex-shrink: 0;
                color: var(--ty-muted-foreground);
                stroke-width: 1.5;
                transition: color 140ms cubic-bezier(.2,.8,.2,1), transform 140ms cubic-bezier(.2,.8,.2,1);
            }
            .settings-icon {
                width: 20px;
                height: 20px;
                justify-self: center;
            }
            .settings-chevron {
                width: 16px;
                height: 16px;
            }
            .settings-label {
                min-width: 0;
                overflow: hidden;
                font-size: 16px;
                font-weight: 400;
                line-height: 1.5;
                color: var(--ty-foreground);
                text-overflow: ellipsis;
                white-space: nowrap;
                transition: color 140ms cubic-bezier(.2,.8,.2,1);
            }
            .settings-row:active {
                opacity: 0.72;
            }
            .settings-row:focus-visible,
            [data-mobile-nav="global"] a:focus-visible {
                outline: 2px solid var(--ty-ring);
                outline-offset: -2px;
                border-radius: var(--ty-radius-sm);
            }
            .profile-footer {
                position: fixed;
                right: 0;
                bottom: 0;
                left: 0;
                z-index: 20;
                width: 100%;
                padding-bottom: env(safe-area-inset-bottom, 0px);
                background: var(--ty-background);
            }
            [data-mobile-nav="global"] {
                width: 100%;
                max-width: 430px;
                height: 64px;
                margin: 0 auto;
                flex-shrink: 0;
                border-top: 1px solid var(--ty-hairline);
                background: var(--ty-background);
            }
            [data-mobile-nav="global"] > div {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                width: 100%;
                max-width: 448px;
                height: 100%;
                margin: 0 auto;
            }
            [data-mobile-nav="global"] a {
                display: flex;
                min-width: 0;
                min-height: 44px;
                height: 100%;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 4px;
                padding: 0 4px;
                color: var(--ty-muted-foreground);
                font-family: var(--ty-font-sans);
                text-decoration: none;
                -webkit-tap-highlight-color: transparent;
                transition: color 140ms cubic-bezier(.2,.8,.2,1), opacity 140ms cubic-bezier(.2,.8,.2,1);
            }
            [data-mobile-nav="global"] a[data-active="true"] {
                color: var(--ty-primary);
            }
            [data-mobile-nav="global"] a:active {
                opacity: 0.72;
            }
            [data-mobile-nav="global"] a svg {
                width: 20px;
                height: 20px;
                flex-shrink: 0;
                stroke-width: 1.5;
            }
            [data-mobile-nav="global"] a span {
                font-size: 11px;
                line-height: 1;
                white-space: nowrap;
            }
            [data-mobile-nav="global"] a[data-active="true"] span {
                font-weight: 600;
            }
            @media (hover: hover) {
                .settings-row:hover .settings-icon,
                .settings-row:hover .settings-chevron {
                    color: var(--ty-foreground);
                }
                .settings-row:hover .settings-chevron {
                    transform: translateX(2px);
                }
                [data-mobile-nav="global"] a:hover {
                    color: var(--ty-primary);
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .settings-icon,
                .settings-chevron,
                .settings-label,
                [data-mobile-nav="global"] a {
                    transition-duration: 0.01ms;
                }
                .settings-row:hover .settings-chevron {
                    transform: none;
                }
            }
        </style>
