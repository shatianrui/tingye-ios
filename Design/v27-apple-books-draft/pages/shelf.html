.dark {
  --ty-background: var(--ty-neutral-950);
  --ty-foreground: #F5F5F5;
  --ty-card: #1B1B1B;
  --ty-card-foreground: #F5F5F5;
  --ty-popover: #1B1B1B;
  --ty-popover-foreground: #F5F5F5;
  --ty-primary: #F5F5F5;
  --ty-primary-foreground: #121212;
  --ty-muted: #242424;
  --ty-muted-foreground: #A3A3A3;
  --ty-border: #2C2C2C;
  --ty-input: #2C2C2C;
  --ty-ring: #F5F5F5;
  --ty-surface-sunken: #181818;
  --ty-hairline: #2C2C2C;
  --ty-shadow-hairline: 0 1px 2px rgba(0, 0, 0, 0.30);
  --ty-shadow-float: 0 12px 32px rgba(0, 0, 0, 0.45);
}

.ty-display,
.ty-h1,
.ty-h2,
.ty-h3,
.ty-body,
.ty-caption,
.ty-label {
  font-family: var(--ty-font-sans);
}

.ty-display { font-weight: 700; line-height: 1.18; letter-spacing: -0.025em; }
.ty-h1 { font-weight: 700; line-height: 1.22; letter-spacing: -0.02em; }
.ty-h2 { font-weight: 600; line-height: 1.28; letter-spacing: -0.01em; }
.ty-h3 { font-weight: 600; line-height: 1.35; }
.ty-body { font-weight: 400; line-height: 1.6; }
.ty-caption { font-weight: 400; font-size: 13px; line-height: 1.5; }
.ty-label { font-weight: 500; font-size: 13px; line-height: 1.4; }
.ty-reading { font-family: var(--ty-font-serif); font-weight: 400; line-height: 1.95; }
.ty-numeric { font-family: var(--ty-font-sans); font-variant-numeric: tabular-nums; }

    </style>

<body class="min-h-screen font-sans antialiased">
    <main class="shelf-page">
        <style id="critical-layout">
            *, *::before, *::after { box-sizing: border-box; }
            body {
                margin: 0;
                background: var(--ty-background);
                color: var(--ty-foreground);
                font-family: var(--ty-font-sans);
            }
            button, input { font: inherit; }
            button { cursor: pointer; }
            .shelf-page {
                width: 100%;
                max-width: 480px;
                min-height: 100vh;
                margin: 0 auto;
                background: var(--ty-background);
                color: var(--ty-foreground);
                font-family: var(--ty-font-sans);
            }
            .shelf-content { padding: 32px 20px 0; }
            .library-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                margin-bottom: 20px;
            }
            .library-title {
                min-width: 0;
                flex: 1;
                margin: 0;
                overflow: hidden;
                color: var(--ty-foreground);
                font-size: 30px;
                font-weight: 700;
                line-height: 1.22;
                letter-spacing: -0.02em;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .import-button,
            .view-button {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                flex: 0 0 44px;
                width: 44px;
                height: 44px;
                padding: 0;
                border: 0;
                border-radius: var(--ty-radius-md);
                white-space: nowrap;
                transition: background-color 140ms cubic-bezier(.2,.8,.2,1), color 140ms cubic-bezier(.2,.8,.2,1), opacity 140ms cubic-bezier(.2,.8,.2,1), transform 140ms cubic-bezier(.2,.8,.2,1);
            }
            .import-button {
                background: var(--ty-primary);
                color: var(--ty-primary-foreground);
            }
            .import-button svg, .view-button svg { width: 20px; height: 20px; }
            .import-button:hover { background: var(--ty-neutral-600); }
            .import-button:active, .view-button:active, .filter-chip:active { transform: translateY(1px); }
            .import-button:focus-visible,
            .view-button:focus-visible,
            .filter-chip:focus-visible {
                outline: 2px solid var(--ty-ring);
                outline-offset: 2px;
            }
            .search-field {
                display: flex;
                align-items: center;
                gap: 10px;
                width: 100%;
                height: 48px;
                padding: 0 14px;
                border-radius: var(--ty-radius-md);
                background: var(--ty-neutral-200);
                color: var(--ty-neutral-500);
            }
            .search-field:focus-within {
                outline: 2px solid var(--ty-ring);
                outline-offset: 2px;
            }
            .search-field svg { width: 20px; height: 20px; flex: 0 0 20px; }
            .search-input {
                min-width: 0;
                flex: 1;
                height: 100%;
                padding: 0;
                border: 0;
                outline: 0;
                background: transparent;
                color: var(--ty-foreground);
                font-size: 15px;
                line-height: 1.5;
            }
            .search-input::placeholder { color: var(--ty-neutral-500); opacity: 1; }
            .search-input::-webkit-search-cancel-button { cursor: pointer; }
            .visually-hidden {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
                white-space: nowrap;
                border: 0;
            }
            .library-controls {
                display: flex;
                align-items: center;
                gap: 12px;
                margin: 16px 0 24px;
            }
            .filter-group {
                display: flex;
                align-items: center;
                flex: 1;
                min-width: 0;
                gap: 8px;
            }
            .filter-chip {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                flex: 0 0 auto;
                min-height: 44px;
                padding: 0 12px;
                border: 0;
                border-radius: var(--ty-radius-md);
                background: var(--ty-neutral-200);
                color: var(--ty-muted-foreground);
                font-size: 15px;
                font-weight: 500;
                line-height: 1;
                white-space: nowrap;
                transition: background-color 140ms cubic-bezier(.2,.8,.2,1), color 140ms cubic-bezier(.2,.8,.2,1), opacity 140ms cubic-bezier(.2,.8,.2,1), transform 140ms cubic-bezier(.2,.8,.2,1);
            }
            .filter-chip:hover, .view-button:hover { opacity: .78; }
            .filter-chip.is-selected {
                background: var(--ty-primary);
                color: var(--ty-primary-foreground);
            }
            .view-button {
                background: var(--ty-neutral-200);
                color: var(--ty-foreground);
            }
            .collection-count {
                margin: 0 0 4px;
                overflow: hidden;
                color: var(--ty-muted-foreground);
                font-size: 15px;
                font-weight: 500;
                line-height: 1.5;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .book-list {
                display: flex;
                flex-direction: column;
                margin: 0;
                padding: 0;
                list-style: none;
            }
            .book-row {
                display: flex;
                align-items: center;
                min-width: 0;
                gap: 16px;
                padding: 20px 0;
            }
            .book-row + .book-row { border-top: 1px solid var(--ty-hairline); }
            .book-cover {
                display: block;
                flex: 0 0 68px;
                width: 68px;
                height: 102px;
                aspect-ratio: 2 / 3;
                border: 1px solid var(--ty-hairline);
                border-radius: var(--ty-radius-sm);
                background: var(--ty-neutral-200);
                object-fit: cover;
                object-position: center;
            }
            .book-copy {
                display: flex;
                flex: 1;
                flex-direction: column;
                min-width: 0;
                gap: 4px;
            }
            .book-title,
            .book-author,
            .book-progress {
                min-width: 0;
                margin: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .book-title {
                color: var(--ty-foreground);
                font-size: 20px;
                font-weight: 600;
                line-height: 1.35;
                letter-spacing: -0.01em;
            }
            .book-author {
                color: var(--ty-muted-foreground);
                font-size: 15px;
                line-height: 1.5;
            }
            .book-progress {
                margin-top: 4px;
                color: var(--ty-neutral-500);
                font-size: 13px;
                line-height: 1.5;
                font-variant-numeric: tabular-nums;
            }
            .book-progress-track {
                width: 112px;
                max-width: 100%;
                height: 3px;
                margin-top: 4px;
                overflow: hidden;
                border-radius: var(--ty-radius-full);
                background: var(--ty-neutral-200);
            }
            .book-progress-value {
                display: block;
                height: 100%;
                border-radius: var(--ty-radius-full);
                background: var(--ty-primary);
            }
            .book-chevron {
                flex: 0 0 20px;
                width: 20px;
                height: 20px;
                color: var(--ty-neutral-500);
            }
            .shelf-page svg { stroke-width: 1.5; }
            [data-mobile-nav="global"] {
                width: 100%;
                height: 64px;
                flex-shrink: 0;
                border-top: 1px solid var(--ty-border);
                background: var(--ty-background);
            }
            [data-mobile-nav="global"] > div {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                width: 100%;
                max-width: 448px;
                height: 100%;
                margin: 0 auto;
            }
            [data-mobile-nav="global"] a {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 4px;
                min-width: 0;
                min-height: 44px;
                height: 100%;
                padding: 0 4px;
                color: var(--ty-muted-foreground);
                text-decoration: none;
                transition: color 140ms cubic-bezier(.2,.8,.2,1), opacity 140ms cubic-bezier(.2,.8,.2,1);
            }
            [data-mobile-nav="global"] a[data-active="true"] { color: var(--ty-primary); }
            [data-mobile-nav="global"] a:hover { color: var(--ty-primary); }
            [data-mobile-nav="global"] a:active { opacity: .72; }
            [data-mobile-nav="global"] a:focus-visible {
                outline: 2px solid var(--ty-ring);
                outline-offset: -2px;
            }
            [data-mobile-nav="global"] svg { flex-shrink: 0; width: 20px; height: 20px; }
            [data-mobile-nav="global"] span {
                max-width: 100%;
                overflow: hidden;
                font-size: 11px;
                line-height: 1;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            [data-mobile-nav="global"] a[data-active="true"] span { font-weight: 600; }
            @media (max-width: 359px) {
                .shelf-content { padding-right: 16px; padding-left: 16px; }
                .library-controls { gap: 8px; }
                .filter-chip { padding-right: 10px; padding-left: 10px; }
                .book-row { gap: 12px; }
                .book-cover { flex-basis: 64px; width: 64px; }
            }
            @media (min-width: 640px) {
                .shelf-content { padding: 40px 24px 0; }
            }
            @media (hover: none) {
                .import-button:hover { background: var(--ty-primary); }
                .filter-chip:hover, .view-button:hover { opacity: 1; }
            }
            @media (prefers-reduced-motion: reduce) {
                .import-button, .view-button, .filter-chip, [data-mobile-nav="global"] a {
                    transition-duration: .01ms;
                }
            }
        </style>
        <div class="shelf-content">
            <header class="library-header">
                <h1 class="library-title ty-h1" style="text-wrap: balance; word-break: keep-all; overflow-wrap: break-word;">书库</h1>
                <button type="button" class="import-button" aria-label="导入图书">
                    <i data-lucide="plus" aria-hidden="true"></i>
                </button>
            </header>
            <label class="search-field">
                <span class="visually-hidden">搜索书名、作者</span>

                <h2 class="collection-count">12 本图书</h2>
                <ul class="book-list">

                        <img class="book-cover" src="../assets/cover-hometown.png" alt="《故乡》封面" width="68" height="102" decoding="async">
                        <div class="book-copy">

                            <p class="book-author">朱自清</p>
                            <p class="book-progress">已读完</p>
                            <div class="book-progress-track" role="progressbar" aria-label="春阅读进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
                                <span class="book-progress-value" style="width: 100%;"></span>
                            </div>
                        </div>
                        <i data-lucide="chevron-right" class="book-chevron" aria-hidden="true"></i>
                    </li>
                    <li class="book-row">

                        <div class="book-copy">

                            <p class="book-author">泰戈尔</p>

                            <div class="book-progress-track" role="progressbar" aria-label="飞鸟集阅读进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="18">
                                <span class="book-progress-value" style="width: 18%;"></span>
                            </div>
                        </div>
                        <i data-lucide="chevron-right" class="book-chevron" aria-hidden="true"></i>
                    </li>
                </ul>
