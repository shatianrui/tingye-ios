<body class="min-h-screen font-sans antialiased">
    <main>
      <style id="critical-layout">
        *, *::before, *::after { box-sizing: border-box; }
        body {
          margin: 0;
          min-height: 100vh;
          background: var(--ty-surface-sunken);
          color: var(--ty-foreground);
          font-family: var(--ty-font-sans);
          -webkit-font-smoothing: antialiased;
        }
        .now-shell {
          width: 100%;
          max-width: 430px;
          min-height: 100vh;
          margin: 0 auto;
          background: var(--ty-background);
        }
        .now-content { padding: 20px 20px 16px; }
        .now-header { margin-bottom: 28px; }
        .now-title {
          margin: 0;
          color: var(--ty-foreground);
          font-size: 30px;
          text-wrap: balance;
          word-break: keep-all;
          overflow-wrap: break-word;
        }
        .now-date {
          margin: 6px 0 0;
          color: var(--ty-muted-foreground);
          font-size: 13px;
          line-height: 1.5;
        }
        .section-title {
          margin: 0;
          color: var(--ty-foreground);
          font-size: 20px;
          text-wrap: balance;
          word-break: keep-all;
          overflow-wrap: break-word;
        }
        .continue-section { padding-bottom: 24px; }
        .continue-layout {
          display: grid;
          grid-template-columns: 112px minmax(0, 1fr);
          gap: 18px;
          align-items: center;
          margin-top: 14px;
        }
        .book-cover {
          display: block;
          object-fit: cover;
          border: 1px solid var(--ty-hairline);
          border-radius: var(--ty-radius-sm);
          background: var(--ty-surface-sunken);
        }
        .continue-cover { width: 112px; height: 160px; }
        .continue-info { min-width: 0; }
        .book-title {
          margin: 0;
          color: var(--ty-foreground);
          font-size: 20px;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          word-break: keep-all;
        }
        .book-author {
          margin: 6px 0 0;
          color: var(--ty-muted-foreground);
          font-size: 13px;
          line-height: 1.5;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .reading-positions {
          display: grid;
          gap: 10px;
          margin-top: 20px;
        }
        .position-row {
          display: flex;
          align-items: center;
          min-width: 0;
          min-height: 24px;
          gap: 8px;
          color: var(--ty-muted-foreground);
          font-size: 13px;
          line-height: 1.5;
        }
        .position-row svg,
        .position-row i { width: 16px; height: 16px; flex-shrink: 0; }
        .position-text {
          min-width: 0;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          font-variant-numeric: tabular-nums;
        }
        .continue-button {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 100%;
          min-height: 48px;
          margin-top: 20px;
          padding: 12px 20px;
          border: 0;
          border-radius: var(--ty-radius-md);
          background: var(--ty-primary);
          color: var(--ty-primary-foreground);
          font-family: var(--ty-font-sans);
          font-size: 16px;
          font-weight: 600;
          line-height: 1.5;
          text-align: center;
          text-decoration: none;
          white-space: nowrap;
          cursor: pointer;
          transition: transform 140ms cubic-bezier(.2,.8,.2,1), background-color 140ms cubic-bezier(.2,.8,.2,1);
        }
        .continue-button:hover { background: var(--ty-primary-600); transform: translateY(-1px); }
        .continue-button:active { background: var(--ty-primary-600); transform: translateY(0); }
        .continue-button:focus-visible {
          outline: 2px solid var(--ty-ring);
          outline-offset: 3px;
        }
        .content-section {
          margin-top: 24px;
          padding-top: 24px;
          border-top: 1px solid var(--ty-border);
        }
        .recent-list {
          display: grid;
          gap: 14px;
          margin: 16px 0 0;
          padding: 0;
          list-style: none;
        }
        .recent-row {
          display: flex;
          align-items: center;
          min-width: 0;
          min-height: 74px;
          gap: 14px;
        }
        .recent-cover { width: 52px; height: 74px; flex-shrink: 0; }
        .recent-info { min-width: 0; }
        .recent-title {
          margin: 0;
          color: var(--ty-foreground);
          font-size: 16px;
          font-weight: 600;
          line-height: 1.5;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .reading-summary {
          display: flex;
          align-items: baseline;
          justify-content: space-between;
          min-width: 0;
          gap: 12px;
          margin-top: 24px;
          padding-top: 24px;
          border-top: 1px solid var(--ty-border);
        }
        .reading-summary .section-title {
          flex-shrink: 0;
          font-size: 13px;
          line-height: 1.5;
        }
        .summary-copy {
          min-width: 0;
          margin: 0;
          color: var(--ty-muted-foreground);
          font-size: 13px;
          line-height: 1.5;
          font-variant-numeric: tabular-nums;
          text-align: right;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        [data-mobile-nav="global"] {
          display: block;
          width: 100%;
          height: 64px;
          flex-shrink: 0;
          border-top: 1px solid var(--ty-border);
          background: var(--ty-background);
        }
        [data-mobile-nav="global"] > div {
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          width: 100%;
          max-width: 448px;
          height: 100%;
          margin: 0 auto;
        }
        [data-mobile-nav="global"] a {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 4px;
          min-width: 0;
          min-height: 44px;
          height: 100%;
          padding: 0 4px;
          color: var(--ty-muted-foreground);
          text-decoration: none;
          transition: color 140ms cubic-bezier(.2,.8,.2,1), opacity 140ms cubic-bezier(.2,.8,.2,1);
        }
        [data-mobile-nav="global"] a[data-active="true"] { color: var(--ty-primary); }
        [data-mobile-nav="global"] a:hover { color: var(--ty-foreground); }
        [data-mobile-nav="global"] a[data-active="true"]:hover { color: var(--ty-primary-600); }
        [data-mobile-nav="global"] a:active { opacity: .72; }
        [data-mobile-nav="global"] a:focus-visible {
          outline: 2px solid var(--ty-ring);
          outline-offset: -4px;
        }
        [data-mobile-nav="global"] a svg,
        [data-mobile-nav="global"] a i { width: 20px; height: 20px; flex-shrink: 0; }
        [data-mobile-nav="global"] a span {
          font-size: 11px;
          font-weight: 400;
          line-height: 1;
          white-space: nowrap;
        }
        [data-mobile-nav="global"] a[data-active="true"] span { font-weight: 600; }
        @media (max-width: 350px) {
          .now-content { padding-right: 16px; padding-left: 16px; }
          .continue-layout { grid-template-columns: 96px minmax(0, 1fr); gap: 14px; }
          .continue-cover { width: 96px; height: 138px; }
        }
        @media (hover: none) {
          .continue-button, [data-mobile-nav="global"] a { transition: none; }
          .continue-button:hover { transform: none; }
        }
        @media (prefers-reduced-motion: reduce) {
          .continue-button, [data-mobile-nav="global"] a { transition-duration: .01ms; }
        }
      </style>

      <div class="now-shell">
        <div class="now-content">
          <header class="now-header">

          <footer class="reading-summary" aria-labelledby="summary-title">

        </div>
