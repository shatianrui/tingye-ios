    <path d="M404 870C464 840 529 870 555 938" fill="none" stroke="#7C7C96" stroke-width="4" opacity=".28"/>
    <ellipse cx="412" cy="775" rx="22" ry="13" transform="rotate(-27 412 775)" fill="#8F92A7" opacity=".33"/>
    <ellipse cx="586" cy="832" rx="30" ry="15" transform="rotate(25 586 832)" fill="#9190A8" opacity=".3"/>
    <ellipse cx="549" cy="705" rx="79" ry="11" fill="#747D82" opacity=".22" filter="url(#shadow)"/>
  </g>
  <!-- Scarf tail: the principal identifying silhouette after the golden hair. -->
  <path d="M549 403C615 409 639 352 704 346 755 342 781 364 820 346L807 384 824 407C769 431 748 395 708 400 654 406 629 460 554 440Z" fill="url(#gold)"/>
  <path d="M599 420C651 412 661 369 711 369 754 369 773 389 808 374" fill="none" stroke="#F9E4AD" stroke-width="5" opacity=".65"/>
