<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">听页图标提案 01 · 星球上的小王子</title>
  <desc id="desc">暖纸色背景，金发、长围巾、绿色外套的少年，捧着一本书站在小星球上。</desc>
  <defs>
    <radialGradient id="bg" cx="40%" cy="32%" r="85%"><stop stop-color="#FFFCF3"/><stop offset="1" stop-color="#EDE5D6"/></radialGradient>
    <linearGradient id="world" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#D4D7DC"/><stop offset=".55" stop-color="#B5B8C4"/><stop offset="1" stop-color="#9493AA"/></linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8AA68B"/><stop offset="1" stop-color="#547862"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F2D184"/><stop offset="1" stop-color="#D6A958"/></linearGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="14" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="globeClip"><circle cx="510" cy="777" r="159"/></clipPath>
    <g id="star"><path d="M0-21C3-5 5-3 21 0 5 3 3 5 0 21-3 5-5 3-21 0-5-3-3-5 0-21Z"/></g>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <ellipse cx="511" cy="928" rx="140" ry="14" fill="#8A7E74" opacity=".13" filter="url(#shadow)"/>
  <g fill="#CBA66B">
    <use href="#star" transform="translate(253 269) scale(1.05) rotate(12)"/>
    <use href="#star" transform="translate(771 261) scale(.65)"/>
    <use href="#star" transform="translate(756 568) scale(.8) rotate(7)"/>
    <use href="#star" transform="translate(252 664) scale(.5)"/>
    <circle cx="328" cy="167" r="5"/><circle cx="687" cy="172" r="5"/><circle cx="215" cy="465" r="4"/><circle cx="823" cy="449" r="5"/>
  </g>
  <!-- Small planet, with quiet contours instead of a high-detail landscape. -->
  <circle cx="510" cy="777" r="159" fill="url(#world)"/>
  <g clip-path="url(#globeClip)">
