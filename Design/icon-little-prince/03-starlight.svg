<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">听页图标提案 03 · 星夜与玫瑰</title>
  <desc id="desc">深蓝紫星空，小王子坐在自己的星球上读书，身旁是一朵被玻璃罩保护的玫瑰。</desc>
  <defs>
    <radialGradient id="night" cx="48%" cy="43%" r="76%"><stop stop-color="#3F4663"/><stop offset=".6" stop-color="#2B304A"/><stop offset="1" stop-color="#20243B"/></radialGradient>
    <radialGradient id="planet" cx="30%" cy="14%" r="95%"><stop stop-color="#DDDACB"/><stop offset=".45" stop-color="#B7B8B7"/><stop offset="1" stop-color="#767E96"/></radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5D992"/><stop offset="1" stop-color="#D4AC62"/></linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#91AA91"/><stop offset="1" stop-color="#547563"/></linearGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" seed="7" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
