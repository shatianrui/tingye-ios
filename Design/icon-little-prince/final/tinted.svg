<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">听页图标提案 02 · 抱书的小王子</title>
  <desc id="desc">浅鼠尾草绿背景，金发少年系着金色围巾，低头读一本灰紫色封皮的书。</desc>
  <defs>
    <radialGradient id="bg" cx="45%" cy="30%" r="90%"><stop stop-color="#252525"/><stop offset="1" stop-color="#151515"/></radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#D4D4D4"/><stop offset="1" stop-color="#AAAAAA"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#F0F0F0"/><stop offset="1" stop-color="#DADADA"/></linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#929292"/><stop offset="1" stop-color="#646464"/></linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#EEEEEE"/><stop offset="1" stop-color="#CCCCCC"/></linearGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="9" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="13"/></filter>
    <g id="star"><path d="M0-24C4-6 6-4 24 0 6 4 4 6 0 24-4 6-6 4-24 0-6-4-4-6 0-24Z"/></g>
  </defs>
